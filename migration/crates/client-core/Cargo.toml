[package]
name = "hichat-client-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
hichat-protocol = { path = "../protocol" }
serde_json.workspace = true
serde.workspace = true
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
hmac = "0.12"
hkdf = "0.12"
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
