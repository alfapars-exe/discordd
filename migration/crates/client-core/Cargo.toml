[package]
name = "hichat-client-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
hichat-protocol = { path = "../protocol" }
serde_json.workspace = true
serde.workspace = true
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
