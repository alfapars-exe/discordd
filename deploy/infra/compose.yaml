name: hichat-infra
services:
  postgres:
    # PostgreSQL 18.6, multi-architecture manifest pinned on 2026-10-23.
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    restart: unless-stopped
    mem_limit: 512m
    shm_size: 128m
    environment:
      POSTGRES_DB: hichat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - /srv/hichat/postgres:/var/lib/postgresql
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - /srv/hichat/tls:/etc/postgresql/tls:ro
    # Initially localhost only. Explicitly set PG_BIND after TLS validation.
    ports:
      - '${PG_BIND:-127.0.0.1}:8080:5432'
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d hichat']
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
secrets:
  postgres_password:
    file: /srv/hichat/secrets/postgres_password
