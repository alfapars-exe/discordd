# Local administration requires access to the host/container.
local all postgres peer
local all all scram-sha-256
# Only the application role can connect over TCP, with BOTH a password
# and a CA-signed client certificate whose CN matches hichat_app.
hostssl hichat hichat_app 0.0.0.0/0 scram-sha-256 clientcert=verify-full
hostssl hichat hichat_app ::/0 scram-sha-256 clientcert=verify-full
host all all 0.0.0.0/0 reject
host all all ::/0 reject
