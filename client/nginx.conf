# HiChat client nginx config — hardened 2026-05-27
#
# Hardening applied:
# - 6/6 security headers (HSTS, CSP, X-Frame-Options, X-Content-Type-Options,
#   Referrer-Policy, Permissions-Policy) with `always` so they apply to 4xx/5xx too
# - WebSocket upgrade with 1h read/send timeout (default 60s drops idle voice)
# - X-Forwarded-* headers for downstream rate-limit IP attribution
# - client_max_body_size for file uploads
#
# Nginx pitfall reminder: any `add_header` inside a `location` block resets
# inherited headers. Security headers are repeated in the static-asset block
# below for this reason — DO NOT delete them.

# Reusable header block — applied to every response location
map $sent_http_content_type $hichat_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: https:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (always = sent on 4xx/5xx too) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $hichat_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

    # File upload limit — adjust to match application policy
    client_max_body_size 50M;

    # SPA fallback — all routes serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        # Re-apply security headers (nginx inheritance pitfall — see top comment)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $hichat_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=()" always;

        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket proxy — extended timeouts for long-lived voice/realtime connections
    location /ws {
        # Re-apply security headers (nginx inheritance pitfall)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WS — 1h idle window, TCP keepalive on
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_socket_keepalive on;
    }

    # Static asset caching — must re-declare security headers (see top comment)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $hichat_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self)" always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        expires 1y;
    }

    # Block hidden dotfiles (defense-in-depth)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
