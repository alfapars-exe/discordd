version: "2"
run:
  go: "1.25"
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    gocritic:
      enabled-checks:
        - appendAssign
        - badRegexp
        - boolExprSimplify
        - dupArg
        - dupCase
        - emptyStringTest
        - nilValReturn
        - sloppyLen
        - sloppyTypeAssert
        - unnecessaryBlock
    gosec:
      excludes:
        - G104
        - G304
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
      - linters:
          - errcheck
          - gocritic
          - gosec
          - govet
          - ineffassign
          - misspell
          - staticcheck
          - unused
        path: static/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
