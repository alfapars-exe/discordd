# HiChat! Docker Compose
#
# Usage:
#   docker-compose up        → Start all services
#   docker-compose up -d     → Start in background
#   docker-compose down      → Stop
#   docker-compose logs -f   → Follow logs
#
# The data volume preserves uploaded files and legacy migration sources.
# PostgreSQL and its backups are managed separately.

services:
  # ─── Go Backend API ───
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    # Secrets are required from the host environment (or a `.env` file
    # alongside this compose file). The ${VAR:?msg} form makes compose
    # FAIL FAST at `docker-compose up` if any secret is missing, instead
    # of starting the server with a known-insecure default. See
    # `.env.example` for the full list and how to generate values.
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=9090
      # Legacy filename — preserved so upgrading deployments don't
      # silently lose their database. New installs inherit it; rename
      # is a breaking change deferred indefinitely (it requires every
      # operator to mv the file inside the volume before restarting).
      - DATABASE_URL=${DATABASE_URL:?Set a PostgreSQL 18 URL with sslmode=verify-full}
      - HICHAT_PG_CA_PEM=${HICHAT_PG_CA_PEM:?Set the PostgreSQL CA PEM}
      - HICHAT_PG_CERT_PEM=${HICHAT_PG_CERT_PEM:?Set the PostgreSQL client certificate PEM}
      - HICHAT_PG_KEY_PEM=${HICHAT_PG_KEY_PEM:?Set the PostgreSQL client key PEM}
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (run: openssl rand -hex 32)}"
      - JWT_ACCESS_EXPIRY_MINUTES=1440
      - JWT_REFRESH_EXPIRY_DAYS=7
      - "ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (run: openssl rand -hex 32)}"
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      - UPLOAD_DIR=/data/uploads
      - UPLOAD_MAX_SIZE=26214400
    volumes:
      - hichat-data:/data
    depends_on:
      - livekit
    restart: unless-stopped

  # ─── LiveKit SFU (Voice/Video/Screen Share) ───
  livekit:
    # Pinned to a specific release. `latest` floats: LiveKit ships
    # breaking changes between majors (signaling protocol, room API,
    # ICE config defaults) and an unattended `docker-compose pull`
    # could silently swap in an incompatible build. Bump this tag
    # deliberately after testing the corresponding client SDK.
    image: livekit/livekit-server:v1.9.12
    ports:
      - "7880:7880"     # WebSocket signaling
      - "7881:7881"     # WebRTC over TCP
      - "50000-50030:50000-50030/udp"  # WebRTC UDP media
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  # ─── React Frontend (development) ───
  # In production, build output is served via nginx instead.
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: development
    ports:
      - "3030:3030"
    volumes:
      - ./client/src:/app/client/src
      - ./client/public:/app/client/public
      # Keep shared browser-facing contracts live while editing Electron sources.
      - ./electron/voice-overlay-contract.ts:/app/electron/voice-overlay-contract.ts:ro
      - ./electron/overlay-media-contract.ts:/app/electron/overlay-media-contract.ts:ro
      - ./electron/cs2-join-contract.ts:/app/electron/cs2-join-contract.ts:ro
    environment:
      - VITE_API_URL=http://localhost:9090
    depends_on:
      - server

volumes:
  hichat-data:
    driver: local
