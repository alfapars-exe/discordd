name: Build & Release Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required for the docker-publish job to push to GitHub Container Registry.
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped from the matrix: signing/notarization needs Apple
        # certificate secrets the repo doesn't have, so the job dies at
        # "Import Apple certificate" and takes the whole release with it
        # (release.needs: [build] treats a failed matrix entry as a failed
        # job). Re-enable by populating APPLE_CERTIFICATE +
        # APPLE_CERTIFICATE_PASSWORD + APPLE_API_KEY secrets.
        include:
          - platform: windows-latest
            label: windows-x64
          - platform: ubuntu-22.04
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # LFS objects must be pulled because icons/hlogo.ico (and the
          # ios/electron icon assets) are stored in LFS — without this flag
          # the working tree gets pointer files, rcedit chokes with
          # "Reserved header is not 0", and the icon embed step dies.
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # node-gyp requires distutils (removed in Python 3.12+)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Linux: X11 dev headers for uiohook-napi native build
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libxtst-dev libx11-dev libxrandr-dev libxinerama-dev

      # ─── macOS: generate .icns from PNG ───
      - name: Generate macOS icon
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p icons/icon.iconset
          sips -z 16 16     icons/hlogo.png --out icons/icon.iconset/icon_16x16.png
          sips -z 32 32     icons/hlogo.png --out icons/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icons/hlogo.png --out icons/icon.iconset/icon_32x32.png
          sips -z 64 64     icons/hlogo.png --out icons/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icons/hlogo.png --out icons/icon.iconset/icon_128x128.png
          sips -z 256 256   icons/hlogo.png --out icons/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icons/hlogo.png --out icons/icon.iconset/icon_256x256.png
          sips -z 512 512   icons/hlogo.png --out icons/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icons/hlogo.png --out icons/icon.iconset/icon_512x512.png
          iconutil -c icns icons/icon.iconset -o icons/icon.icns
          rm -rf icons/icon.iconset

      # ─── macOS: import code signing certificate ───
      - name: Import Apple certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm certificate.p12

      # ─── macOS: write API key for notarization ───
      - name: Prepare Apple API key
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-keys"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/apple-keys/AuthKey.p8"

      # ─── Windows: setup MSVC for native audio-capture.exe ───
      - name: Setup MSVC
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # ─── Install dependencies ───
      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      # ─── Build client (Vite) ───
      - name: Build client
        run: npx vite build --outDir dist
        working-directory: client

      # ─── Windows: compile native audio-capture.exe ───
      # Flags mirror native/build.bat (P0-EN-01 hardening, audit 2026-05-27):
      # /GS /sdl /guard:cf compile-side, /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA
      # /GUARD:CF link-side. /WX deliberately omitted: the runner's MSVC is
      # newer than the 2019 BuildTools pinned in build.bat, so a toolchain
      # bump promoting new warnings would brick release builds — the verify
      # step below asserts the hardening landed instead.
      - name: Compile audio-capture.exe
        if: matrix.platform == 'windows-latest'
        run: cl.exe /EHsc /O2 /W3 /GS /sdl /guard:cf native\audio-capture.cpp /Fe:native\audio-capture.exe ole32.lib mmdevapi.lib /link /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /GUARD:CF
        shell: cmd

      # Fail the build if any P0-EN-01 hardening flag is missing from the
      # produced binary. /loadconfig is included because CFG reports as
      # "CF Instrumented" there ("Control Flow Guard" in newer dumpbin
      # /headers output). Each flag is asserted individually — build.bat's
      # findstr check passes when ANY one pattern matches, which is why a
      # regression here would otherwise go unnoticed.
      - name: Verify audio-capture.exe hardening flags
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $out = (dumpbin.exe /headers /loadconfig native\audio-capture.exe) -join "`n"
          $required = [ordered]@{
            'NX compatible (DEP)'           = 'NX compatible'
            'Dynamic base (ASLR)'           = 'Dynamic base'
            'High Entropy VA (64-bit ASLR)' = 'High Entropy Virtual Addresses'
            'Control Flow Guard (CFG)'      = 'Control Flow Guard|CF Instrumented'
          }
          $missing = @($required.GetEnumerator() | Where-Object { $out -notmatch $_.Value } | ForEach-Object { $_.Key })
          if ($missing.Count) {
            Write-Host "::error::audio-capture.exe is missing hardening flags: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All hardening flags present: $($required.Keys -join ', ')"

      # ─── Compile Electron TypeScript ───
      - name: Compile Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      # ─── Platform-specific builds ───

      # Windows: 3-phase build (unpacked → rcedit icon → NSIS installer)
      - name: Build Windows (unpacked)
        if: matrix.platform == 'windows-latest'
        run: npx electron-builder --win --dir

      - name: Embed Windows icon
        if: matrix.platform == 'windows-latest'
        # exe name comes from package.json:build.win.executableName ("HiChat").
        #
        # Icon source: icons\hlogo.ico — the same multi-resolution .ico
        # electron-builder consumes via package.json's win.icon. Earlier
        # this step pointed at release\.icon-ico\icon.ico, expecting
        # electron-builder to derive a cached copy from a PNG source; that
        # cache directory only materializes when win.icon is a PNG. Once
        # win.icon switched to a .ico directly, electron-builder skipped
        # the derivation and rcedit died with "Cannot open icon file".
        run: node_modules\rcedit\bin\rcedit-x64.exe release\win-unpacked\HiChat.exe --set-icon icons\hlogo.ico
        shell: cmd

      - name: Generate app-update.yml
        if: matrix.platform == 'windows-latest'
        run: |
          @"
          provider: github
          owner: alfapars-exe
          repo: discordd
          updaterCacheDirName: hichat-desktop-updater
          "@ | Set-Content -Path "release/win-unpacked/resources/app-update.yml" -Encoding UTF8
        shell: pwsh

      - name: Build Windows NSIS
        if: matrix.platform == 'windows-latest'
        run: npx electron-builder --win nsis --prepackaged release/win-unpacked --publish never

      # macOS: DMG with code signing + notarization
      # electron-builder reads CSC_LINK/CSC_KEY_PASSWORD for signing.
      # @electron/notarize reads APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_PATH, APPLE_TEAM_ID.
      - name: Build macOS DMG
        if: startsWith(matrix.platform, 'macos')
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ format('{0}/apple-keys/AuthKey.p8', runner.temp) }}
        run: npx electron-builder --mac --arm64 --publish never

      # Linux: AppImage
      - name: Build Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: npx electron-builder --linux --publish never

      # ─── Publish build outputs directly to the GitHub release ───
      # Replaced actions/upload-artifact + a separate release job: installers
      # only passed through Actions artifact storage to be re-downloaded one
      # job later, and once enough ~120MB installers accumulated the account
      # artifact quota hard-failed the whole pipeline ("Artifact storage
      # quota has been hit", v2.11.101 attempt). Release assets do NOT count
      # against Actions artifact storage, so each matrix leg uploads its own
      # files straight to the release. Both legs race on `gh release create`;
      # the loser falls through to upload (file sets are disjoint:
      # latest.yml vs latest-linux.yml).
      - name: Publish artifacts to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          [ -z "$NOTES" ] && NOTES="Release $TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" || echo "release exists; uploading assets"
          shopt -s nullglob
          FILES=(release/hichat-setup.* release/latest*.yml)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: no build outputs matched release/hichat-setup.* — check artifactName"
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

  # ─── Self-host server: multi-arch Docker image to GHCR ───
  # Replaced the previous CGO_ENABLED=0 cross-compile that was marked
  # continue-on-error because go-libsql (the Turso wire-protocol driver)
  # is CGO-only and refused to link with cross-toolchains. A Docker
  # image solves the toolchain problem inside the container, ships
  # reproducibly from the same Dockerfile that HF Spaces builds from,
  # and gives self-hosters a single `docker run` UX.
  docker-publish:
    # Tag pushes only: a tagless workflow_dispatch (CI smoke test) must not
    # overwrite :latest on GHCR — and github.ref_name for a branch containing
    # a slash would be an invalid docker tag anyway.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the repository owner — GHCR rejects uppercase paths and
      # GitHub orgs/users with mixed-case names would otherwise fail here.
      - name: Compute image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/hichat-server" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The former `release` job (download-artifact → gh release create) was
  # removed: build legs publish directly to the release above, so nothing
  # passes through Actions artifact storage anymore.
