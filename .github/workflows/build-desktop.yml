name: Build & Release Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required for the docker-publish job to push to GitHub Container Registry.
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped from the matrix: signing/notarization needs Apple
        # certificate secrets the repo doesn't have, so the job dies at
        # "Import Apple certificate" and takes the whole release with it
        # (release.needs: [build] treats a failed matrix entry as a failed
        # job). Re-enable by populating APPLE_CERTIFICATE +
        # APPLE_CERTIFICATE_PASSWORD + APPLE_API_KEY secrets.
        include:
          - platform: windows-latest
            label: windows-x64
          - platform: ubuntu-22.04
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # LFS objects must be pulled because icons/hlogo.ico (and the
          # ios/electron icon assets) are stored in LFS — without this flag
          # the working tree gets pointer files, rcedit chokes with
          # "Reserved header is not 0", and the icon embed step dies.
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # node-gyp requires distutils (removed in Python 3.12+)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Linux: X11 dev headers for uiohook-napi native build
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libxtst-dev libx11-dev libxrandr-dev libxinerama-dev

      # ─── macOS: generate .icns from PNG ───
      - name: Generate macOS icon
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p icons/icon.iconset
          sips -z 16 16     icons/hlogo.png --out icons/icon.iconset/icon_16x16.png
          sips -z 32 32     icons/hlogo.png --out icons/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icons/hlogo.png --out icons/icon.iconset/icon_32x32.png
          sips -z 64 64     icons/hlogo.png --out icons/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icons/hlogo.png --out icons/icon.iconset/icon_128x128.png
          sips -z 256 256   icons/hlogo.png --out icons/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icons/hlogo.png --out icons/icon.iconset/icon_256x256.png
          sips -z 512 512   icons/hlogo.png --out icons/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icons/hlogo.png --out icons/icon.iconset/icon_512x512.png
          iconutil -c icns icons/icon.iconset -o icons/icon.icns
          rm -rf icons/icon.iconset

      # ─── macOS: import code signing certificate ───
      - name: Import Apple certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm certificate.p12

      # ─── macOS: write API key for notarization ───
      - name: Prepare Apple API key
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-keys"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/apple-keys/AuthKey.p8"

      # ─── Windows: setup MSVC for native audio-capture.exe ───
      - name: Setup MSVC
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # ─── Install dependencies ───
      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      # ─── Build client (Vite) ───
      - name: Build client
        run: npx vite build --outDir dist
        working-directory: client

      # ─── Windows: compile native audio-capture.exe ───
      - name: Compile audio-capture.exe
        if: matrix.platform == 'windows-latest'
        run: cl.exe /EHsc /O2 /W3 native\audio-capture.cpp /Fe:native\audio-capture.exe ole32.lib mmdevapi.lib
        shell: cmd

      # ─── Compile Electron TypeScript ───
      - name: Compile Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      # ─── Platform-specific builds ───

      # Windows: 3-phase build (unpacked → rcedit icon → NSIS installer)
      - name: Build Windows (unpacked)
        if: matrix.platform == 'windows-latest'
        run: npx electron-builder --win --dir

      - name: Embed Windows icon
        if: matrix.platform == 'windows-latest'
        # exe name comes from package.json:build.win.executableName ("HiChat").
        #
        # Icon source: the multi-resolution .ico that electron-builder just
        # generated at release\.icon-ico\icon.ico from package.json's
        # win.icon (icons/hlogo.png). Using the freshly-derived file means
        # every brand refresh of hlogo.png flows automatically into the
        # embedded exe icon — no separate icons/hichat-icon.ico to keep
        # in sync, no chance of the installer + taskbar icon drifting
        # from the in-app sidebar/splash logo.
        run: node_modules\rcedit\bin\rcedit-x64.exe release\win-unpacked\HiChat.exe --set-icon release\.icon-ico\icon.ico
        shell: cmd

      - name: Generate app-update.yml
        if: matrix.platform == 'windows-latest'
        run: |
          @"
          provider: github
          owner: alfapars-exe
          repo: discordd
          updaterCacheDirName: hichat-desktop-updater
          "@ | Set-Content -Path "release/win-unpacked/resources/app-update.yml" -Encoding UTF8
        shell: pwsh

      - name: Build Windows NSIS
        if: matrix.platform == 'windows-latest'
        run: npx electron-builder --win nsis --prepackaged release/win-unpacked --publish never

      # macOS: DMG with code signing + notarization
      # electron-builder reads CSC_LINK/CSC_KEY_PASSWORD for signing.
      # @electron/notarize reads APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_PATH, APPLE_TEAM_ID.
      - name: Build macOS DMG
        if: startsWith(matrix.platform, 'macos')
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ format('{0}/apple-keys/AuthKey.p8', runner.temp) }}
        run: npx electron-builder --mac --arm64 --publish never

      # Linux: AppImage
      - name: Build Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: npx electron-builder --linux --publish never

      # ─── Upload artifacts ───
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.label }}
          # artifactName in package.json is hichat-setup.${ext} after the
          # rebrand. Glob still matched the legacy mqvi-* name → upload
          # picked up zero files → release had no installer.
          path: |
            release/hichat-setup.*
            release/latest*.yml

  # ─── Self-host server: multi-arch Docker image to GHCR ───
  # Replaced the previous CGO_ENABLED=0 cross-compile that was marked
  # continue-on-error because go-libsql (the Turso wire-protocol driver)
  # is CGO-only and refused to link with cross-toolchains. A Docker
  # image solves the toolchain problem inside the container, ships
  # reproducibly from the same Dockerfile that HF Spaces builds from,
  # and gives self-hosters a single `docker run` UX.
  docker-publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the repository owner — GHCR rejects uppercase paths and
      # GitHub orgs/users with mixed-case names would otherwise fail here.
      - name: Compute image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/hichat-server" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Create release and upload all artifacts ───
  release:
    # Only desktop builds gate the release. build-server is best-effort and
    # marked continue-on-error; if it succeeds its artifacts are picked up
    # via the merge-multiple download below.
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # LFS objects must be pulled because icons/hlogo.ico (and the
          # ios/electron icon assets) are stored in LFS — without this flag
          # the working tree gets pointer files, rcedit chokes with
          # "Reserved header is not 0", and the icon embed step dies.
          lfs: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi

          # Create release with tag annotation as notes
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            artifacts/* \
            || echo "Release may already exist, uploading assets..."

          # If release already exists, just upload
          gh release upload "$TAG" artifacts/* --clobber 2>/dev/null || true
