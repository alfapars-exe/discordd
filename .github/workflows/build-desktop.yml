name: Build & Release Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required for the docker-publish job to push to GitHub Container Registry.
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS dropped from the matrix: signing/notarization needs Apple
        # certificate secrets the repo doesn't have, so the job dies at
        # "Import Apple certificate" and takes the whole release with it
        # (release.needs: [build] treats a failed matrix entry as a failed
        # job). Re-enable by populating APPLE_CERTIFICATE +
        # APPLE_CERTIFICATE_PASSWORD + APPLE_API_KEY secrets.
        include:
          - platform: windows-latest
            label: windows-x64
          - platform: ubuntu-22.04
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # LFS objects must be pulled because icons/hlogo.ico (and the
          # ios/electron icon assets) are stored in LFS — without this flag
          # the working tree gets pointer files, rcedit chokes with
          # "Reserved header is not 0", and the icon embed step dies.
          lfs: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # node-gyp requires distutils (removed in Python 3.12+)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Linux: X11 dev headers for uiohook-napi native build
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libxtst-dev libx11-dev libxrandr-dev libxinerama-dev

      # ─── macOS: generate .icns from PNG ───
      - name: Generate macOS icon
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p icons/icon.iconset
          sips -z 16 16     icons/hlogo.png --out icons/icon.iconset/icon_16x16.png
          sips -z 32 32     icons/hlogo.png --out icons/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icons/hlogo.png --out icons/icon.iconset/icon_32x32.png
          sips -z 64 64     icons/hlogo.png --out icons/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icons/hlogo.png --out icons/icon.iconset/icon_128x128.png
          sips -z 256 256   icons/hlogo.png --out icons/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icons/hlogo.png --out icons/icon.iconset/icon_256x256.png
          sips -z 512 512   icons/hlogo.png --out icons/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icons/hlogo.png --out icons/icon.iconset/icon_512x512.png
          iconutil -c icns icons/icon.iconset -o icons/icon.icns
          rm -rf icons/icon.iconset

      # ─── macOS: import code signing certificate ───
      - name: Import Apple certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm certificate.p12

      # ─── macOS: write API key for notarization ───
      - name: Prepare Apple API key
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-keys"
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/apple-keys/AuthKey.p8"

      # ─── Windows: setup MSVC for native audio-capture.exe ───
      - name: Setup MSVC
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # ─── Install dependencies ───
      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Verify packaged microphone worklet remains CSP-compatible
        run: node --test scripts/audio-build-csp.test.mjs
        working-directory: client

      # ─── Build client (Vite) ───
      - name: Build client
        run: npx vite build --outDir dist
        working-directory: client

      # ─── Windows: compile native audio-capture.exe ───
      # Flags mirror native/build.bat (P0-EN-01 hardening, audit 2026-05-27):
      # /GS /sdl /guard:cf compile-side, /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA
      # /GUARD:CF link-side. /WX deliberately omitted: the runner's MSVC may
      # be newer than the local toolchain build.bat discovers via vswhere, so
      # a toolchain bump promoting new warnings would brick release builds —
      # the verify step below asserts the hardening landed instead.
      - name: Compile audio-capture.exe
        if: matrix.platform == 'windows-latest'
        run: cl.exe /EHsc /O2 /W3 /GS /sdl /guard:cf native\audio-capture.cpp /Fe:native\audio-capture.exe ole32.lib mmdevapi.lib /link /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /GUARD:CF
        shell: cmd

      # Standalone foreground-window query helper. It reads only the current
      # foreground HWND/PID/path/bounds; it does not enumerate or inject.
      - name: Compile game-window.exe
        if: matrix.platform == 'windows-latest'
        run: cl.exe /nologo /std:c++17 /EHsc /O2 /W3 /WX /GS /sdl /guard:cf /DUNICODE /D_UNICODE native\game-window.cpp /Fe:native\game-window.exe user32.lib /link /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /GUARD:CF
        shell: cmd

      - name: Verify game-window.exe hardening flags
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $out = (dumpbin.exe /headers /loadconfig native/game-window.exe) -join "`n"
          $required = [ordered]@{
            'NX compatible (DEP)'           = 'NX compatible'
            'Dynamic base (ASLR)'           = 'Dynamic base'
            'High Entropy VA (64-bit ASLR)' = 'High Entropy Virtual Addresses'
            'Control Flow Guard (CFG)'      = 'Control Flow Guard|CF Instrumented'
          }
          $missing = @($required.GetEnumerator() | Where-Object { $out -notmatch $_.Value } | ForEach-Object { $_.Key })
          if ($missing.Count) {
            Write-Host "::error::game-window.exe is missing hardening flags: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All hardening flags present: $($required.Keys -join ', ')"

      # Fail the build if any P0-EN-01 hardening flag is missing from the
      # produced binary. /loadconfig is included because CFG reports as
      # "CF Instrumented" there ("Control Flow Guard" in newer dumpbin
      # /headers output). Each flag is asserted individually — native/build.bat
      # applies the same per-flag findstr check locally (aligned 2026-06-11).
      - name: Verify audio-capture.exe hardening flags
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $out = (dumpbin.exe /headers /loadconfig native\audio-capture.exe) -join "`n"
          $required = [ordered]@{
            'NX compatible (DEP)'           = 'NX compatible'
            'Dynamic base (ASLR)'           = 'Dynamic base'
            'High Entropy VA (64-bit ASLR)' = 'High Entropy Virtual Addresses'
            'Control Flow Guard (CFG)'      = 'Control Flow Guard|CF Instrumented'
          }
          $missing = @($required.GetEnumerator() | Where-Object { $out -notmatch $_.Value } | ForEach-Object { $_.Key })
          if ($missing.Count) {
            Write-Host "::error::audio-capture.exe is missing hardening flags: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All hardening flags present: $($required.Keys -join ', ')"

      # ─── Compile Electron TypeScript ───
      - name: Compile Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      # ─── Platform-specific builds ───

      # Windows: 3-phase build (unpacked → rcedit icon → NSIS installer)
      - name: Build Windows (unpacked)
        if: matrix.platform == 'windows-latest'
        run: npx electron-builder --win --dir

      - name: Embed Windows icon
        if: matrix.platform == 'windows-latest'
        # exe name comes from package.json:build.win.executableName ("HiChat").
        #
        # Icon source: icons\hlogo.ico — the same multi-resolution .ico
        # electron-builder consumes via package.json's win.icon. Earlier
        # this step pointed at release\.icon-ico\icon.ico, expecting
        # electron-builder to derive a cached copy from a PNG source; that
        # cache directory only materializes when win.icon is a PNG. Once
        # win.icon switched to a .ico directly, electron-builder skipped
        # the derivation and rcedit died with "Cannot open icon file".
        run: node_modules\rcedit\bin\rcedit-x64.exe release\win-unpacked\HiChat.exe --set-icon icons\hlogo.ico
        shell: cmd

      - name: Generate app-update.yml
        if: matrix.platform == 'windows-latest'
        run: |
          @"
          provider: generic
          url: https://huggingface.co/datasets/infinayazilim/hichat-releases/resolve/main/
          "@ | Set-Content -Path "release/win-unpacked/resources/app-update.yml" -Encoding UTF8
        shell: pwsh

      - name: Build Windows NSIS
        if: matrix.platform == 'windows-latest'
        run: npx electron-builder --win nsis --prepackaged release/win-unpacked --publish never

      # Exercise the real upgrade path on this clean GitHub-hosted Windows
      # runner before publishing either updater feed. Never run installers on
      # a developer workstation: NSIS replaces the installed application.
      - name: Verify Windows install and upgrade
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify-windows-upgrade.ps1 -CurrentInstaller "${{ github.workspace }}/release/hichat-setup.exe" -PreviousVersion "2.11.113"

      # macOS: DMG with code signing + notarization
      # electron-builder reads CSC_LINK/CSC_KEY_PASSWORD for signing.
      # @electron/notarize reads APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_PATH, APPLE_TEAM_ID.
      - name: Build macOS DMG
        if: startsWith(matrix.platform, 'macos')
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ format('{0}/apple-keys/AuthKey.p8', runner.temp) }}
        run: npx electron-builder --mac --arm64 --publish never

      # Linux: AppImage
      - name: Build Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: npx electron-builder --linux --publish never

      # ─── Publish build outputs to the public HF Dataset ───
      # The source repository may remain private. Only the installer files
      # and electron-updater metadata are public release artifacts.
      - name: Publish artifacts to Hugging Face
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          HF_RELEASE_TOKEN: ${{ secrets.HF_RELEASE_TOKEN }}
        run: |
          test -n "$HF_RELEASE_TOKEN" || { echo "HF_RELEASE_TOKEN is required for release artifact publishing"; exit 1; }
          python -m pip install --disable-pip-version-check --no-input "huggingface_hub==1.26.0"
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          outputs = list(Path('release').glob('hichat-setup.*'))
          manifests = list(Path('release').glob('latest*.yml'))
          if not outputs or not manifests:
              raise SystemExit('Installer outputs and updater metadata are required')
          # One commit publishes matching artifact bytes and metadata together.
          HfApi(token=os.environ['HF_RELEASE_TOKEN']).upload_folder(
              repo_id='infinayazilim/hichat-releases', repo_type='dataset',
              folder_path='release', path_in_repo='',
              allow_patterns=['hichat-setup.*', 'latest*.yml'],
              commit_message='Publish ' + os.environ['GITHUB_REF_NAME'])
          PY

      # Existing installations up to 2.11.110 still check the GitHub provider.
      # A draft collects both platforms; only the final job makes it visible.
      - name: Stage legacy updater bridge
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "HiChat! ${GITHUB_REF_NAME}" \
              --notes "HiChat desktop update: audio output controls, connection recovery and compatibility fixes." \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true \
            || { echo 'Refusing to replace files of an already published release'; exit 1; }
          shopt -s nullglob
          FILES=(release/hichat-setup.* release/latest*.yml)
          test ${#FILES[@]} -gt 0
          gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber

  publish-legacy-bridge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish complete compatibility release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  # ─── Self-host server: multi-arch Docker image to GHCR ───
  # Replaced the previous CGO_ENABLED=0 cross-compile that was marked
  # continue-on-error because go-libsql (the Turso wire-protocol driver)
  # is CGO-only and refused to link with cross-toolchains. A Docker
  # image solves the toolchain problem inside the container, ships
  # reproducibly from the same Dockerfile that HF Spaces builds from,
  # and gives self-hosters a single `docker run` UX.
  docker-publish:
    # Tag pushes only: a tagless workflow_dispatch (CI smoke test) must not
    # overwrite :latest on GHCR — and github.ref_name for a branch containing
    # a slash would be an invalid docker tag anyway.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the repository owner — GHCR rejects uppercase paths and
      # GitHub orgs/users with mixed-case names would otherwise fail here.
      - name: Compute image name
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/hichat-server" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # New clients use the HF Dataset; the public GitHub bridge also serves
  # older installations until they have installed a generic-feed version.
