name: Review and deploy HF Space

on:
  workflow_dispatch:
    inputs:
      expected_space_head:
        description: Reviewed current HF Space commit (compare-and-swap)
        required: true
        type: string
      publish:
        description: Publish reviewed application sources (otherwise preview only)
        required: true
        default: false
        type: boolean
      reviewed_plan_sha256:
        description: Exact SHA-256 from the reviewed preview (required to publish)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-hichat-hf-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input huggingface_hub==1.26.0
      - name: Review or publish application source
        env:
          HF_TOKEN: ${{ secrets.HF_RELEASE_TOKEN }}
          EXPECTED_HEAD: ${{ inputs.expected_space_head }}
          PUBLISH: ${{ inputs.publish }}
          REVIEWED_PLAN: ${{ inputs.reviewed_plan_sha256 }}
        shell: bash
        run: |
          ARGS=(--expected-head "$EXPECTED_HEAD")
          if [ "$PUBLISH" = true ]; then ARGS+=(--publish --reviewed-plan-sha256 "$REVIEWED_PLAN"); fi
          python scripts/publish-hf-space.py "${ARGS[@]}"
