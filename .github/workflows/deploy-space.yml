name: Review and deploy HF Space

on:
  workflow_dispatch:
    inputs:
      expected_space_head:
        description: Reviewed current HF Space commit (compare-and-swap)
        required: true
        type: string
      publish:
        description: Publish reviewed application sources (otherwise preview only)
        required: true
        default: false
        type: boolean
      reviewed_plan_sha256:
        description: Exact SHA-256 from the reviewed preview (required to publish)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-hichat-hf-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input huggingface_hub==1.26.0
      - name: Review or publish application source
        id: source
        env:
          HF_TOKEN: ${{ secrets.HF_RELEASE_TOKEN }}
          EXPECTED_HEAD: ${{ inputs.expected_space_head }}
          PUBLISH: ${{ inputs.publish }}
          REVIEWED_PLAN: ${{ inputs.reviewed_plan_sha256 }}
        shell: bash
        run: |
          ARGS=(--expected-head "$EXPECTED_HEAD")
          if [ "$PUBLISH" = true ]; then ARGS+=(--publish --reviewed-plan-sha256 "$REVIEWED_PLAN"); fi
          python scripts/publish-hf-space.py "${ARGS[@]}"
      - name: Verify deployed revision and readiness
        if: inputs.publish
        env:
          HF_TOKEN: ${{ secrets.HF_RELEASE_TOKEN }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.deployed_commit }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen
          from huggingface_hub import HfApi
          api = HfApi()
          repo = 'infinayazilim/discord'
          expected = os.environ['EXPECTED_COMMIT']
          if len(expected) != 40 or any(c not in '0123456789abcdef' for c in expected):
              raise SystemExit('Publisher did not return a valid deployment commit')
          previous = None
          saw_new_build = False
          for attempt in range(60):
              info = api.space_info(repo, expand=['sha', 'runtime'])
              if info.sha != expected:
                  raise SystemExit('Space changed during deployment verification')
              runtime = info.runtime
              state = (runtime.stage, runtime.raw.get('sha')) if runtime else ('PENDING', None)
              if state[0] in ('BUILDING', 'RUNNING_BUILDING', 'APP_STARTING'):
                  saw_new_build = True
              if state != previous:
                  print(json.dumps({'stage': state[0], 'runtime_commit': state[1], 'expected_commit': expected}), flush=True)
                  previous = state
              if state[1] == expected and state[0] == 'RUNNING':
                  try:
                      with urlopen('https://infinayazilim-discord.hf.space/api/ready', timeout=10) as response:
                          ready = json.load(response)
                      if ready.get('status') == 'ready':
                          print(json.dumps({'verified_runtime_commit': expected, 'readiness': 'ready'}))
                          break
                  except (OSError, ValueError):
                      pass
              if state[0] in ('BUILD_ERROR', 'RUNTIME_ERROR', 'CONFIG_ERROR') and (saw_new_build or attempt >= 6):
                  raise SystemExit('New Space revision failed to start')
              time.sleep(20)
          else:
              raise SystemExit('New Space revision did not become ready within 20 minutes')
          PY
