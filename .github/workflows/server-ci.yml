name: Server CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same branch/PR.
# Release tag builds still run independently via build-desktop.yml.
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Go server: vet + non-heavy tests + build ───
  server-test:
    name: Go base tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # Patched crypto/x509: GO-2026-6809 / CVE-2026-111943.
          cache: true
          cache-dependency-path: server/go.sum

      # go-libsql (database/database.go) is a CGO-only driver.
      # Ubuntu runners ship with gcc, so CGO defaults to enabled here.
      # Self-host distribution moved to a multi-arch Docker image (see
      # build-desktop.yml's docker-publish job), so we no longer maintain
      # a CGO_ENABLED=0 fallback build path.
      - name: go vet
        run: go vet ./...
        working-directory: server

      # go mod tidy diff check — the Dockerfile used to call `go mod tidy`
      # at build time, which made image builds non-reproducible (a moving
      # registry could shift indirect deps between identical commits).
      # Tidy now runs here instead; if go.mod/go.sum drift the CI fails
      # and the developer is expected to commit the tidy result.
      - name: go mod tidy (no drift)
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod or go.sum is out of date. Run 'go mod tidy' in server/ and commit the result."
            exit 1
          fi
        working-directory: server

      - name: Go shard runner unit tests
        run: python3 -m unittest scripts/test_go_test_shard.py

      - name: Welcome bot tests and vet (independent Go module)
        working-directory: bots/welcome-bot
        run: |
          go test ./... -count=1 -timeout=60s
          go vet ./...

      - name: Pinned JS solver Linux process and real Deno contracts
        shell: bash
        run: |
          docker build --tag hichat-js-solver-test deploy/music-worker/solver
          # Process fixtures create executable test stubs in /tmp. The container
          # remains network-isolated, read-only, and receives no runtime secrets.
          docker run --rm --network none --read-only --memory 1g --cpus 2 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777 \
            --mount "type=bind,source=$PWD/deploy/music-worker/solver/test_app.py,target=/app/test_app.py,readonly" \
            hichat-js-solver-test python -m unittest -v test_app

      - name: go test (race + cover, remaining packages)
        shell: bash
        run: |
          package_list=$(go list ./...)
          mapfile -t packages < <(printf '%s\n' "$package_list" | grep -vE '/(repository|services)$')
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No non-sharded Go packages discovered"
            exit 1
          fi
          printf 'Testing %s non-sharded packages\n' "${#packages[@]}"
          mkdir -p "$RUNNER_TEMP/go-coverage"
          go test -race -covermode=atomic -coverprofile="$RUNNER_TEMP/go-coverage/base.out" -timeout=15m "${packages[@]}"
          python3 ../scripts/coverage-meta.py "$RUNNER_TEMP/go-coverage/base.out"
        working-directory: server

      - name: Upload base coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-coverage-base
          path: ${{ runner.temp }}/go-coverage/
          if-no-files-found: error

      - name: go build
        run: go build -trimpath -o /tmp/mqvi-server .
        working-directory: server

  # Repository and service packages dominate race+coverage runtime. Discover
  # their Test* functions at runtime and assign them in deterministic SHA-256
  # order, round-robin, so every test appears in exactly one balanced shard.
  # Each shard retains the same race, coverage, and 15-minute timeout gates.
  server-test-shards:
    name: Go tests (${{ matrix.package }} shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./repository, shard: 0, shards: 8 }
          - { package: ./repository, shard: 1, shards: 8 }
          - { package: ./repository, shard: 2, shards: 8 }
          - { package: ./repository, shard: 3, shards: 8 }
          - { package: ./repository, shard: 4, shards: 8 }
          - { package: ./repository, shard: 5, shards: 8 }
          - { package: ./repository, shard: 6, shards: 8 }
          - { package: ./repository, shard: 7, shards: 8 }
          - { package: ./services, shard: 0, shards: 8 }
          - { package: ./services, shard: 1, shards: 8 }
          - { package: ./services, shard: 2, shards: 8 }
          - { package: ./services, shard: 3, shards: 8 }
          - { package: ./services, shard: 4, shards: 8 }
          - { package: ./services, shard: 5, shards: 8 }
          - { package: ./services, shard: 6, shards: 8 }
          - { package: ./services, shard: 7, shards: 8 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # Patched crypto/x509: GO-2026-6809 / CVE-2026-111943.
          cache: true
          cache-dependency-path: server/go.sum

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: go test shard (race + cover)
        run: python3 ../scripts/go-test-shard.py --package "${{ matrix.package }}" --shards "${{ matrix.shards }}" --shard "${{ matrix.shard }}" --coverprofile "${{ runner.temp }}/go-coverage/${{ matrix.package == './repository' && 'repository' || 'services' }}-${{ matrix.shard }}.out"
        working-directory: server

      - name: Upload shard coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-coverage-${{ matrix.package == './repository' && 'repository' || 'services' }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-coverage/
          if-no-files-found: error

  server-libsql:
    name: libSQL preferences integration
    runs-on: ubuntu-latest
    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
        ports:
          - 127.0.0.1:8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache-dependency-path: server/go.sum
      - name: Wait for the disposable database
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify migrations, preferences and DM request races
        working-directory: server
        env:
          CGO_ENABLED: '1'
          HICHAT_TEST_LIBSQL_DSN: http://127.0.0.1:8080
        run: |
          go test -v -tags libsql_integration ./repository -run '^(TestLibSQLPreferencesLive|TestLibSQLAcceptDeclinePendingDMRace)$' -count=2 | tee "$RUNNER_TEMP/libsql-test.log"
          test "$(grep -c '^--- PASS: TestLibSQLPreferencesLive ' "$RUNNER_TEMP/libsql-test.log")" -eq 2
          test "$(grep -c '^--- PASS: TestLibSQLAcceptDeclinePendingDMRace ' "$RUNNER_TEMP/libsql-test.log")" -eq 2

  server-postgres:
    name: PostgreSQL repository and migration contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          # Disposable CI fixture, reachable only on the runner loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hichat_test
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd "pg_isready -U postgres -d hichat_test" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Execute both packages; reject required test skips
        env:
          HICHAT_TEST_POSTGRES_DSN: postgres://postgres@127.0.0.1:5432/hichat_test?sslmode=disable
        run: python3 scripts/run-postgres-tests.py

  server-postgres-tls:
    name: PostgreSQL client certificate reconnect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache-dependency-path: server/go.sum
      - name: Provision isolated certificate-authenticated database
        shell: pwsh
        run: ./server/database/run-postgres-tls-integration.ps1 -GoBinary (Get-Command go).Source -Toolchains local

  server-coverage:
    name: Combined Go statement coverage
    needs: [server-test, server-test-shards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: go-coverage-*
          path: coverage/inputs
          merge-multiple: true
      - name: Merge only profiles from identical source manifests
        run: python3 scripts/merge-go-coverage.py --expected-profiles 17 --output coverage/go.out 'coverage/inputs/**/*.out'
      - name: Report statement coverage
        working-directory: server
        run: go tool cover -func=../coverage/go.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-coverage-combined
          path: coverage/go.out
          if-no-files-found: error

  server-tests-gate:
    name: Go test & build
    if: always()
    needs: [server-test, server-test-shards, server-postgres, server-postgres-tls, server-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go test and build job to succeed
        env:
          BASE_RESULT: ${{ needs.server-test.result }}
          SHARDS_RESULT: ${{ needs.server-test-shards.result }}
          POSTGRES_RESULT: ${{ needs.server-postgres.result }}
          TLS_RESULT: ${{ needs.server-postgres-tls.result }}
          COVERAGE_RESULT: ${{ needs.server-coverage.result }}
        run: |
          if [ "$BASE_RESULT" != "success" ] || [ "$SHARDS_RESULT" != "success" ] || [ "$POSTGRES_RESULT" != "success" ] || [ "$TLS_RESULT" != "success" ] || [ "$COVERAGE_RESULT" != "success" ]; then
            echo "::error::Go test gate blocked: base=$BASE_RESULT shards=$SHARDS_RESULT postgres=$POSTGRES_RESULT tls=$TLS_RESULT coverage=$COVERAGE_RESULT"
            exit 1
          fi
          echo "All Go test shards, vet, tidy, and build succeeded."

  # ─── Go server: lint (hard gate — baseline cleaned 2026-06-11) ───
  # Version pinned to the exact binary the baseline was verified with;
  # `latest` previously broke the job structurally whenever a new major
  # rejected the config schema (the v1→v2 incident).
  server-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # Patched crypto/x509: GO-2026-6809 / CVE-2026-111943.
          cache: true
          cache-dependency-path: server/go.sum

      - name: golangci-lint
        # v7 is required for golangci-lint v2.x version strings; v6 only
        # accepts v1 pins (its `latest` silently installed v2 anyway, which
        # is how the config-schema breakage slipped in).
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: server
          args: --timeout=5m

  # ─── Go server: security scans (govulncheck gate + gosec advisory) ───
  server-security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # §0.10 deterministic self-scan (SECURE-CODING v1.5). Covers every
      # language in the stack: JS/TS, Go (§0.10.3, derived from the 2026-08-07
      # Checkmarx scan), CI/workflow YAML (§0.10.2) and Shell (§0.5,
      # deploy/*.sh). HARD gate: a BLOK
      # pattern match exits 1. Runs first — it is the cheapest check and its
      # whole point is to keep forbidden shapes out before the heavier
      # scanners run. INCELEME (review-class) hits never fail the build; they
      # are printed here and attached to the B4 delivery report.
      - name: Self-scan (SECURE-CODING §0.10)
        run: |
          bash security/tools/self-scan.sh . self-scan-inceleme.txt
          echo "::group::INCELEME (review queue — non-blocking)"
          cat self-scan-inceleme.txt
          echo "::endgroup::"

      # §0.12.3 guardrail drift gate. The editor-time pattern file and the org
      # policy text under .claude/ are GENERATED from security/ sources; if
      # someone edits either side by hand they stop matching and this fails.
      # Regenerating locally (`python security/tools/sync_agent_guardrail.py`)
      # is the fix — never hand-edit the .claude/ copies.
      # Python is pinned like every other toolchain here — a hard gate must
      # not depend on whatever `python` alias the runner image ships.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Guardrail drift check (SECURE-CODING §0.12.3)
        run: python3 security/tools/sync_agent_guardrail.py --check

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # Patched crypto/x509: GO-2026-6809 / CVE-2026-111943.
          cache: true
          cache-dependency-path: server/go.sum

      # govulncheck — call-graph-aware known-CVE scanner. HARD gate: it fails
      # ONLY on vulnerabilities actually REACHABLE from our code, so the
      # signal is high (transitive advisories we don't call are reported but
      # don't fail the run). This is the gate that caught GO-2026-4945
      # (go-jose JWE panic, reachable via the LiveKit webhook handler).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: server

      # gosec — static security analysis. Advisory for now (continue-on-error),
      # matching the golangci-lint policy above: triage the baseline before
      # flipping it to a hard gate.
      - name: gosec
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
        working-directory: server

  # ─── React client: lint + type check + test + build + production image ───
  client-check:
    name: Client lint, type, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: client

      - name: ESLint
        run: npm run lint
        working-directory: client

      - name: Vitest
        run: npm run test:coverage
        working-directory: client

      - name: Upload client statement and branch coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: client-coverage
          path: client/coverage/
          if-no-files-found: error

      # `npm run build` runs `tsc -b && vite build` — covers type checking
      # and production bundle in one step.
      - name: Build
        run: npm run build
        working-directory: client

      - name: Microphone worklet CSP packaging
        run: node --test scripts/audio-build-csp.test.mjs
        working-directory: client

      # Build the exact Nginx production target from the repository-root
      # context (including the shared Electron contracts), then exercise its
      # runtime CSP generation and fail-closed origin validation.
      - name: Production client image and Nginx CSP
        run: node scripts/test-nginx-csp.mjs
        working-directory: client

      # npm audit — dependency advisories. Advisory (continue-on-error):
      # transitive devDependency advisories are common and shouldn't block a
      # PR. Dependabot (.github/dependabot.yml) opens the actual bump PRs.
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: client

  # ─── Playwright E2E: real Go binary + Vite dev client ───
  # No Docker and no services block: server/Dockerfile documents that with
  # CGO_ENABLED=0 the go-libsql import is excluded by build constraints and
  # modernc.org/sqlite (pure Go) drives a local DATABASE_PATH. So this runs
  # the same binary a developer runs, against a throwaway SQLite file that
  # e2e/scripts/start-server.mjs creates per run.
  #
  # Playwright's `webServer` owns both processes (Go on :9090, Vite on :3030),
  # so there is nothing to start or tear down here.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # Patched crypto/x509: GO-2026-6809 / CVE-2026-111943.
          cache: true
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            e2e/package-lock.json

      # The suite drives the Vite dev server, so the client only needs its
      # dependencies — no production bundle build.
      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Install e2e deps
        run: npm ci
        working-directory: e2e

      # Chromium only — the suite pins one project, and downloading the other
      # engines would dominate the job's runtime.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Playwright test
        run: npx playwright test
        working-directory: e2e
        env:
          CGO_ENABLED: "0"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # ─── Electron main-process tests ───
  # The resolve-path module is the ONLY barrier between an evil
  # app://hichat/ URL and local disk (T1.4). node:test suite pins the
  # traversal defense. Zero new deps — pure node --test.
  electron-test:
    name: Electron main-process tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Root package.json owns the electron compile chain. tsc + electron
      # test scripts don't need the client's transitive tree, but they
      # do need typescript from the root devDependencies.
      - name: Install root deps
        run: npm ci

      - name: electron:test (resolve-path + regression suite)
        run: npm run electron:test

      - name: Quality runner and acceptance validator tests
        run: node --test scripts/run-quality.test.mjs scripts/run-frozen-quality.test.mjs scripts/check-implementation-coverage.test.mjs

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python3 -m pip install huggingface_hub==1.26.0
      - name: Source encoding and Python tool regressions
        run: |
          python3 scripts/check-text-encoding.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

  # ─── Prod image build (HF Space Dockerfile) ───
  # The root Dockerfile is what HF Space actually builds on `git push origin`.
  # It was previously exercised only on release tags (build-desktop.yml's
  # docker-publish job) and by the live HF build itself — so a Dockerfile
  # break surfaced only in production. Build it here on every PR to catch
  # breakage pre-merge. Build-only (push: false) — PRs carry no registry
  # credentials and we only need to prove the image compiles.
  docker-build:
    name: Prod image build (HF Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build prod image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hichat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan production image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hichat:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # ─── Migration filename hygiene ───
  # Migrations apply in lexicographic filename order (database.go sort.Strings).
  # Two files sharing a numeric prefix still run, but ordering becomes fragile:
  # a future same-number collision between dependent migrations would apply in
  # the wrong order silently. The 072_ pair (attachments_file_url_unique +
  # bot_accounts) is grandfathered; fail CI on any NEW duplicate prefix.
  migration-hygiene:
    name: Migration filename hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for duplicate migration numeric prefixes
        run: |
          cd server/database/migrations
          dupes=$(ls *.sql | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)
          unexpected=$(printf '%s\n' "$dupes" | grep -vx '072' | grep -vx '' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Duplicate migration numeric prefix(es): $unexpected"
            echo "Each migration needs a unique NNN_ prefix. Only 072 is grandfathered."
            exit 1
          fi
          echo "Migration prefixes OK (072 grandfathered)."
