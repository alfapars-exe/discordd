name: Private frontend artifacts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix client --ignore-scripts
      - run: node scripts/test-sentry-build.mjs
      - run: npm run build --prefix client
      - run: node node_modules/typescript/bin/tsc -p electron/tsconfig.json
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl.exe /EHsc /O2 native\audio-capture.cpp /Fe:native\audio-capture.exe ole32.lib mmdevapi.lib
          cl.exe /std:c++17 /EHsc /O2 /DUNICODE /D_UNICODE native\game-window.cpp /Fe:native\game-window.exe user32.lib
      - run: node node_modules/electron-builder/cli.js --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/check-packaged-maps.cjs
