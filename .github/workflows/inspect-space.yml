name: Inspect HF deployment status

on:
  workflow_dispatch:
    inputs:
      configure_sentry:
        type: boolean
        default: false
      expected_head:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  configure-sentry:
    if: inputs.configure_sentry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input huggingface_hub==1.26.0
      - name: Configure private Sentry build inputs without logging values
        env:
          HF_TOKEN: ${{ secrets.HF_RELEASE_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || secrets.SENTRY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          python - <<'PY'
          import json, os, re
          from urllib.parse import urlsplit, quote
          import httpx
          from huggingface_hub import HfApi
          repo = 'infinayazilim/discord'
          api = HfApi()
          expected = os.environ['EXPECTED_HEAD']
          if not re.fullmatch('[a-f0-9]{40}', expected) or api.space_info(repo).sha != expected:
              raise SystemExit('Space HEAD changed; review configuration target again')
          token = os.environ.get('SENTRY_AUTH_TOKEN','').strip()
          org, project = os.environ.get('SENTRY_ORG','').strip(), os.environ.get('SENTRY_PROJECT','').strip()
          if token.startswith('{'):
              bundle = json.loads(token)
              token = bundle.get('authToken') or bundle.get('auth_token') or bundle.get('token') or ''
              org = org or bundle.get('org','')
              project = project or bundle.get('project','')
          if not token:
              raise SystemExit('Sentry authentication token is missing')
          if token.startswith(('https://','http://')):
              raise SystemExit('SENTRY contains a DSN, not an authentication token; private source-map upload needs SENTRY_AUTH_TOKEN')
          variables = api.get_space_variables(repo)
          dsn = urlsplit(variables['VITE_SENTRY_DSN'].value)
          project_id = dsn.path.strip('/')
          if dsn.scheme != 'https' or not dsn.hostname or not dsn.hostname.endswith('.sentry.io') or not project_id.isdecimal():
              raise SystemExit('Expected a hosted Sentry DSN; configure explicit project metadata for this deployment')
          with httpx.Client(headers={'Authorization':'Bearer '+token}, timeout=20, follow_redirects=False) as client:
              if not (org and project):
                  response = client.get('https://sentry.io/api/0/projects/')
                  if response.status_code != 200:
                      raise SystemExit('Sentry token cannot discover project metadata; add SENTRY_ORG and SENTRY_PROJECT in GitHub Variables')
                  matches = [p for p in response.json() if str(p.get('id')) == project_id]
                  if len(matches) != 1:
                      raise SystemExit('Sentry project metadata not found; add SENTRY_ORG and SENTRY_PROJECT in GitHub Variables')
                  org, project = matches[0]['organization']['slug'], matches[0]['slug']
              response = client.get('https://sentry.io/api/0/projects/'+quote(org,safe='')+'/'+quote(project,safe='')+'/')
              if response.status_code != 200 or str(response.json().get('id')) != project_id:
                  raise SystemExit('Sentry authentication/project does not match the deployed DSN')
          for name, value in [('SENTRY_AUTH_TOKEN',token),('SENTRY_ORG',org),('SENTRY_PROJECT',project)]:
              api.add_space_secret(repo_id=repo,key=name,value=value)
          print(json.dumps({'sentry_project_verified':True,'private_build_inputs_configured':True}))
          PY
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input huggingface_hub==1.26.0
      - name: Read deployment status and bounded sanitized error lines
        env:
          HF_TOKEN: ${{ secrets.HF_RELEASE_TOKEN }}
        run: |
          python - <<'PY'
          import difflib, json, os, re
          from pathlib import Path
          import httpx
          from huggingface_hub import HfApi, hf_hub_download
          def clean(value):
              text = str(value).replace(os.environ['HF_TOKEN'], '[redacted]')
              text = re.sub(r'(?i)\b(?:https?|postgres(?:ql)?|libsql)://\S+', '[url]', text)
              text = re.sub(r'(?i)(password|secret|token|authorization|api_key)([\s"\x27:=]+)\S+', r'\1=[redacted]', text)
              return text[:1500]
          info = HfApi().space_info('infinayazilim/discord')
          variables = HfApi().get_space_variables('infinayazilim/discord')
          metadata = getattr(info, 'secrets', {}) or {}
          secret_names = sorted(metadata) if isinstance(metadata, dict) else sorted(item.get('key','') if isinstance(item,dict) else str(item) for item in metadata)
          print(json.dumps({'build_variable_names':sorted(variables), 'secret_metadata_names':secret_names}), flush=True)
          env_files = [entry.path for entry in HfApi().list_repo_tree('infinayazilim/discord',repo_type='space',path_in_repo='client') if hasattr(entry,'path') and Path(entry.path).name.startswith('.env')]
          print(json.dumps({'client_env_files':env_files}), flush=True)
          raw = info.runtime.raw if info.runtime else {}
          print(json.dumps({'head':info.sha, 'stage':raw.get('stage'), 'runtime_commit':raw.get('sha'), 'error':clean(raw.get('errorMessage','')), 'runtime_fields':sorted(raw)}), flush=True)
          old = 'b8a626fb9d1a0e1c3531494b46f1c3be8cc4e8ab'
          failed = '5f05a003d7c5995362a89dea5c94cd9ae0afd11a'
          for name in ('server/database/postgres.go','server/database/postgres_dialect.go'):
              texts = [Path(hf_hub_download('infinayazilim/discord', name, repo_type='space', revision=revision)).read_text() for revision in (old, failed)]
              print('SOURCE_DIFF ' + name, flush=True)
              for line in list(difflib.unified_diff(texts[0].splitlines(), texts[1].splitlines(), fromfile='working', tofile='failed'))[:250]:
                  print(clean(line), flush=True)
          for revision in (old, failed):
              for name in ('server/go.mod','Dockerfile'):
                  text = Path(hf_hub_download('infinayazilim/discord', name, repo_type='space', revision=revision)).read_text()
                  for line in text.splitlines():
                      if line.startswith('FROM ') or 'github.com/jackc/pgx/' in line:
                          print('BUILD_PIN ' + revision[:8] + ' ' + clean(line), flush=True)
          for kind in ('build', 'run'):
              print('LOG_KIND ' + kind, flush=True)
              count = 0
              try:
                  with httpx.stream('GET', 'https://huggingface.co/api/spaces/infinayazilim/discord/logs/' + kind,
                      headers={'Authorization':'Bearer ' + os.environ['HF_TOKEN']}, timeout=15) as response:
                      print('LOG_HTTP ' + str(response.status_code), flush=True)
                      if response.status_code != 200:
                          continue
                      for line in response.iter_lines():
                          count += 1
                          if re.search(r'(?i)error|failed|panic|fatal|denied|exit code|not found|no space|PostgreSQL 18 SQL connection verified|PostgreSQL build preflight skipped', line):
                              print(clean(line), flush=True)
                          if count >= 10000:
                              break
                      print('LOG_LINES_READ ' + kind + ' ' + str(count), flush=True)
              except httpx.HTTPError as error:
                  print('LOG_READ ' + type(error).__name__, flush=True)
          PY
