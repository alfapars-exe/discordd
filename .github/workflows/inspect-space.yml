name: Inspect HF deployment status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-input huggingface_hub==1.26.0
      - name: Read deployment status and bounded sanitized error lines
        env:
          HF_TOKEN: ${{ secrets.HF_RELEASE_TOKEN }}
        run: |
          python - <<'PY'
          import difflib, json, os, re
          from pathlib import Path
          import httpx
          from huggingface_hub import HfApi, hf_hub_download
          def clean(value):
              text = str(value).replace(os.environ['HF_TOKEN'], '[redacted]')
              text = re.sub(r'(?i)\b(?:https?|postgres(?:ql)?|libsql)://\S+', '[url]', text)
              text = re.sub(r'(?i)(password|secret|token|authorization|api_key)([\s"\x27:=]+)\S+', r'\1=[redacted]', text)
              return text[:1500]
          info = HfApi().space_info('infinayazilim/discord')
          variables = HfApi().get_space_variables('infinayazilim/discord')
          metadata = getattr(info, 'secrets', {}) or {}
          secret_names = sorted(metadata) if isinstance(metadata, dict) else sorted(item.get('key','') if isinstance(item,dict) else str(item) for item in metadata)
          print(json.dumps({'build_variable_names':sorted(variables), 'secret_metadata_names':secret_names}), flush=True)
          env_files = [entry.path for entry in HfApi().list_repo_tree('infinayazilim/discord',repo_type='space',path_in_repo='client') if hasattr(entry,'path') and Path(entry.path).name.startswith('.env')]
          print(json.dumps({'client_env_files':env_files}), flush=True)
          raw = info.runtime.raw if info.runtime else {}
          print(json.dumps({'head':info.sha, 'stage':raw.get('stage'), 'runtime_commit':raw.get('sha'), 'error':clean(raw.get('errorMessage','')), 'runtime_fields':sorted(raw)}), flush=True)
          old = 'b8a626fb9d1a0e1c3531494b46f1c3be8cc4e8ab'
          failed = '5f05a003d7c5995362a89dea5c94cd9ae0afd11a'
          for name in ('server/database/postgres.go','server/database/postgres_dialect.go'):
              texts = [Path(hf_hub_download('infinayazilim/discord', name, repo_type='space', revision=revision)).read_text() for revision in (old, failed)]
              print('SOURCE_DIFF ' + name, flush=True)
              for line in list(difflib.unified_diff(texts[0].splitlines(), texts[1].splitlines(), fromfile='working', tofile='failed'))[:250]:
                  print(clean(line), flush=True)
          for revision in (old, failed):
              for name in ('server/go.mod','Dockerfile'):
                  text = Path(hf_hub_download('infinayazilim/discord', name, repo_type='space', revision=revision)).read_text()
                  for line in text.splitlines():
                      if line.startswith('FROM ') or 'github.com/jackc/pgx/' in line:
                          print('BUILD_PIN ' + revision[:8] + ' ' + clean(line), flush=True)
          for kind in ('build', 'run'):
              print('LOG_KIND ' + kind, flush=True)
              count = 0
              try:
                  with httpx.stream('GET', 'https://huggingface.co/api/spaces/infinayazilim/discord/logs/' + kind,
                      headers={'Authorization':'Bearer ' + os.environ['HF_TOKEN']}, timeout=15) as response:
                      print('LOG_HTTP ' + str(response.status_code), flush=True)
                      if response.status_code != 200:
                          continue
                      for line in response.iter_lines():
                          count += 1
                          if re.search(r'(?i)error|failed|panic|fatal|denied|exit code|not found|no space|PostgreSQL 18 SQL connection verified|PostgreSQL build preflight skipped', line):
                              print(clean(line), flush=True)
                          if count >= 10000:
                              break
                      print('LOG_LINES_READ ' + kind + ' ' + str(count), flush=True)
              except httpx.HTTPError as error:
                  print('LOG_READ ' + type(error).__name__, flush=True)
          PY
