name: Mobile native builds
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --prefix client --ignore-scripts
      - run: node --test scripts/mobile-version.test.mjs
      - run: node scripts/mobile-version.mjs --check
      - run: npm run cap:build --prefix client
      - name: Verify sync preserved portable native dependencies
        run: git diff --exit-code -- client/android/capacitor.settings.gradle client/android/app/capacitor.build.gradle client/ios/App/CapApp-SPM/Package.swift
      - name: Build Android app and tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd client/android
          bash gradlew --no-daemon assembleDebug testDebugUnitTest assembleDebugAndroidTest
      - name: Run installed Android instrumentation tests
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 15
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/hichat-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager "$image"
          echo no | avdmanager create avd --name hichat-ci --package "$image" --force
          emulator -list-avds | grep -Fx hichat-ci
          sudo chmod a+rw /dev/kvm
          emulator -avd hichat-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          boot_deadline=$((SECONDS + 300))
          until [[ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= boot_deadline )); then
              adb devices -l || true
              tail -100 "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            sleep 2
          done
          cd client/android
          bash gradlew --no-daemon connectedDebugAndroidTest
      - name: Build iOS Simulator without signing
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          xcodebuild -project client/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/hichat-ios" CODE_SIGNING_ALLOWED=NO build
      - name: Test voice interruption handling on iOS Simulator
        if: runner.os == 'macOS'
        working-directory: client/ios/App/VoiceSession
        run: |
          device=$(xcrun simctl list devices available -j | jq -er '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild -scheme VoiceSession -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO test
