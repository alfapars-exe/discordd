name: Restore last working HF source

on:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string
      restore_revision:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-hichat-hf-production
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore only the reviewed last application-source commit
        env:
          HF_TOKEN: ${{ secrets.HF_RELEASE_TOKEN }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          RESTORE_REVISION: ${{ inputs.restore_revision }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_LFS_SKIP_SMUDGE: '1'
          GIT_LFS_SKIP_PUSH: '1'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RESTORE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          cat > "$RUNNER_TEMP/hf-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' hf_user ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/hf-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/hf-askpass.sh"
          git clone --depth 2 --no-checkout https://huggingface.co/spaces/infinayazilim/discord "$RUNNER_TEMP/hichat-restore"
          cd "$RUNNER_TEMP/hichat-restore"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$RESTORE_REVISION"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'scripts'))
          from hf_source_manifest import validate_rollback
          changed = validate_rollback('.', os.environ['EXPECTED_HEAD'], os.environ['RESTORE_REVISION'])
          print('Reviewed application-source rollback paths:',len(changed))
          PY
          git checkout --detach HEAD
          git config user.name 'HiChat release recovery'
          git config user.email 'hichat-release@users.noreply.github.com'
          git revert --no-edit "$EXPECTED_HEAD"
          git diff --exit-code "$RESTORE_REVISION" HEAD --
          # All LFS objects belong to the already-existing restore revision;
          # no binary upload or persistent application data change is needed.
          git push origin HEAD:main
          printf 'Restored source tree from %s in commit %s\n' "$RESTORE_REVISION" "$(git rev-parse HEAD)"
