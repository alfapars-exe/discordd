  - id: SEC-EX-2026-0008
    <<: *defaults
    type: suppression
    rule: "Improper Locking (85)"
    location: { path: "server/services/voice_*.go, p2p_call_service.go, music_bot_*.go, ws/*", lines: "~79 prod saha" }
    artifact_class: production
    analysis:
      source: "-"
      sink: "mutex Lock() … explicit Unlock() (defer'siz)"
      refutation: R3
      rationale: >
        **Saha saha sınıflandırıldı (2026-08-07, ikinci dalga).** Üretim kodundaki
        78 defer'siz Unlock sahasının tamamı tek tek incelendi: **15'i güvenli,
        63'ü "load-bearing"**. Sıfır kilit kaçağı — her erken dönüş yolunun
        eşleşen Unlock'u var (AdminUpdateState 5/5, MoveUser 11/11,
        AdminDisconnectUser 4/4, AcceptCall 4/4, DeclineCall 3/3, playLoop 3/3,
        JoinChannel 2/2, LeaveChannel 2/2 … tamamı doğrulandı).
        **Güvenli olan 10 fonksiyon `defer`'e çevrildi** (GetUserCall, Skip,
        JoinChannel, LeaveChannel, CleanupViewersForStreamer, addClient,
        removeClient, UpdateActivity, ws rate_limit allow, handlePresenceUpdate)
        + daha önce ratelimit.go SetTrustedProxies → bu sahalar **Fixed**.
        **Kalan 63 saha DÖNÜŞTÜRÜLEMEZ ve bu bir kusur değildir**: kilit,
        bloklayıcı işten ÖNCE bilinçli olarak açılıyor — LiveKit round-trip'leri
        (voice_admin.go:115, voice_lifecycle.go:232 ~20s), hub broadcast'leri,
        `h.unregister <- client` kanal gönderimi (hub_clients.go:148), ve
        AYNI mutex'i yeniden alan çağrılar (p2p cleanupCall :351, EndCall :243,
        music StopAll→Stop, voice_token→voice_state/voice_e2ee). `defer`
        eklemek bu sahalarda ÜRETİMDE DEADLOCK üretir; ikisi de sonsuz döngü
        içinde olduğundan (`playLoop`, `usedRefreshSweepLoop`) `defer`
        semantik olarak zaten yanlıştır. Gerekçe kodda da belgeli:
        voice_admin.go:79-84 "HIGH-1 fix" yorumu.
    evidence:
      - "server/services/voice_admin.go:39-107,190-355 (saha saha iz kaydı)"
      - "server/ws/hub_clients.go:138-148 (kanal gönderimi — RLock tutulursa 256 istemcide deadlock)"
      - "server/services/voice_token.go:120-201 (üç ayrı self-deadlock yolu)"
      - "2026-08-07 sınıflandırma taraması: 78 saha = 15 A (dönüştürülebilir) + 63 B (load-bearing), 0 kaçak"
    # NOT: middleware.Recover telafi kontrolü DEĞİLDİR — panic'i yutar ama tutulan
    # mutex'i serbest bırakmaz; gerçek kontrol kritik bölümlerin düz-çizgi olması.
    compensating_controls: [straight-line-critical-sections, no-panicking-calls-in-critical-sections]
    removal_plan: "Panic-güvenliği istenirse unlock-before-IO helper'ı ayrı refactor işi (PROJECT_MEMORY §2 aday)"

