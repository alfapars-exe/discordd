        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '201': { $ref: '#/components/responses/PinnedMessageCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: pinsUnpin
      summary: Unpin a message.
      description: Response message is literally "message unpinned".
      tags: [Pins]
      x-required-permission: { name: PermManageMessages, value: 16 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200': { $ref: '#/components/responses/MessageOnlyOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

