  /api/servers/{serverId}/soundboard/sounds/{soundId}/play:
    post:
      operationId: soundboardPlay
      summary: Broadcast a soundboard clip into the caller's current voice channel.
      tags: [Soundboard]
      x-required-permission: { name: PermUseSoundboard, value: 65536 }
