  # ── WebSocket ──
  /ws:
    get:
      operationId: wsConnect
      summary: Upgrade to the human realtime gateway WebSocket connection.
      description: >-
        This is a WebSocket handshake (HTTP Upgrade), not a plain HTTP request —
        modeled here only so the route is enumerated. Preferred auth: obtain a
        one-shot, ~30s-TTL ticket from POST /api/auth/ws-ticket, then connect
        with `?ticket=<value>`. A legacy `?token=<access_token>` query-string
        path exists but is disabled server-side pending removal. No
        Authorization header is used on this route — the ticket/token is a
        query parameter because browsers cannot set custom headers on a
        WebSocket handshake.
      tags: [WebSocket]
      security: []
      parameters:
        - name: ticket
          in: query
          required: false
          schema: { type: string }
          description: One-shot ticket minted by POST /api/auth/ws-ticket.
      responses:
        '101':
          description: Switching Protocols — WebSocket handshake accepted.
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/bot/gateway:
    get:
      operationId: wsBotGateway
      summary: Upgrade to the read-only bot gateway WebSocket connection.
      description: >-
        WebSocket handshake authenticated via `Authorization: Bearer hb_...`
        (bot token only — a human JWT is rejected even though it is also a
        Bearer token). Streams a read-only subset of events
        (BotReadableOps) scoped to the servers the bot belongs to.
      tags: [WebSocket]
      security:
        - botAuth: []
      responses:
        '101':
          description: Switching Protocols — WebSocket handshake accepted.
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404':
          description: Bot gateway disabled (no bot token validator configured).

  # ── System ──
  /api/health:
    get:
