        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/servers/{serverId}/invites/{code}:
    delete:
      operationId: invitesDelete
      summary: Revoke a server invite.
      tags: [Invites]
      x-required-permission: { name: PermManageInvites, value: 1024 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── E2EE Group Sessions (pentest C-03: per-recipient sealed envelopes) ──
  /api/servers/{serverId}/channels/{channelId}/group-sessions:
    post:
      operationId: e2eeCreateGroupSession
      summary: >-
        Upload a v2 Sender Key distribution: N opaque envelopes, one per
        recipient device, each individually sealed (Signal PreKey/Whisper
        message). Body is models.CreateSenderKeyDistributionRequest
        { session_id, version, envelopes: [{ recipient_user_id,
        recipient_device_id, message_type, ciphertext }] }. There is no
        compatibility path for the pre-v2 single shared-blob format: version
        != 2, an empty envelopes list, or a body carrying the legacy
        "session_data" field are all rejected with 400.
      tags: [E2EE-GroupSessions]
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
        - name: device_id
          in: query
          required: true
          schema: { type: string }
          description: Sending device's own ID.
      requestBody: { $ref: '#/components/requestBodies/StubJSON' }
      responses:
        '201': { $ref: '#/components/responses/StubCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    get:
      operationId: e2eeGetGroupSessions
      summary: >-
        Fetch Sender Key envelopes sealed for exactly the caller's own
        (user_id, device_id) — never another recipient's ciphertext.
        Response items are models.SenderKeyEnvelopeResponse { sender_user_id,
        sender_device_id, session_id, version, message_type, ciphertext,
        created_at }.
      tags: [E2EE-GroupSessions]
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
        - name: device_id
          in: query
          required: true
          schema: { type: string }
          description: Caller's own device ID. Must belong to the authenticated caller (403 otherwise).
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /api/servers/{serverId}/channels/{channelId}/sender-key-recipients:
    get:
      operationId: e2eeGetSenderKeyRecipients
      summary: >-
        Prekey bundle roster a sender needs to seal one Sender Key envelope
        per recipient device: every device of every channel member with
        read access (PermViewChannel + PermReadMessages), excluding the
        caller's own calling device (its other devices ARE included).
        Response items are models.SenderKeyRecipient { user_id, device_id,
        registration_id, identity_key, signing_key, signed_prekey_id,
        signed_prekey, signed_prekey_signature, one_time_prekey_id,
        one_time_prekey }. Requires send permission on the channel (the
        caller is about to distribute a new session).
      tags: [E2EE-GroupSessions]
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
        - name: device_id
          in: query
          required: true
          schema: { type: string }
          description: Caller's own device ID, excluded from the returned roster.
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── Search ──
  /api/servers/{serverId}/search:
