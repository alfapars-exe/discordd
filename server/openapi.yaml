openapi: 3.1.0
info:
  title: HiChat API
  version: "0.1.0"
  description: |-
    REST + WebSocket API for HiChat, a Discord-style chat platform (servers, channels,
    DMs, voice/video via LiveKit, end-to-end-encrypted messaging, a music/soundboard
    bot, and a read-only Bot Gateway).

    ## Response envelope
    Every JSON response — success or error — is wrapped in the same envelope
    (`ApiEnvelope`, mirroring `pkg.APIResponse`):
    `{"success": bool, "data": <payload, omitted on error>, "error": <message, omitted
    on success>, "code": <machine-readable error code, omitted on success and on some
    legacy message-only error paths>}`. Success responses set `success: true` and
    populate `data` with an operation-specific payload; error responses set
    `success: false`, `error` (safe to display for 4xx, generic "internal server error"
    text for 5xx — see `pkg.Error`), and `code` (one of the `ErrorCode` enum values).

    ## Permission model
    Server-scoped authorization (`models.Permission` in `server/models/role.go`) is a
    20-bit bitfield stored per `Role`; a member's effective permission mask is the
    bitwise OR of every role they hold. Endpoints gated on one specific bit at the
    routing-middleware layer (`authServerPerm` in `init_routes.go`) carry the
    `x-required-permission` extension (bit name + decimal value). `PermAdmin` (512)
    short-circuits every check in `Permission.Has` — a role holding `PermAdmin` passes
    every `x-required-permission` gate regardless of its other bits.

    A few endpoints perform the real permission decision INSIDE the handler or service
    layer instead of (or in addition to) the routing middleware — e.g. the music bot
    (`PermSpeak`/`PermManageChannels`), the audit log (`PermAdmin` OR any moderation
    bit), and per-server nicknames (`PermManageNicknames`, waived for renaming
    yourself). Those operations carry `x-permission-note` describing the real,
    handler-internal check; `x-required-permission` is deliberately omitted or reflects
    only what the outer middleware chain enforces (typically just server membership) —
    never conflate the two.

    Platform-wide administration (`authAdmin` in `init_routes.go`) is a SEPARATE
    concept from the per-server `Permission` bitfield: it gates on the boolean
    `models.User.IsPlatformAdmin`, not on any bit above. Those operations are marked
    with `x-platform-admin: true` instead of `x-required-permission`.

    ## Auth
    Two bearer credential families share the same `Authorization: Bearer <token>`
    header and the same `AuthMiddleware.Require` gate: human session JWTs
    (`bearerAuth`) and bot automation tokens prefixed `hb_` (`botAuth`,
    `models.BotTokenPrefix`) — the middleware branches on that prefix before falling
    back to JWT validation, so both credential types are accepted on every route that
    lists the default `bearerAuth` + `botAuth` security requirement. `GET
    /api/uploads/*` additionally accepts a dedicated HttpOnly `hichat_media` cookie for
    `<img>`/`<video>` browser contexts that cannot set a header. The WebSocket
    endpoints use two more mechanisms entirely (see their operation descriptions).

    ## Stub phase
    This document enumerates every route (path, method, tags, auth/permission
    metadata, path/query parameters) against a generic success/error envelope;
    request/response `data` payloads are intentionally left as
    `TODO: detailed schema` placeholders (see `StubData`) — full per-endpoint body
    schemas are the next authoring phase, not this one.
servers:
  - url: https://infinayazilim-discord.hf.space
    description: Production (HuggingFace Space, single-container deploy)
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
    description: Registration, login, session refresh/logout, password reset, WS ticket issuance.
  - name: Users
    description: The caller's own profile, avatar, wallpaper, preferences, and onboarding-prompt state.
  - name: Notifications
    description: >-
      The caller's persistent inbox (mention / reply / friend_request /
      dm_request rows, 90-day retention). Read and acknowledge only — rows
      are written server-side by the message, DM and friendship flows and
      pushed live as the `notification_create` WebSocket event.
  - name: Saved
    description: >-
      The caller's private bookmarks of channel or DM messages
      (saved_messages, migration 083) with an optional plaintext note.
      Saving requires current read access to the message; listing re-checks
      channel permissions and drops rows the caller can no longer read.
  - name: UserNotes
    description: >-
      The caller's private note about another user (user_notes, migration
      084). Owner-scoped: the target never sees it.
  - name: Servers
    description: Server (guild) lifecycle, membership, server-level mute, icon, and LiveKit settings.
  - name: DMs
    description: Direct-message channel discovery, creation, and request accept/decline.
  - name: DMSettings
    description: Per-DM-channel preferences — hide, pin-to-top, mute, E2EE toggle.
  - name: Messages
    description: Message CRUD and search, both server-channel and DM scoped.
  - name: Reactions
    description: Emoji reaction toggle on a message, server-channel or DM scoped.
  - name: Pins
    description: Pin/unpin a message and list a channel's or DM's pinned messages.
  - name: ReadState
    description: Per-channel read-cursor tracking (mark read, mark all read, unread summary).
  - name: Channels
    description: Server channel CRUD, reordering, and channel-level mute.
  - name: Categories
    description: Server channel-category CRUD and reordering.
  - name: Members
    description: Server membership roster, role assignment, kick, ban, and per-member timeout.
  - name: Roles
    description: Server role CRUD, reordering, and the permission bitfield carried per role.
  - name: Bans
    description: Server ban roster (list, lift).
  - name: Timeouts
    description: Discord-style temporary mute/timeout, applied and lifted per member.
  - name: Nicknames
    description: Per-server member nickname, self-service or moderator-applied.
  - name: ChannelPermissions
    description: Per-channel, per-role permission overrides layered on top of the server-wide role bitfield.
  - name: Invites
    description: Server invite-code lifecycle and the public invite preview.
  - name: E2EE-Devices
    description: End-to-end-encryption device registration, one-time prekey upload, and public key-material lookup.
  - name: E2EE-KeyBackup
    description: Server-held, client-encrypted backup of a user's E2EE identity/session keys.
  - name: E2EE-GroupSessions
    description: Sender-key group-session distribution for E2EE server channels.
  - name: Bots
    description: Owner-facing bot-account management — create, list, revoke automation credentials.
  - name: Voice
    description: LiveKit voice/screen-share token issuance, voice-state snapshot, and the LiveKit webhook receiver.
  - name: Music
    description: Per-channel YouTube-to-LiveKit music bot (play/skip/pause/resume/stop/state).
  - name: Soundboard
    description: Per-server soundboard clip CRUD and playback.
  - name: Expressions
    description: >-
      Per-server custom emojis and stickers (static PNG + optional animated
      GIF), and copying copyable ones between servers.
  - name: EntranceSounds
    description: >-
      Voice-channel entrance sounds — a user's uploaded PCM WAV clips and
      parametric presets, per-scope selection, and the server-side controls
      (on/off, max duration, per-channel switch, moderator mute). Playback is
      server-triggered on a fresh voice join (WS entrance_sound_play to the
      channel's participants only); there is no play endpoint.
  - name: Cosmetics
    description: >-
      Profile cosmetics — avatar frames, nameplates, name styles, profile
      themes and profile effects. Every asset is a small structured token
      document validated against a strict schema and re-serialized
      canonically (no raw CSS, no SVG bytes; built-in frames are client
      components keyed by an enum). One item per (scope, slot type); scope
      "global" or a server the caller is in, a server scope overriding the
      global one there. Changes fan out as WS user_cosmetics_update (not
      bot-readable). Everyone mode: no shop, no premium tier.
  - name: Friends
    description: Friend requests and the friends roster.
  - name: Blocks
    description: User-level blocking (list, block, unblock).
  - name: Badges
    description: Platform badge catalog CRUD and per-user badge assignment.
  - name: GIFs
    description: Klipy GIF-search proxy (trending + query search).
  - name: Feedback
    description: User support tickets, including the caller's own thread and replies.
  - name: Reports
    description: User-submitted abuse reports on other users.
  - name: Admin
    description: Platform-admin-only endpoints — LiveKit fleet, servers, reports, feedback, users, app logs.
  - name: Stats
    description: Public, unauthenticated platform statistics.
  - name: Uploads
    description: Attachment/avatar/icon byte serving, with mixed public/access-controlled categories.
  - name: WebSocket
    description: Realtime gateway upgrades — the human hub (`/ws`) and the read-only bot gateway.
  - name: Diagnostics
    description: Client-side diagnostic log ingestion (crash dumps, screen-share lifecycle) and admin-emailed diagnostic bundles.
  - name: System
    description: Health/readiness probes, deploy-version polling, and static landing assets.
  - name: Audit
    description: >-
      Server moderation history (audit log). NOT part of the tag catalog requested for
      this pass — added because `GET /api/servers/{serverId}/audit` has no closer fit
      among the given tags; flagged here for visibility rather than silently folded
      into `Admin` or `Members`.
x-permissions:
  description: >-
    models.Permission (server/models/role.go) is a bitwise-OR'd int64 stored per Role;
    a member's effective mask is the OR of every role they hold. PermAdmin
    short-circuits Permission.Has — a role carrying it passes every check below
    regardless of its other bits. Per-channel overrides (channel_permissions table,
    see the ChannelPermissions tag) can further adjust the effective mask for one
    specific channel; that layering is not represented in this flat bit catalog.
  bits:
    PermManageChannels: 1
    PermManageRoles: 2
    PermKickMembers: 4
    PermBanMembers: 8
    PermManageMessages: 16
    PermSendMessages: 32
    PermConnectVoice: 64
    PermSpeak: 128
    PermStream: 256
    PermAdmin: 512
    PermManageInvites: 1024
    PermReadMessages: 2048
    PermViewChannel: 4096
    PermMoveMembers: 8192
    PermMuteMembers: 16384
    PermDeafenMembers: 32768
    PermUseSoundboard: 65536
    PermManageSoundboard: 131072
    PermTimeoutMembers: 262144
    PermManageNicknames: 524288
    PermManageExpressions: 1048576
  PermAll: 2097151
  PermAllNote: >-
    Sum of every bit above — (1 << 21) - 1. Distinct from the boolean
    models.User.IsPlatformAdmin used by authAdmin routes (see x-platform-admin),
    which is a platform-wide flag, not a bit in this server-scoped field.
security:
  - bearerAuth: []
  - botAuth: []
paths:
  # ── Auth ──
  /api/auth/register:
    post:
      operationId: authRegister
      summary: Create a new user account.
      description: >-
        IP rate limited. Sets the hichat_refresh (HttpOnly) and hichat_media
        cookies on success in addition to returning access_token in the
        body — see AuthTokens.
      tags: [Auth]
      security: []
      requestBody: { $ref: '#/components/requestBodies/RegisterRequestBody' }
      responses:
        '201': { $ref: '#/components/responses/AuthTokensResponse' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/auth/login:
    post:
      operationId: authLogin
      summary: Exchange credentials for a session (access + refresh tokens).
      description: >-
        IP rate limited (resets on success). Sets the hichat_refresh
        (HttpOnly) and hichat_media cookies in addition to returning
        access_token in the body — see AuthTokens.
      tags: [Auth]
      security: []
      requestBody: { $ref: '#/components/requestBodies/LoginRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/AuthTokensResponse' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/auth/refresh:
    post:
      operationId: authRefresh
      summary: Exchange a refresh token for a new access token.
      description: >-
        Reads the refresh token from the hichat_refresh HttpOnly cookie
        first, falling back to refresh_token in the body — an empty body is
        valid when the cookie is present. Rotates the refresh token
        server-side (old one invalidated) and re-sets both cookies. Reusing
        an already-rotated token invalidates every session for that user
        (leak-detection heuristic).
      tags: [Auth]
      security: []
      requestBody: { $ref: '#/components/requestBodies/RefreshTokenRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/AuthTokensResponse' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/auth/logout:
    post:
      operationId: authLogout
      summary: Invalidate the caller's current session.
      description: >-
        Idempotent — reads the refresh token from the cookie or body (both
        optional; a missing token still returns 200), invalidates it
        server-side if present, and always clears both the hichat_refresh
        and hichat_media cookies. Response message is literally
        "logged out". Only the ONE session identified by the presented
        refresh token is revoked — see POST /api/auth/logout-all to end
        every session at once.
      tags: [Auth]
      requestBody: { $ref: '#/components/requestBodies/RefreshTokenRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/MessageOnlyOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/auth/logout-all:
    post:
      operationId: authLogoutAll
      summary: Invalidate every session the caller has, on every device.
      description: >-
        Deletes every refresh-session row for the caller, bumps
        token_version (invalidating every outstanding access token, not
        just the one on this request), and disconnects any open
        WebSocket. Also clears the caller's own hichat_refresh and
        hichat_media cookies, since the session behind this very request
        is revoked too — there is no way for the server to distinguish
        "this" session from any other, so the caller ends up logged out
        here as well and must sign in again. Response message is
        literally "logged out from all devices".
      tags: [Auth]
      responses:
        '200': { $ref: '#/components/responses/MessageOnlyOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/auth/forgot-password:
    post:
      operationId: authForgotPassword
      summary: Request a password-reset email.
      description: >-
        IP rate limited, plus a 90s per-email server-side cooldown. Always
        returns the same generic message regardless of whether the email
        exists or is cooling down (enumeration protection) — response
        message is literally "if the email exists, a reset link has been
        sent".
      tags: [Auth]
      security: []
      requestBody: { $ref: '#/components/requestBodies/ForgotPasswordRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/MessageOnlyOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/auth/reset-password:
    post:
      operationId: authResetPassword
      summary: Complete a password reset using the emailed token.
      description: >-
        IP rate limited. Validates the token (SHA-256 hash lookup), updates
        the password, deletes the token (one-time use), and invalidates
        every existing session for the account — deletes all
        refresh-session rows, bumps token_version, and disconnects any
        open WebSocket. Every client (including a possible attacker's)
        must sign in again with the new password. Response message is
        literally "password has been reset successfully".
      tags: [Auth]
      security: []
      requestBody: { $ref: '#/components/requestBodies/ResetPasswordRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/MessageOnlyOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/auth/ws-ticket:
    post:
      operationId: authWsTicket
      summary: Mint a one-shot, ~30s-TTL ticket for the human WebSocket handshake.
      description: >-
        The resulting ticket is passed as `?ticket=<value>` on `GET /ws` — see the
        WebSocket tag for the full handshake flow.
      tags: [Auth, WebSocket]
      responses:
        '200': { $ref: '#/components/responses/WsTicketOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403':
          description: >-
            Caller is a bot account. Bots authenticate with `hb_` tokens and are accepted by the
            shared auth middleware, but they must not hold a human socket — they use the read-only
            `GET /api/bot/gateway` instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: WS ticket service not enabled on this server (falls back to the legacy ?token= WS path).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

  # ── Users ──
  /api/users/me:
    get:
      operationId: usersMe
      summary: Get the caller's own user record.
      tags: [Users]
      responses:
        '200': { $ref: '#/components/responses/UserOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/profile:
    patch:
      operationId: usersUpdateProfile
      summary: Update the caller's profile fields.
      description: >-
        Global endpoint (not server-scoped) — routed through MemberHandler
        but has nothing to do with any one server's membership. Response is
        a MemberWithRoles view with roles always empty (see the schema
        description).
      tags: [Users]
      requestBody: { $ref: '#/components/requestBodies/UpdateProfileRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/MemberWithRolesOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/users/me/password:
    post:
      operationId: usersChangePassword
      summary: Change the caller's password.
      description: >-
        Requires current_password even though the caller is already
        authenticated — defense-in-depth against a stolen/XSS'd JWT. On
        success, invalidates every session for this user: deletes all
        refresh-session rows, bumps token_version (so every outstanding
        access token dies, not just future ones), and disconnects any
        open WebSocket. This includes the CALLER's own session — the
        server has no way to identify "this" session as distinct from any
        other (the refresh cookie is scoped Path=/api/auth and isn't sent
        on this endpoint) — so the caller must sign in again too.
        Response message is literally "password changed".
      tags: [Users]
      requestBody: { $ref: '#/components/requestBodies/ChangePasswordRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/MessageOnlyOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/email:
    put:
      operationId: usersChangeEmail
      summary: Change the caller's email address.
      description: >-
        Requires the current password. An empty new_email removes the
        caller's email (sets it to NULL) instead of being rejected.
      tags: [Users]
      requestBody: { $ref: '#/components/requestBodies/ChangeEmailRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/ChangeEmailOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/users/me/avatar:
    post:
      operationId: usersUploadAvatar
      summary: Upload the caller's avatar image.
      description: >-
        Multipart field "file", at most 8 MiB. avatar_url is always a static
        PNG/JPEG (longest edge 256 px). A GIF with two or more frames also
        produces avatar_animated_url (128×128 GIF, at most 100 frames, 1 MP
        logical screen, 40 MP total); any other upload clears it. Animated
        WebP is rejected with 400. Responds with MemberWithRoles and
        broadcasts member_update.
      tags: [Users]
      requestBody: { $ref: '#/components/requestBodies/StubMultipart' }
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
        '503':
          description: >-
            The animated-avatar processing slot was busy (or processing hit
            its 10 s deadline). Retry after the Retry-After header (5 s).
          headers:
            Retry-After:
              schema: { type: integer, example: 5 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/users/me/wallpaper:
    post:
      operationId: usersUploadWallpaper
      summary: Upload the caller's chat wallpaper image.
      tags: [Users]
      requestBody: { $ref: '#/components/requestBodies/StubMultipart' }
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    delete:
      operationId: usersDeleteWallpaper
      summary: Remove the caller's chat wallpaper.
      tags: [Users]
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/banner:
    post:
      operationId: usersUploadBanner
      summary: Upload the caller's profile banner image.
      description: >-
        Multipart field "file", at most 8 MiB. Static only (an animated GIF
        contributes its first frame, an APNG its default image; animated
        WebP is rejected with 400). Centre-cropped to 5:2 and scaled down to
        at most 1200×480, stored as PNG (translucent) or JPEG. Broadcasts
        member_update.
      tags: [Users]
      requestBody: { $ref: '#/components/requestBodies/StubMultipart' }
      responses:
        '200': { $ref: '#/components/responses/MemberWithRolesOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
    delete:
      operationId: usersDeleteBanner
      summary: Remove the caller's profile banner.
      description: Sets banner_url to null, deletes the file and broadcasts member_update.
      tags: [Users]
      responses:
        '200': { $ref: '#/components/responses/MemberWithRolesOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/users/me/preferences:
    get:
      operationId: usersGetPreferences
      summary: Get the caller's client preferences.
      description: >-
        Never 404s — a user with no saved row gets back an empty
        `data: {}` object rather than an error.
      tags: [Users]
      responses:
        '200': { $ref: '#/components/responses/UserPreferencesOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    patch:
      operationId: usersUpdatePreferences
      summary: Update the caller's client preferences.
      description: Top-level-key merge only (not a deep/recursive merge) of the partial object into the existing preferences blob.
      tags: [Users]
      requestBody: { $ref: '#/components/requestBodies/UpdatePreferencesRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/UserPreferencesOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/dismiss-download-prompt:
    post:
      operationId: usersDismissDownloadPrompt
      summary: Mark the desktop-app download prompt as dismissed.
      tags: [Users]
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/dismiss-welcome:
    post:
      operationId: usersDismissWelcome
      summary: Mark the first-run welcome flow as dismissed.
      tags: [Users]
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  # ── Notifications (inbox) ──
  /api/users/me/notifications:
    get:
      operationId: notificationsList
      summary: List the caller's inbox, newest first, with keyset pagination.
      description: >-
        `before` is the id of the oldest notification already loaded (keyset
        cursor on created_at DESC, id DESC); an unknown cursor yields an empty
        page. `limit` is clamped to 1..50 (default 20). `unread_only=1` (or
        `true`) restricts to rows with `read_at` null.
      tags: [Notifications]
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string }
        - name: unread_only
          in: query
          required: false
          schema: { type: string, enum: ["1", "true"] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/NotificationPageOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/notifications/count:
    get:
      operationId: notificationsCount
      summary: Unread notification count for the badge.
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/NotificationCountOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/notifications/read-all:
    post:
      operationId: notificationsReadAll
      summary: Mark every unread notification as read.
      description: >-
        Also pushes `notification_read` (`all: true`, `unread_count: 0`) to the caller's own sessions.
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/NotificationsMarkedOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/notifications/{id}/read:
    post:
      operationId: notificationsRead
      summary: Mark one notification as read (idempotent).
      description: >-
        404 covers both "no such notification" and "not yours" — the two are
        deliberately indistinguishable so ids cannot be probed. Pushes
        `notification_read` (`ids: [id]`, `all: false`, current
        `unread_count`) to the caller's own sessions.
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Notification ID.
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── Saved messages (bookmarks) ──
  /api/users/me/saved:
    get:
      operationId: savedList
      summary: List the caller's bookmarks, newest first, with keyset pagination.
      description: >-
        `before` is the id of the oldest saved row already loaded (keyset
        cursor on created_at DESC, id DESC, scoped to the caller — an unknown
        or foreign cursor yields an empty page). `limit` is clamped to 1..50
        (default 20). Channel permissions are re-resolved per distinct channel
        on the page. Rows are never dropped: a row the caller can no longer
        read (or whose permission resolve fails, or whose message is gone) is
        returned as a stub with `message`/`dm_message` null and
        `unavailable: true`, so it can still be seen and deleted. `has_more`
        and `next_before` (the last row's id, pass it as `before`; null when
        `has_more` is false) are computed from the raw rows.
      tags: [Saved]
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { $ref: '#/components/responses/SavedMessagePageOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      operationId: savedCreate
      summary: Bookmark a channel or DM message.
      description: >-
        Exactly one of `message_id` / `dm_message_id` is required. The caller
        must be able to read the message now (channel: ViewChannel +
        ReadMessages, override-aware → 403; DM: channel membership → 403;
        unknown id → 404). Idempotent: a message that is already saved answers
        200 with the existing row (the note in the repeat request is ignored).
        At most 500 bookmarks per user — past that, 400 with error
        `saved_limit_reached`. `note` is ≤1024 runes, CRLF-normalised,
        rejected (400) if it carries bidi/zero-width/control characters other
        than newline and tab.
      tags: [Saved]
      requestBody: { $ref: '#/components/requestBodies/CreateSavedMessageRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/SavedMessageOK' }
        '201': { $ref: '#/components/responses/SavedMessageCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/users/me/saved/ids:
    get:
      operationId: savedListIDs
      summary: Every message id the caller has bookmarked (for painting bookmark state).
      tags: [Saved]
      responses:
        '200': { $ref: '#/components/responses/SavedMessageIDsOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/saved/{id}:
    patch:
      operationId: savedUpdateNote
      summary: Replace the note on a bookmark.
      description: >-
        `note` null or empty clears it (stored NULL). 404 covers both "no such
        row" and "not yours" — deliberately indistinguishable so ids cannot
        be probed. Same note validation as POST.
      tags: [Saved]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Saved message ID.
      requestBody: { $ref: '#/components/requestBodies/UpdateSavedNoteRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/SavedMessageOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: savedDelete
      summary: Remove a bookmark (same 404 rule as PATCH).
      tags: [Saved]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Saved message ID.
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── Private user notes ──
  /api/users/{userId}/note:
    get:
      operationId: userNoteGet
      summary: The caller's private note about a user.
      description: >-
        Answers `{note: "", updated_at: null}` when nothing is stored.
      tags: [UserNotes]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { $ref: '#/components/responses/UserNoteOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    put:
      operationId: userNoteSet
      summary: Store (or clear) the caller's private note about a user.
      description: >-
        The note is trimmed, CRLF-normalised, bounded to 1024 runes and
        rejected (400) on bidi/zero-width/control characters other than
        newline and tab. An empty note deletes the row and answers
        `{note: "", updated_at: null}`. 404 when the target user does not
        exist.
      tags: [UserNotes]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody: { $ref: '#/components/requestBodies/UpsertUserNoteRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/UserNoteOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── Servers (global) ──
  /api/servers:
    get:
      operationId: serversList
      summary: List servers the caller belongs to.
      tags: [Servers]
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      operationId: serversCreate
      summary: Create a new server.
      tags: [Servers]
      requestBody: { $ref: '#/components/requestBodies/StubJSON' }
      responses:
        '201': { $ref: '#/components/responses/StubCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/servers/join:
    post:
      operationId: serversJoin
      summary: Join a server via invite code.
      tags: [Servers]
      requestBody: { $ref: '#/components/requestBodies/StubJSON' }
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /api/servers/reorder:
    patch:
      operationId: serversReorder
      summary: Reorder the caller's server sidebar list.
      tags: [Servers]
      requestBody: { $ref: '#/components/requestBodies/StubJSON' }
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/servers/mutes:
    get:
      operationId: serversListMutes
      summary: List servers the caller has muted.
      tags: [Servers]
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  # ── Uploads ──
  /api/uploads/{path}:
    get:
      operationId: uploadsServe
      summary: Serve an uploaded/generated file (attachment, avatar, icon, badge, soundboard clip, ...).
      description: >-
        Registered as the catch-all prefix `GET /api/uploads/` (Go 1.22 ServeMux
        prefix match), not a literal single-segment route. Access control is
        per-category and enforced inside the handler, not by routing middleware,
        in this order: channel attachment (channel-read permission) -> DM
        attachment (participant only) -> report attachment (reporter or
        platform admin) -> feedback attachment (ticket owner or platform admin)
        -> positive public-asset match (users.avatar_url|wallpaper_url,
        servers.icon_url|banner_url, server_emojis.file_url|animated_url,
        server_stickers.file_url|animated_url)
        -> soundboard/badges path prefix -> 404
        for anything matching none of the above (fail closed, not served
        public). Channel/DM/report/feedback attachments require either a
        Bearer session token or the `hichat_media` cookie; the public-asset
        and path-prefix categories are served with no auth check so they keep
        rendering in unauthenticated `<img>` contexts. Path traversal is
        rejected (path.Clean + SafeJoin), and the ACL lookup independently
        rejects non-canonical paths (see services/media_access_service.go).
      tags: [Uploads]
      security:
        - {}
        - bearerAuth: []
        - mediaCookie: []
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: >-
            Category-prefixed relative file path as stored at upload time,
            e.g. `<16-hex>_<name>.png` (channel/DM/report/feedback
            attachment or avatar/icon), `soundboard/<16-hex>_<name>.mp3`,
            `badges/badge_<16-hex>.<ext>`, `emojis/<16-hex>.png|.gif`,
            `stickers/<16-hex>.png|.gif`.
      responses:
        '200':
          description: File bytes, Content-Type inferred from extension.
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── DMs ──
  /api/dms/settings:
    get:
      operationId: dmsGetSettings
      summary: Get the caller's global DM preferences.
      tags: [DMSettings]
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/dms:
    get:
      operationId: dmsList
      summary: List the caller's DM channels.
      description: >-
        Each item (models.DMChannelWithUser) also carries `unread_count`
        (the caller's dm_reads counter, 0 without a row) and `last_message`
        (DMLastMessage, or null for a channel with no messages).
      tags: [DMs]
      responses:
        '200': { $ref: '#/components/responses/DMChannelListOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      operationId: dmsCreate
      summary: Create or get the existing 1:1 DM channel with another user.
      description: '`user_id` equal to the caller is rejected (400) — the self-DM lives at POST /api/dms/self.'
      tags: [DMs]
      requestBody: { $ref: '#/components/requestBodies/StubJSON' }
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/self:
    post:
      operationId: dmsSelf
      summary: Create or get the caller's "notes to self" DM channel.
      description: >-
        No body. An ordinary DM channel whose two participants are both the
        caller (`other_user` is the caller's own public view). Created once
        and always `accepted`; sending into it skips block/privacy/request
        checks and the recipient unread bump. On first creation
        `dm_channel_create` is pushed to the caller's own sessions.
      tags: [DMs]
      responses:
        '200': { $ref: '#/components/responses/DMChannelOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/dms/{channelId}/read:
    post:
      operationId: dmsMarkRead
      summary: Mark a DM channel as read for the caller.
      description: >-
        Resets the caller's `unread_count` on the channel. The body is
        optional: `{"message_id": "<id>"}` also moves the last-read
        watermark; an empty body (or empty message_id) keeps the stored
        watermark. Echoes `dm_read` to the caller's own sessions only.
      tags: [DMs]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        description: Optional — see the operation description.
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkDMReadRequest' }
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/channels/{channelId}/hide:
    post:
      operationId: dmsHide
      summary: Hide a DM channel from the caller's DM list.
      tags: [DMSettings]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: dmsUnhide
      summary: Unhide a previously hidden DM channel.
      tags: [DMSettings]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/channels/{channelId}/pin-conversation:
    post:
      operationId: dmsPinConversation
      summary: Pin a DM conversation to the top of the caller's DM list.
      tags: [DMSettings]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: dmsUnpinConversation
      summary: Unpin a DM conversation.
      tags: [DMSettings]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/channels/{channelId}/mute:
    post:
      operationId: dmsMute
      summary: Mute notifications for a DM channel.
      tags: [DMSettings]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: dmsUnmute
      summary: Unmute a DM channel.
      tags: [DMSettings]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/channels/{channelId}/accept:
    post:
      operationId: dmsAcceptRequest
      summary: Accept a pending DM request (first message from a non-friend).
      tags: [DMs]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/channels/{channelId}/decline:
    post:
      operationId: dmsDeclineRequest
      summary: Decline a pending DM request.
      tags: [DMs]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/channels/{channelId}/e2ee:
    patch:
      operationId: dmsToggleE2ee
      summary: Toggle end-to-end encryption for a DM channel.
      tags: [DMSettings]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody: { $ref: '#/components/requestBodies/StubJSON' }
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/{channelId}/messages:
    get:
      operationId: dmMessagesList
      summary: List messages in a DM channel.
      description: >-
        Same cursor contract as the channel history endpoint: `before`
        (older, default), `around` (window centred on a message) or `after`
        (newer) — mutually exclusive (400 when combined); the anchor must
        belong to this channel (404 otherwise). Messages are ASC;
        `has_more_after` is only meaningful for `around`/`after`.
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/BeforeParam'
        - $ref: '#/components/parameters/AroundParam'
        - $ref: '#/components/parameters/AfterParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      operationId: dmMessagesSend
      summary: Send a message in a DM channel (JSON or multipart with attachment).
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody: { $ref: '#/components/requestBodies/StubJSON' }
      responses:
        '201': { $ref: '#/components/responses/StubCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/messages/{id}:
    patch:
      operationId: dmMessagesEdit
      summary: Edit a DM message.
      tags: [Messages]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: DM message ID.
      requestBody: { $ref: '#/components/requestBodies/StubJSON' }
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: dmMessagesDelete
      summary: Delete a DM message.
      tags: [Messages]
      parameters:
