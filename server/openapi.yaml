  /api/users/{userId}/report:
    post:
      operationId: reportsCreateUserReport
      summary: Report a user for abuse/policy violation.
      tags: [Reports]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody: { $ref: '#/components/requestBodies/StubMultipart' }
      responses:
        '201': { $ref: '#/components/responses/StubCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
