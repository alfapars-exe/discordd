  /api/servers/{serverId}/channels/{channelId}/music/resume:
    post:
      operationId: musicResume
      summary: Resume paused playback.
      tags: [Music]
      x-permission-note: >-
        authServer only grants membership; MusicHandler enforces PermSpeak in
        the target voice channel — not reflected in x-required-permission.
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/servers/{serverId}/channels/{channelId}/music/stop:
    post:
      operationId: musicStop
