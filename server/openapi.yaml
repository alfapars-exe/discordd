        '401': { $ref: '#/components/responses/UnauthorizedError' }
    get:
      operationId: e2eeGetKeyBackup
      summary: Fetch the caller's key backup blob.
      tags: [E2EE-KeyBackup]
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: e2eeDeleteKeyBackup
