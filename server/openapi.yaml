        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: soundboardDelete
      summary: Delete a soundboard clip.
      tags: [Soundboard]
      x-required-permission: { name: PermManageSoundboard, value: 131072 }
