      summary: Liveness probe. Always returns 200; body reports the cached deep-dependency verdict.
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
  /api/ready:
    get:
      operationId: systemReady
      summary: Readiness probe. Performs a request-time DB check; may return 503.
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '503':
          description: Not ready — a dependency (typically the database) failed its live check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /static/landing/{file}:
    get:
      operationId: systemStaticLanding
      summary: Serve a public landing-page asset (video, screenshots).
      tags: [System]
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string }
          description: Single path segment — nested paths are rejected (404).
      responses:
        '200':
          description: Asset bytes.
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/version:
    get:
      operationId: systemVersion
      summary: Get the current process's startup ID, used by clients to detect a new deploy.
      tags: [System]
      security: []
      responses:
        '200':
          description: '`{"version": "<uuid, regenerated per process start>"}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Human session access token, minted by POST /api/auth/login or
        POST /api/auth/refresh. Sent as `Authorization: Bearer <jwt>`.
    botAuth:
      type: http
      scheme: bearer
      description: >-
        Bot automation credential minted by POST /api/bots. Uses the identical
        `Authorization: Bearer <token>` header as bearerAuth; AuthMiddleware.Require
        distinguishes the two by the models.BotTokenPrefix `hb_` prefix on the
        token value itself, before falling back to JWT validation. Accepted on
        every route documented with the default bearerAuth + botAuth security
        requirement (both are alternatives — either satisfies it).
    mediaCookie:
      type: apiKey
      in: cookie
      name: hichat_media
      description: >-
        Scope-limited media JWT set as an HttpOnly cookie on login/refresh.
        Authenticates ONLY GET /api/uploads/* (channel/DM attachment bytes),
        for contexts that cannot set a header — a bare `<img>`/`<video>` src.
        AuthMiddleware rejects any non-empty token scope on every other route,
        so a leaked media token cannot be replayed against the rest of the API.
    livekitWebhook:
      type: apiKey
      in: header
      name: Authorize
      description: >-
        Not a per-caller secret in the usual apiKey sense: LiveKit signs each
        webhook delivery with an HMAC-derived, JWT-shaped token in the
        `Authorize` header. The server verifies it against every configured
        LiveKit instance's decrypted API key/secret pair (a multi-key
        webhook.ReceiveWebhookEvent provider), so any known instance's
        credentials validate the signature — there is no client-supplied
        credential to document beyond "this header must verify."
  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      schema: { type: string }
      description: Server (guild) ID.
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string }
      description: Channel ID.
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
      description: Message ID.
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }
      description: Role ID (channel-permission override target).
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
      description: Target user ID.
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
      description: E2EE device ID.
    SoundId:
      name: soundId
      in: path
      required: true
      schema: { type: string }
      description: Soundboard sound ID.
    BotId:
      name: botID
      in: path
      required: true
      schema: { type: string }
      description: Bot account ID.
    InviteCode:
      name: code
      in: path
      required: true
      schema: { type: string }
      description: Invite code.
    LiveKitInstanceId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: LiveKit instance ID.
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer }
      description: Page size limit.
    OffsetParam:
      name: offset
      in: query
      required: false
      schema: { type: integer }
      description: Pagination offset.
    BeforeParam:
      name: before
      in: query
      required: false
      schema: { type: string }
      description: Cursor — return items before this ID (or, for the audit log, timestamp).
    QParam:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: Search query text.
    PerPageParam:
      name: per_page
      in: query
      required: false
      schema: { type: integer }
      description: Results per page.
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer }
      description: Page number (1-based).
    PeriodParam:
      name: period
      in: query
      required: false
      schema: { type: string, enum: ['24h', '7d', '30d'], default: '24h' }
      description: Metrics aggregation window.
  schemas:
    ErrorCode:
      type: string
      description: >-
        Machine-readable error identifier derived from the domain sentinel
        error (server/pkg/errors.go) via pkg.errorCode. Empty/omitted on
        success responses and on some legacy message-only error paths
        (pkg.ErrorWithMessage).
      enum:
        - NOT_FOUND
        - UNAUTHORIZED
        - FORBIDDEN
        - ALREADY_EXISTS
        - BAD_REQUEST
        - CONFLICT
        - INVALID_KEY
        - INTERNAL
    ApiEnvelope:
      type: object
      description: Standard response envelope wrapping every API response (pkg.APIResponse).
      properties:
        success:
          type: boolean
          description: true on 2xx responses, false on error responses.
        data:
          description: >-
            Present on success responses; omitted on error responses. Payload
            shape is operation-specific — see the allOf composition on each
            2xx response.
        error:
          type: string
          description: Human-readable message. Present only on error responses (safe to display for 4xx; generic text for 5xx).
        code:
          $ref: '#/components/schemas/ErrorCode'
      required: [success]
    ErrorResponse:
      description: Envelope shape on error responses — success is always false; data is omitted.
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            success:
              type: boolean
              enum: [false]
          required: [success, error]
    StubData:
      description: 'TODO: detailed schema — to be specified in the next authoring phase.'
      type: object
      additionalProperties: true

    # ── Shared primitives (Auth / Users / Messages / Reactions / Pins / Channels / Categories) ──
    MessageOnlyResponse:
      description: >-
        Generic `{"message": "..."}` payload shared by several endpoints that
        have no richer data to return (pkg.JSON with a map[string]string).
        The exact text is operation-specific — see each operation's
        description for the literal string it sends.
      type: object
      properties:
        message: { type: string }
      required: [message]
      example: { message: "logged out" }
    User:
      description: >-
        models.User as exposed to the caller. Fields tagged `json:"-"` in Go
        (PasswordHash, TokenVersion, PlatformBanReason, PlatformBannedBy,
        PlatformBannedAt) are never serialized and are omitted here.
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        wallpaper_url: { type: [string, "null"] }
        status:
          $ref: '#/components/schemas/UserStatus'
        pref_status:
          allOf: [{ $ref: '#/components/schemas/UserStatus' }]
          description: >-
            The user's saved/preferred status (what they picked in the
            client), as opposed to `status` which is the live computed
            presence. `pref_status=offline` is HiChat's "invisible mode".
        custom_status: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        language: { type: string, example: en }
        dm_privacy:
          type: string
          enum: [everyone, message_request, friends_only]
        is_platform_admin: { type: boolean }
        is_platform_banned: { type: boolean }
        has_seen_download_prompt: { type: boolean }
        has_seen_welcome: { type: boolean }
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: >-
            Offline-transition timestamp. Always null while pref_status is
            NOT "offline" and the user is online; ALSO forced null (even
            though the DB column is populated) when pref_status="offline" —
            invisible mode never leaks a "last seen" timestamp (see
            models.ToMemberWithRoles and the client-facing suppression rule
            it implements).
        is_bot: { type: boolean }
        owner_user_id:
          type: string
          description: Set only on bot accounts (migration 072) — the human owner's user ID. Omitted for human users.
        created_at: { type: string, format: date-time }
      required: [id, username, status, pref_status, language, dm_privacy, is_platform_admin, is_platform_banned, has_seen_download_prompt, has_seen_welcome, is_bot, created_at]
      example:
        id: "a1b2c3d4e5f6a7b8"
        username: hb_wanderer
        display_name: Wanderer
        avatar_url: null
        wallpaper_url: null
        status: online
        pref_status: online
        custom_status: null
        email: user@example.com
        language: en
        dm_privacy: everyone
        is_platform_admin: false
        is_platform_banned: false
        has_seen_download_prompt: true
        has_seen_welcome: true
        last_seen_at: null
        is_bot: false
        created_at: "2026-01-15T10:20:30Z"
    UserStatus:
      type: string
      enum: [online, idle, dnd, offline]

    # ── Auth ──
    RegisterRequest:
      description: models.CreateUserRequest — body of POST /api/auth/register.
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
          description: Trimmed server-side; letters, digits, and underscore only.
        password:
          type: string
          minLength: 8
          format: password
        display_name:
          type: string
          maxLength: 32
          description: Trimmed server-side. Optional — omitted/empty stores null.
        email:
          type: string
          format: email
          description: Optional. Validated against a simple `local@domain.tld` regex when non-empty.
        invite_code:
          type: string
          description: >-
            Accepted by the request shape but currently a DEAD FIELD:
            AuthService.Register never reads CreateUserRequest.InviteCode —
            there is no invite-gated registration flow in the code today.
            Do not rely on this for access control.
      required: [username, password]
      example:
        username: hb_wanderer
        password: "correct-horse-battery-staple"
        display_name: Wanderer
        email: user@example.com
        invite_code: ""
    LoginRequest:
      description: models.LoginRequest — body of POST /api/auth/login.
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password }
      required: [username, password]
      example:
        username: hb_wanderer
        password: "correct-horse-battery-staple"
    RefreshTokenBody:
      description: >-
        Optional JSON body for POST /api/auth/refresh and POST
        /api/auth/logout. Both endpoints prefer the HttpOnly `hichat_refresh`
        cookie (set on register/login/refresh) via extractRefreshToken; this
        field is the fallback for native clients that don't manage cookies.
        An empty body is valid when the cookie is present.
      type: object
      properties:
        refresh_token: { type: string }
      example:
        refresh_token: ""
    AuthTokens:
      description: >-
        services.AuthTokens — returned by register/login/refresh. The refresh
        token itself is deliberately `json:"-"` and never appears in this
        body; it is delivered exclusively via the HttpOnly+Secure
        `hichat_refresh` cookie set on the same response (see
        handlers/auth.go setRefreshCookie). A `hichat_media` cookie (scope
        media JWT) is also set as a side effect for inline attachment
        rendering.
      type: object
      properties:
        access_token: { type: string }
        user:
          $ref: '#/components/schemas/User'
      required: [access_token, user]
      example:
        access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          id: "a1b2c3d4e5f6a7b8"
          username: hb_wanderer
          display_name: Wanderer
          avatar_url: null
          wallpaper_url: null
          status: online
          pref_status: online
          custom_status: null
          email: user@example.com
          language: en
          dm_privacy: everyone
          is_platform_admin: false
          is_platform_banned: false
          has_seen_download_prompt: false
          has_seen_welcome: false
          last_seen_at: null
          is_bot: false
          created_at: "2026-01-15T10:20:30Z"
    ForgotPasswordRequest:
      description: models.ForgotPasswordRequest — body of POST /api/auth/forgot-password.
      type: object
      properties:
        email: { type: string, format: email }
      required: [email]
      example:
        email: user@example.com
    ResetPasswordRequest:
      description: models.ResetPasswordRequest — body of POST /api/auth/reset-password.
      type: object
      properties:
        token:
          type: string
          description: Plaintext one-time token from the emailed reset link (only its SHA-256 hash is stored server-side).
        new_password:
          type: string
          minLength: 8
          format: password
      required: [token, new_password]
      example:
        token: "9f8e7d6c5b4a3210"
        new_password: "new-correct-horse-battery"
    WsTicketResponse:
      description: >-
        One-shot, ~30-second-TTL ticket minted by POST /api/auth/ws-ticket
        for the `GET /ws?ticket=<value>` handshake.
      type: object
      properties:
        ticket: { type: string }
      required: [ticket]
      example:
        ticket: "wst_5f3e2c1a9b8d7e6f"

    # ── Users (me) ──
    ChangePasswordRequest:
      description: >-
        Anonymous struct in handlers/auth.go ChangePassword — not a named
        Go type. Requires current_password (defense-in-depth against a
        stolen/XSS'd JWT) in addition to session auth.
      type: object
      properties:
        current_password: { type: string, format: password }
        new_password:
          type: string
          minLength: 6
          format: password
          description: >-
            AuthService.ChangePassword enforces a 6-character minimum here —
            note this is LOWER than registration's 8-character minimum
            (models.CreateUserRequest.Validate); documented as coded, not a
            recommendation.
      required: [current_password, new_password]
      example:
        current_password: "correct-horse-battery-staple"
        new_password: "newer-horse-battery-staple"
    ChangeEmailRequest:
      description: models.ChangeEmailRequest — body of PUT /api/users/me/email.
      type: object
      properties:
        password:
          type: string
          format: password
          description: Current password, re-verified via bcrypt before the change is applied.
        new_email:
          type: string
          format: email
          description: Empty string (or field omitted) REMOVES the caller's email (sets it to NULL) rather than being rejected.
      required: [password]
      example:
        password: "correct-horse-battery-staple"
        new_email: newmail@example.com
    ChangeEmailResponse:
      type: object
      properties:
        message: { type: string, example: "email updated" }
        email:
          type: [string, "null"]
          description: The new email value, or null when new_email was empty (email removed).
      required: [message, email]
    UpdateProfileRequest:
      description: >-
        models.UpdateProfileRequest — body of PATCH /api/users/me/profile.
        Every field is a pointer: omitted/null means "leave unchanged".
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
          description: Checked for availability against every other user; 409 if taken.
        display_name:
          type: string
          maxLength: 32
          description: Explicit empty string clears it (stores null).
        avatar_url:
          type: string
          description: >-
            Freeform string, not validated against the upload service — the
            dedicated POST /api/users/me/avatar endpoint is the normal way
            to set this from an uploaded file.
        custom_status:
          type: string
          maxLength: 128
          description: Explicit empty string clears it (stores null).
        language:
          type: string
          enum: [en, tr]
        dm_privacy:
          type: string
          enum: [everyone, message_request, friends_only]
      example:
        display_name: Wanderer
        custom_status: "on a quest"
        language: en
        dm_privacy: everyone
    MemberWithRoles:
      description: >-
        models.MemberWithRoles — the response payload of
        PATCH /api/users/me/profile. This is a GLOBAL (non-server-scoped)
        update, so ToMemberWithRoles is called with a nil roles slice here:
        `roles` is always `[]` and `effective_permissions` is always `0` for
        THIS operation. The server-scoped fields (nickname, non-empty roles,
        a real effective_permissions mask, timeout_expires_at) only carry
        meaningful values from the per-server Members endpoints (out of
        scope in this authoring pass).
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        nickname: { type: [string, "null"] }
        status:
          $ref: '#/components/schemas/UserStatus'
        custom_status: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        roles:
          type: array
          items: {}
          description: Always empty for this endpoint (see the schema description above).
        effective_permissions:
          type: integer
          description: Bitwise-OR of role permissions (see the top-level x-permissions bit catalog). Always 0 for this endpoint.
        timeout_expires_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
      required: [id, username, status, created_at, roles, effective_permissions]
      example:
        id: "a1b2c3d4e5f6a7b8"
        username: hb_wanderer
        display_name: Wanderer
        avatar_url: null
        nickname: null
        status: online
        custom_status: "on a quest"
        created_at: "2026-01-15T10:20:30Z"
        roles: []
        effective_permissions: 0
    UserPreferences:
      description: models.UserPreferences — GET/PATCH /api/users/me/preferences payload.
      type: object
      properties:
        user_id: { type: string }
        data:
          type: object
          additionalProperties: true
          description: >-
            Opaque, free-form client-synced settings blob. The backend does
            no field-level validation and just top-level-key-merges PATCH
            bodies into this object.
        updated_at:
          type: string
          description: >-
            SQLite's default CURRENT_TIMESTAMP text form
            ("YYYY-MM-DD HH:MM:SS", not RFC3339) — treat as an opaque
            display string rather than a strict date-time.
      required: [user_id, data, updated_at]
      example:
        user_id: "a1b2c3d4e5f6a7b8"
        data: { theme: dark, notifications_muted: false }
        updated_at: "2026-01-15 10:20:30"
    UpdatePreferencesRequest:
      description: models.UpdatePreferencesRequest — body of PATCH /api/users/me/preferences.
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
          description: Partial JSON object; present keys are merged into existing data, other keys are left untouched.
      required: [data]
      example:
        data: { theme: dark }

    # ── Messages (server-channel scoped) ──
    Attachment:
      description: models.Attachment.
      type: object
      properties:
        id: { type: string }
        message_id: { type: string }
        filename: { type: string }
        file_url: { type: string }
        file_size: { type: [integer, "null"], format: int64 }
        mime_type: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
      required: [id, message_id, filename, file_url, created_at]
    ReactionGroup:
      description: models.ReactionGroup — reactions on a message, aggregated by emoji.
      type: object
      properties:
        emoji: { type: string }
        count: { type: integer }
        users:
          type: array
          items: { type: string }
          description: User IDs who used this emoji — lets the client render "you reacted" highlighting.
      required: [emoji, count, users]
    MessageReference:
      description: >-
        models.MessageReference — a preview of the replied-to message. If the
        original message was deleted, author and content are both null.
      type: object
      properties:
        id: { type: string }
        author:
          anyOf:
            - $ref: '#/components/schemas/User'
            - type: "null"
          description: Omitted/null if the original message (or its author) was deleted.
        content: { type: [string, "null"] }
      required: [id, content]
    Message:
      description: >-
        models.Message. E2EE: when encryption_version > 0, content is null
        and the payload lives in ciphertext (an opaque blob); sender_device_id
        identifies the E2EE device that encrypted it, and e2ee_metadata is an
        opaque sidecar for ratchet/sender-key bookkeeping.
      type: object
      properties:
        id: { type: string }
        channel_id: { type: string }
        user_id: { type: string }
        server_id:
          type: string
          description: >-
            Transient field, not stored in the DB — populated on the create
            path just before the WS broadcast so recipients can route the
            event without a channel lookup. May be empty on responses that
            didn't go through that path (e.g. list/edit).
        content: { type: [string, "null"] }
        edited_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        reply_to_id: { type: [string, "null"] }
        author:
          allOf: [{ $ref: '#/components/schemas/User' }]
          description: Populated via JOIN on reads; omitted on some write-path responses.
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        mentions:
          type: array
          items: { type: string }
          description: User IDs mentioned in plaintext content. Always empty for E2EE messages (server cannot read ciphertext).
        role_mentions:
          type: array
          items: { type: string }
          description: Role IDs mentioned in plaintext content. Always empty for E2EE messages.
        reactions:
          type: array
          items: { $ref: '#/components/schemas/ReactionGroup' }
        referenced_message:
          $ref: '#/components/schemas/MessageReference'
        encryption_version:
          type: integer
          enum: [0, 1]
          description: 0 = plaintext, 1 = E2EE.
        ciphertext: { type: [string, "null"] }
        sender_device_id: { type: [string, "null"] }
        e2ee_metadata: { type: [string, "null"] }
      required: [id, channel_id, user_id, content, created_at, reply_to_id, mentions, role_mentions, reactions, encryption_version]
      example:
        id: "m1a2b3c4"
        channel_id: "c1a2b3c4"
        user_id: "a1b2c3d4e5f6a7b8"
        server_id: "s1a2b3c4"
        content: "hello there"
        edited_at: null
        created_at: "2026-01-15T10:20:30Z"
        reply_to_id: null
        mentions: []
        role_mentions: []
        reactions: []
        encryption_version: 0
    MessagePage:
      description: models.MessagePage — cursor-based pagination response for GET .../messages.
      type: object
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        has_more: { type: boolean }
      required: [messages, has_more]
    CreateMessageRequest:
      description: >-
        models.CreateMessageRequest — JSON body of POST .../messages when no
        file attachment is sent (see CreateMessageMultipartRequest for the
        multipart/form-data shape). Content must be non-empty (1-999 runes,
        MaxMessageLength) UNLESS encryption_version=1, in which case
        ciphertext + sender_device_id are required instead and content is
        ignored.
      type: object
      properties:
        content:
          type: string
          maxLength: 999
        reply_to_id: { type: [string, "null"] }
        encryption_version:
          type: integer
          enum: [0, 1]
          default: 0
        ciphertext: { type: string, description: Required when encryption_version=1. }
        sender_device_id: { type: string, description: Required when encryption_version=1. }
        e2ee_metadata: { type: string }
      example:
        content: "hello there"
    CreateMessageMultipartRequest:
      description: >-
        multipart/form-data body of POST .../messages when attaching files
        (or sending an E2EE message, since form fields are also accepted
        there). Detected server-side by a literal "multipart/form-data"
        Content-Type prefix check (isMultipart), not full MIME parsing.
        E2EE fields must be supplied as a consistent set: encryption_version
        "1" requires both ciphertext and sender_device_id, and conversely
        ciphertext/sender_device_id without encryption_version="1" is
        rejected (400) rather than silently treated as plaintext.
      type: object
      properties:
        content: { type: string, description: Plaintext content form field. May be empty if files are attached. }
        reply_to_id: { type: string }
        encryption_version:
          type: string
          enum: ["0", "1"]
          description: Form values are strings, not JSON integers — only the literal "1" enables the E2EE branch.
        ciphertext: { type: string }
        sender_device_id: { type: string }
        e2ee_metadata: { type: string }
        files:
          type: array
          items: { type: string, format: binary }
          description: Zero or more file attachments (form field name "files", repeatable).
    MessageCreatePartialResponse:
      description: >-
        HTTP 207 Multi-Status — returned instead of 201 when the message was
        created but one or more attached files failed to upload (per-file
        failures no longer silently swallowed).
      type: object
      properties:
        message:
          $ref: '#/components/schemas/Message'
        upload_failures:
          type: array
          items:
            type: object
            properties:
              filename: { type: string }
              error: { type: string }
            required: [filename, error]
      required: [message, upload_failures]
    UpdateMessageRequest:
      description: >-
        models.UpdateMessageRequest — body of PATCH .../messages/{id}. The
        request's encryption_version MUST match the message's currently
        stored encryption_version (a 400 rejects any attempt to change
        format on edit) — this is not a format-migration endpoint.
      type: object
      properties:
        content:
          type: string
          maxLength: 999
        encryption_version:
          type: integer
          enum: [0, 1]
        ciphertext: { type: string, description: Required when encryption_version=1. }
        sender_device_id: { type: string }
        e2ee_metadata: { type: string }
      example:
        content: "hello there (edited)"
        encryption_version: 0

    # ── Reactions ──
    ToggleReactionRequest:
      description: >-
        Anonymous toggleRequest struct in handlers/reaction.go — emoji is
        sent in the body (not the URL path) to avoid emoji URL-encoding
        edge cases. Adds the reaction if the caller hasn't reacted with this
        emoji yet, removes it otherwise (toggle).
      type: object
      properties:
        emoji: { type: string, example: "👍" }
      required: [emoji]

    # ── Pins ──
    PinnedMessageWithDetails:
      description: >-
        models.PinnedMessageWithDetails — a pinned-message row joined with
        the full message and the user who pinned it.
      type: object
      properties:
        id: { type: string }
        message_id: { type: string }
        channel_id: { type: string }
        pinned_by: { type: string, description: User ID of whoever pinned the message. }
        created_at: { type: string, format: date-time }
        message:
          $ref: '#/components/schemas/Message'
        pinned_by_user:
          $ref: '#/components/schemas/User'
      required: [id, message_id, channel_id, pinned_by, created_at, message]

    # ── Channels ──
    Channel:
      description: models.Channel.
      type: object
      properties:
        id: { type: string }
        server_id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [text, voice, audit]
          description: >-
            "audit" is a server-wide moderation feed — exactly one per
            server, auto-created, not user-composable.
        category_id: { type: [string, "null"] }
        topic: { type: [string, "null"] }
        position: { type: integer }
        user_limit: { type: integer, description: "Voice channels only. 0 = unlimited." }
        bitrate: { type: integer, description: "Voice channels only, in bps." }
        created_at: { type: string, format: date-time }
      required: [id, server_id, name, type, category_id, topic, position, user_limit, bitrate, created_at]
      example:
        id: "c1a2b3c4"
        server_id: "s1a2b3c4"
        name: general
        type: text
        category_id: null
        topic: null
        position: 0
        user_limit: 0
        bitrate: 0
        created_at: "2026-01-15T10:20:30Z"
    CreateChannelRequest:
      description: models.CreateChannelRequest — body of POST /api/servers/{serverId}/channels.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        type:
          type: string
          enum: [text, voice, audit]
          description: >-
            "audit" is accepted here but capped at one per server — Create
            returns 400 if the server already has an audit channel (a plain
            ErrBadRequest, not a distinct sentinel/code).
        category_id:
          type: string
          description: >-
            Optional. Must reference a category in the SAME server: a
            nonexistent category_id returns 400; a category_id that exists
            but belongs to a DIFFERENT server returns 404 (both paths share
            the message "category not found" but differ in status code —
            documented as coded).
        topic: { type: string, maxLength: 1024 }
      required: [name, type]
      example:
        name: general
        type: text
        category_id: ""
        topic: ""
    UpdateChannelRequest:
      description: >-
        models.UpdateChannelRequest — body of PATCH
        /api/servers/{serverId}/channels/{id}. Every field is a pointer:
        omitted/null means "don't change".
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50, description: Audit channels reject a name change (403). }
        topic: { type: string, maxLength: 1024 }
        category_id:
          type: string
          description: Empty string removes from category; non-empty moves (same existence/ownership rules as create).
        bitrate:
          type: integer
          minimum: 8000
          maximum: 384000
          description: Voice channels only — silently ignored on text/audit channels.
        user_limit:
          type: integer
          minimum: 0
          maximum: 99
          description: Voice channels only (0 = unlimited) — silently ignored on text/audit channels.
      example:
        topic: "Welcome to #general"
    CategoryWithChannels:
      description: >-
        models.CategoryWithChannels — one grouped entry of GET/PATCH-reorder
        .../channels responses. An "Uncategorized" pseudo-group (channels
        with category_id=null) is synthesized with category.id="" and
        category.position=-1, sorted first when non-empty.
      type: object
      properties:
        category:
          $ref: '#/components/schemas/Category'
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
      required: [category, channels]
    PositionUpdate:
      description: models.PositionUpdate — one entry of a reorder request.
      type: object
      properties:
        id: { type: string }
        position: { type: integer, minimum: 0 }
        category_id:
          type: string
          description: >-
            Only meaningful for the channel-reorder endpoint (cross-category
            moves); unused by the category-reorder endpoint.
      required: [id, position]
    ReorderItemsRequest:
      description: >-
        Shared JSON shape for PATCH .../channels/reorder (models.ReorderChannelsRequest)
        AND PATCH .../categories/reorder (an equivalent anonymous
        `{items: []models.PositionUpdate}` struct in handlers/category.go) —
        both decode the identical `{"items": [...]}` body.
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PositionUpdate' }
          description: No duplicate ids; each position must be >= 0.
      required: [items]
      example:
        items:
          - { id: "c1a2b3c4", position: 0 }
          - { id: "c5d6e7f8", position: 1, category_id: "cat1" }

    # ── Categories ──
    Category:
      description: models.Category.
      type: object
      properties:
        id: { type: string }
        server_id: { type: string }
        name: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }
      required: [id, server_id, name, position, created_at]
      example:
        id: "cat1"
        server_id: "s1a2b3c4"
        name: "Text Channels"
        position: 0
        created_at: "2026-01-15T10:20:30Z"
    CreateCategoryRequest:
      description: models.CreateCategoryRequest — body of POST /api/servers/{serverId}/categories.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
      required: [name]
      example:
        name: "Text Channels"
    UpdateCategoryRequest:
      description: models.UpdateCategoryRequest — body of PATCH .../categories/{id}.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
      example:
        name: "Voice Channels"
  responses:
    StubOK:
      description: Success (200). Payload is a stub in this phase — see StubData.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StubData'
    StubCreated:
      description: Resource created (201). Payload is a stub in this phase — see StubData.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StubData'
    StubNoContent:
      description: Success, no response body (204).
    BadRequestError:
      description: Malformed request — validation failure, missing required field, or invalid query/path parameter.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnauthorizedError:
      description: Missing, malformed, expired, or revoked credential (session JWT or bot token).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ForbiddenError:
      description: >-
        Authenticated but not authorized — not a server member, missing the
        required permission bit, or (on platform routes) not a platform admin.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFoundError:
      description: Target resource does not exist, or is not visible to the caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ConflictError:
      description: >-
        State conflict — a duplicate resource (code ALREADY_EXISTS) or a
        conflicting current state (code CONFLICT, e.g. an exhausted E2EE
        one-time-prekey pool).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequestsError:
      description: Per-IP rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    # ── Auth ──
    AuthTokensResponse:
      description: Success — session tokens + the caller's user record (register/login/refresh).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
    MessageOnlyOK:
      description: 'Success (200) — generic `{"message": "..."}` payload.'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageOnlyResponse'
    WsTicketOK:
      description: Success (200) — one-shot WS ticket.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WsTicketResponse'

    # ── Users (me) ──
    UserOK:
      description: Success (200) — the caller's own user record.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    MemberWithRolesOK:
      description: Success (200) — the updated profile, as a MemberWithRoles view.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MemberWithRoles'
    ChangeEmailOK:
      description: Success (200) — email change confirmation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChangeEmailResponse'
    UserPreferencesOK:
      description: Success (200) — the caller's preferences blob.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserPreferences'

    # ── Messages ──
    MessagePageOK:
      description: Success (200) — a page of channel messages.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessagePage'
    MessageCreated:
      description: Success (201) — the created message.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
    MessageCreatePartial:
      description: >-
        Multi-Status (207) — the message was created but one or more
        attached files failed to upload; see MessageCreatePartialResponse.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageCreatePartialResponse'
    MessageOK:
      description: Success (200) — the updated message.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'

    # ── Pins ──
    PinnedMessageListOK:
      description: Success (200) — a channel's pinned messages.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PinnedMessageWithDetails' }
    PinnedMessageCreated:
      description: Success (201) — the pinned-message record.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PinnedMessageWithDetails'

    # ── Channels ──
    CategoryWithChannelsListOK:
      description: Success (200) — a server's channels, grouped by category.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryWithChannels' }
    ChannelCreated:
      description: Success (201) — the created channel.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Channel'
    ChannelOK:
      description: Success (200) — the updated channel.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Channel'

    # ── Categories ──
    CategoryListOK:
      description: Success (200) — a server's channel categories.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
    CategoryCreated:
      description: Success (201) — the created category.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
    CategoryOK:
      description: Success (200) — the updated category.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
  requestBodies:
    StubJSON:
      description: 'JSON request payload (stub — fields to be specified in the next authoring phase).'
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StubData' }
    StubMultipart:
      description: 'Multipart form payload (stub — fields/attachment to be specified in the next authoring phase).'
      required: true
      content:
        multipart/form-data:
          schema: { $ref: '#/components/schemas/StubData' }

    # ── Auth ──
    RegisterRequestBody:
      description: Body of POST /api/auth/register.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RegisterRequest' }
    LoginRequestBody:
      description: Body of POST /api/auth/login.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LoginRequest' }
    RefreshTokenRequestBody:
      description: Optional body of POST /api/auth/refresh or POST /api/auth/logout — see RefreshTokenBody.
      required: false
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RefreshTokenBody' }
    ForgotPasswordRequestBody:
      description: Body of POST /api/auth/forgot-password.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
    ResetPasswordRequestBody:
      description: Body of POST /api/auth/reset-password.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ResetPasswordRequest' }

    # ── Users (me) ──
    UpdateProfileRequestBody:
      description: Body of PATCH /api/users/me/profile.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
    ChangePasswordRequestBody:
      description: Body of POST /api/users/me/password.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
    ChangeEmailRequestBody:
      description: Body of PUT /api/users/me/email.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ChangeEmailRequest' }
    UpdatePreferencesRequestBody:
      description: Body of PATCH /api/users/me/preferences.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdatePreferencesRequest' }

    # ── Messages ──
    CreateMessageRequestBody:
      description: >-
        Body of POST /api/servers/{serverId}/channels/{id}/messages. Either
        a plain JSON payload (no attachments) or multipart/form-data (file
        attachments and/or E2EE form fields) — see isMultipart in
        handlers/message.go for the Content-Type dispatch.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateMessageRequest' }
        multipart/form-data:
          schema: { $ref: '#/components/schemas/CreateMessageMultipartRequest' }
    UpdateMessageRequestBody:
      description: Body of PATCH /api/servers/{serverId}/messages/{id}.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdateMessageRequest' }

    # ── Reactions ──
    ToggleReactionRequestBody:
      description: Body of POST /api/servers/{serverId}/messages/{messageId}/reactions.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ToggleReactionRequest' }

    # ── Channels ──
    CreateChannelRequestBody:
      description: Body of POST /api/servers/{serverId}/channels.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateChannelRequest' }
    UpdateChannelRequestBody:
      description: Body of PATCH /api/servers/{serverId}/channels/{id}.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdateChannelRequest' }
    ReorderItemsRequestBody:
      description: >-
        Shared body of PATCH .../channels/reorder AND PATCH
        .../categories/reorder — see ReorderItemsRequest.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReorderItemsRequest' }

    # ── Categories ──
    CreateCategoryRequestBody:
      description: Body of POST /api/servers/{serverId}/categories.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateCategoryRequest' }
    UpdateCategoryRequestBody:
      description: Body of PATCH /api/servers/{serverId}/categories/{id}.
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdateCategoryRequest' }
