  # ── Messages (server-scoped) ──
  /api/servers/{serverId}/channels/{id}/messages:
    get:
      operationId: messagesList
      summary: List messages in a channel.
      description: >-
        Cursor-based pagination, `limit` capped server-side at 100 (default
        50). Exactly one cursor form: `before` (messages older than the id —
        the default), `around` (a window centred on the id: up to limit/2
        older rows, the anchor, up to limit/2 newer rows) or `after`
        (messages strictly newer than the id); combining them is a 400. The
        anchor must be a message of THIS channel — an unknown id or another
        channel's id is a 404. Messages are always ASC (oldest first);
        `has_more` means older rows exist, `has_more_after` newer ones
        (always false for the `before` form).
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Channel ID.
        - $ref: '#/components/parameters/BeforeParam'
        - $ref: '#/components/parameters/AroundParam'
        - $ref: '#/components/parameters/AfterParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200': { $ref: '#/components/responses/MessagePageOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      operationId: messagesCreate
      summary: Send a message in a channel (JSON or multipart with attachment).
      description: >-
        Per-user rate limited (5/5s for all sends; a separate 20/min budget
        applies only to multipart/attachment sends). If the message is
        created but one or more attached files fail to upload, the response
        is 207 Multi-Status (the message still exists) instead of 201 — see
        MessageCreatePartialResponse.
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Channel ID.
      requestBody: { $ref: '#/components/requestBodies/CreateMessageRequestBody' }
      responses:
        '201': { $ref: '#/components/responses/MessageCreated' }
        '207': { $ref: '#/components/responses/MessageCreatePartial' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/servers/{serverId}/messages/{id}:
    patch:
      operationId: messagesUpdate
      summary: Edit a message.
      description: Owner only. Cannot change encryption_version on edit (400 if it doesn't match the message's currently stored value).
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Message ID.
      requestBody: { $ref: '#/components/requestBodies/UpdateMessageRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/MessageOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: messagesDelete
      summary: Delete a message.
      tags: [Messages]
      x-permission-note: >-
        authServerPermLoad only loads the caller's effective permissions into
        context — no gate at the middleware layer. messageService.Delete allows
        deleting one's own message unconditionally, and requires
        PermManageMessages to delete another member's message. Not reflected in
        x-required-permission.
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Message ID.
      responses:
        '200': { $ref: '#/components/responses/MessageOnlyOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

