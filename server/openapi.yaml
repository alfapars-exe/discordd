      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/{channelId}/pinned:
    get:
      operationId: dmMessagesListPinned
      summary: List a DM channel's pinned messages.
      tags: [Pins]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/{channelId}/search:
    get:
