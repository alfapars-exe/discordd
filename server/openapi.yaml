      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ConflictError:
      description: >-
        State conflict — a duplicate resource (code ALREADY_EXISTS) or a
        conflicting current state (code CONFLICT, e.g. an exhausted E2EE
        one-time-prekey pool).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
