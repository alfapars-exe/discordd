        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      operationId: channelsCreate
      summary: Create a channel.
      tags: [Channels]
      x-required-permission: { name: PermManageChannels, value: 1 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody: { $ref: '#/components/requestBodies/CreateChannelRequestBody' }
      responses:
        '201': { $ref: '#/components/responses/ChannelCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/servers/{serverId}/channels/reorder:
    patch:
      operationId: channelsReorder
      summary: Reorder a server's channels.
      description: Body shape shared with categoriesReorder — see ReorderItemsRequest. Response is the same grouped shape as channelsList.
      tags: [Channels]
      x-required-permission: { name: PermManageChannels, value: 1 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody: { $ref: '#/components/requestBodies/ReorderItemsRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/CategoryWithChannelsListOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/servers/{serverId}/channels/{id}:
    patch:
      operationId: channelsUpdate
      summary: Update a channel.
      tags: [Channels]
      x-required-permission: { name: PermManageChannels, value: 1 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Channel ID.
      requestBody: { $ref: '#/components/requestBodies/UpdateChannelRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/ChannelOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: channelsDelete
      summary: Delete a channel.
      description: The server's audit channel cannot be deleted (403).
      tags: [Channels]
      x-required-permission: { name: PermManageChannels, value: 1 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Channel ID.
      responses:
        '200': { $ref: '#/components/responses/MessageOnlyOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

