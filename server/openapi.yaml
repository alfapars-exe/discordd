        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── Custom emojis (expressions) ──
  /api/servers/{serverId}/emojis:
    get:
      operationId: serverEmojisList
      summary: List a server's custom emojis (members only), ordered by name.
      description: >-
        Returns `[]` (never null) when the server has none. Emoji images are
        public assets served from `url` / `animated_url` while the emoji row
        exists.
      tags: [Expressions]
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200': { $ref: '#/components/responses/ServerEmojiListOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      operationId: serverEmojiCreate
      summary: Upload a custom emoji.
      description: >-
        multipart/form-data with `file` (required, at most 512 KiB),
        `display_name` (required, 1-32 characters, no bidi/zero-width/control
        characters), `name` (optional shortcode `^[a-z0-9_]{2,32}$`, derived
        from display_name when omitted) and `copyable` ("true"/"false",
        default false). No other field is read. The image is decoded and
        re-encoded: static output is always a PNG fitted into 128 px (aspect
        kept, never cropped or upscaled, at most 4 MP source); a multi-frame
        GIF additionally yields a 128 px animated GIF (at most 100 frames,
        512 KiB output). Animated WebP is rejected; APNG keeps only its first
        frame. At most 100 static and 50 animated emojis per server. Shares
        the per-user upload rate limit (429 with Retry-After); 503 with
        Retry-After when image processing is busy. Error codes:
        EXPRESSION_NAME_INVALID, EXPRESSION_DISPLAY_NAME_INVALID (400),
        EXPRESSION_NAME_TAKEN (409), EXPRESSION_LIMIT_REACHED (400).
      tags: [Expressions]
      x-required-permission: { name: PermManageExpressions, value: 1048576 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody: { $ref: '#/components/requestBodies/StubMultipart' }
      responses:
        '201': { $ref: '#/components/responses/ServerEmojiCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/servers/{serverId}/emojis/{emojiId}:
    patch:
      operationId: serverEmojiUpdate
      summary: Rename an emoji or change whether it is copyable.
      description: >-
        Every field is optional but at least one is required. Changing
        `copyable` is reserved to the emoji's creator (403
        EXPRESSION_LICENSE_CREATOR_ONLY for anyone else, administrators
        included); when the creator's account is gone it may only be switched
        off. A clone's `copyable` can never change (403
        EXPRESSION_LICENSE_LOCKED). An emoji id of another server is 404. A
        taken name is 409 EXPRESSION_NAME_TAKEN.
      tags: [Expressions]
      x-required-permission: { name: PermManageExpressions, value: 1048576 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/EmojiId'
      requestBody: { $ref: '#/components/requestBodies/UpdateServerEmojiRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/ServerEmojiOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      operationId: serverEmojiDelete
      summary: Delete an emoji (row first, then its files).
      description: >-
        Existing reactions that use the emoji are kept. An emoji id of
        another server is 404.
      tags: [Expressions]
      x-required-permission: { name: PermManageExpressions, value: 1048576 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/EmojiId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/users/me/emojis:
    get:
      operationId: myEmojisList
      summary: The custom emojis of every server the caller is a member of.
      description: >-
        Ordered by server_id then name; `[]` when there are none.
      tags: [Expressions]
      responses:
        '200': { $ref: '#/components/responses/ServerEmojiListOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  # ── Server stickers (expressions) ──
  /api/servers/{serverId}/stickers:
    get:
      operationId: serverStickersList
      summary: List a server's stickers (members only), ordered by name.
      description: >-
        Returns `[]` (never null) when the server has none. Sticker images
        are public assets served from `url` / `animated_url` while the
        sticker row exists.
      tags: [Expressions]
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200': { $ref: '#/components/responses/ServerStickerListOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      operationId: serverStickerCreate
      summary: Upload a sticker.
      description: >-
        multipart/form-data with `file` (required, at most 512 KiB),
        `display_name` (required, 1-32 characters, no bidi/zero-width/control
        characters), `name` (optional shortcode `^[a-z0-9_]{2,32}$`, derived
        from display_name when omitted), `description` (optional, at most 100
        characters, one line), `tags` (optional, comma-separated; at most 5
        after case-insensitive de-duplication, each 1-20 characters) and
        `copyable` ("true"/"false", default false). No other field is read.
        Static output is always a PNG fitted into 320 px (aspect kept, never
        cropped or upscaled, at most 4 MP source); a multi-frame GIF
        additionally yields a 320 px animated GIF (at most 100 frames, 1 MiB
        output). Animated WebP is rejected; APNG keeps only its first frame.
        At most 30 stickers (static and animated together) per server. Shares
        the per-user upload rate limit (429 with Retry-After); 503 with
        Retry-After when image processing is busy. Error codes:
        EXPRESSION_NAME_INVALID, EXPRESSION_DISPLAY_NAME_INVALID,
        EXPRESSION_DESCRIPTION_INVALID, EXPRESSION_TAGS_INVALID (400),
        EXPRESSION_NAME_TAKEN (409), EXPRESSION_LIMIT_REACHED (400).
        A message sends a sticker as its whole content
        `<sticker:name:id>` / `<sticker:a:name:id>` (client-side token, not
        validated by the server); a sticker can never be a reaction.
      tags: [Expressions]
      x-required-permission: { name: PermManageExpressions, value: 1048576 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody: { $ref: '#/components/requestBodies/StubMultipart' }
      responses:
        '201': { $ref: '#/components/responses/ServerStickerCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/servers/{serverId}/stickers/{stickerId}:
    patch:
      operationId: serverStickerUpdate
      summary: Edit a sticker's name, display name, description, tags or copyable flag.
      description: >-
        Every field is optional but at least one is required. Changing
        `copyable` is reserved to the sticker's creator (403
        EXPRESSION_LICENSE_CREATOR_ONLY for anyone else, administrators
        included); when the creator's account is gone it may only be switched
        off; a clone's `copyable` can never change (403
        EXPRESSION_LICENSE_LOCKED). A sticker id of another server is 404. A
        taken name is 409 EXPRESSION_NAME_TAKEN.
      tags: [Expressions]
      x-required-permission: { name: PermManageExpressions, value: 1048576 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/StickerId'
      requestBody: { $ref: '#/components/requestBodies/UpdateServerStickerRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/ServerStickerOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      operationId: serverStickerDelete
      summary: Delete a sticker (row first, then its files).
      description: >-
        A sticker id of another server is 404.
      tags: [Expressions]
      x-required-permission: { name: PermManageExpressions, value: 1048576 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/StickerId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/users/me/stickers:
    get:
      operationId: myStickersList
      summary: The stickers of every server the caller is a member of.
      description: >-
        Ordered by server_id then name; `[]` when there are none.
      tags: [Expressions]
      responses:
        '200': { $ref: '#/components/responses/ServerStickerListOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  # ── Copying expressions between servers ──
  /api/servers/{serverId}/emojis/clone:
    post:
      operationId: serverEmojiClone
      summary: Copy a copyable emoji of another server into this server.
      description: >-
        {serverId} is the TARGET server (PermManageExpressions required
        there). The caller must be a member of the source emoji's server: a
        source the caller cannot see and a missing one are the same 404
        EXPRESSION_NOT_FOUND (also when the source file is gone). A source
        in the target server is 400 EXPRESSION_CLONE_SAME_SERVER; a source
        that is not copyable (clones never are) is 403
        EXPRESSION_NOT_COPYABLE. The stored files are copied byte for byte;
        the new emoji has `cloned_from` = source id, `copyable` false
        (locked), `created_by` = caller, and goes through the normal upload
        caps and name rules (EXPRESSION_LIMIT_REACHED 400,
        EXPRESSION_NAME_TAKEN 409 — retry with `name`). Shares the per-user
        upload rate limit (429 with Retry-After). A malformed `source_id` is
        400.
      tags: [Expressions]
      x-required-permission: { name: PermManageExpressions, value: 1048576 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody: { $ref: '#/components/requestBodies/CloneExpressionRequestBody' }
      responses:
        '201': { $ref: '#/components/responses/ServerEmojiCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/servers/{serverId}/stickers/clone:
    post:
      operationId: serverStickerClone
      summary: Copy a copyable sticker of another server into this server.
      description: >-
        Same rules as POST /api/servers/{serverId}/emojis/clone, for
        stickers (description and tags are copied too).
      tags: [Expressions]
      x-required-permission: { name: PermManageExpressions, value: 1048576 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody: { $ref: '#/components/requestBodies/CloneExpressionRequestBody' }
      responses:
        '201': { $ref: '#/components/responses/ServerStickerCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

  # ── Entrance sounds ──
  /api/users/me/entrance-sounds:
    get:
      operationId: myEntranceSoundsList
      summary: The caller's entrance clips and per-scope selections.
      description: >-
        `sounds` and `selections` are `[]` (never null) when empty. A
        selection's `scope` is "global" or a server id.
      tags: [EntranceSounds]
      responses:
        '200': { $ref: '#/components/responses/EntranceMineOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
    post:
      operationId: myEntranceSoundUpload
      summary: Upload an entrance clip (16-bit PCM WAV, server-measured).
      description: >-
        multipart/form-data with `file` (required, at most 1 MiB, claimed as
        audio/wav) and `name` (1-32 characters, no bidi/zero-width/control
        characters). No other field is read — duration, size and URL are
        always derived by the server. The file must be a RIFF/WAVE with
        integer PCM, 1-2 channels, 8000-48000 Hz, 16 bit, 100-5000 ms long;
        the stored file is a canonical 44-byte-header WAV with the samples
        only (metadata chunks dropped). At most 5 clips per account. Shares
        the per-user upload rate limit (429 with Retry-After). Error codes
        (400): ENTRANCE_NAME_INVALID, ENTRANCE_FILE_TOO_LARGE,
        ENTRANCE_INVALID_AUDIO, ENTRANCE_DURATION_INVALID,
        ENTRANCE_LIMIT_REACHED. The clip is served publicly from `url` while
        its row exists.
      tags: [EntranceSounds]
      requestBody: { $ref: '#/components/requestBodies/StubMultipart' }
      responses:
        '201': { $ref: '#/components/responses/EntranceSoundCreated' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/users/me/entrance-sounds/{soundId}:
    patch:
      operationId: myEntranceSoundRename
      summary: Rename one of the caller's clips.
      description: >-
        Body `{"name": "..."}` (ENTRANCE_NAME_INVALID on a bad name). Another
        user's clip id is 404.
      tags: [EntranceSounds]
      parameters:
        - $ref: '#/components/parameters/EntranceSoundId'
      requestBody: { $ref: '#/components/requestBodies/RenameEntranceSoundRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/EntranceSoundOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: myEntranceSoundDelete
      summary: Delete one of the caller's clips (row and selections first, then the file).
      description: >-
        Selections pointing at the clip are removed with it. Another user's
        clip id is 404.
      tags: [EntranceSounds]
      parameters:
        - $ref: '#/components/parameters/EntranceSoundId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/users/me/entrance-selection:
    put:
      operationId: myEntranceSelectionPut
      summary: Set or clear the caller's entrance sound for one scope.
      description: >-
        `scope` is "global" or a server id the caller is a member of (404
        otherwise). `kind` "clip" needs `sound_id` (one of the caller's clips,
        404 otherwise), "preset" needs `preset` (strict EntrancePreset,
        ENTRANCE_PRESET_INVALID otherwise; stored canonically), "none" removes
        the scope's selection. A server-scoped selection wins over the global
        one. Returns every selection of the caller. Other 400 code:
        ENTRANCE_SCOPE_INVALID.
      tags: [EntranceSounds]
      requestBody: { $ref: '#/components/requestBodies/PutEntranceSelectionRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/EntranceSelectionListOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/servers/{serverId}/entrance-settings:
    get:
      operationId: serverEntranceSettingsGet
      summary: A server's entrance-sound settings and disabled voice channels.
      description: >-
        Defaults when never set: enabled true, max_duration_ms 5000.
      tags: [EntranceSounds]
      x-required-permission: { name: PermManageSoundboard, value: 131072 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200': { $ref: '#/components/responses/ServerEntranceSettingsOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      operationId: serverEntranceSettingsPatch
      summary: Switch entrance sounds on/off for the server or change the max play length.
      description: >-
        At least one of `enabled` / `max_duration_ms` (500-5000) is required
        (ENTRANCE_SETTINGS_INVALID otherwise). Clips longer than the max are
        cut off at it (`play_ms`).
      tags: [EntranceSounds]
      x-required-permission: { name: PermManageSoundboard, value: 131072 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody: { $ref: '#/components/requestBodies/PatchServerEntranceSettingsRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/ServerEntranceSettingsOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/servers/{serverId}/channels/{channelId}/entrance:
    put:
      operationId: serverChannelEntranceSet
      summary: Switch entrance sounds on/off for one voice channel.
      description: >-
        Body `{"enabled": bool}` (required). A channel of another server is
        404; a non-voice channel is 400 ENTRANCE_CHANNEL_NOT_VOICE.
      tags: [EntranceSounds]
      x-required-permission: { name: PermManageSoundboard, value: 131072 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody: { $ref: '#/components/requestBodies/SetChannelEntranceRequestBody' }
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/servers/{serverId}/entrance-mutes:
    get:
      operationId: serverEntranceMutesList
      summary: Members whose entrance sound is muted on this server.
      description: >-
        `{"user_ids": [...]}`, `[]` when none.
      tags: [EntranceSounds]
      x-required-permission: { name: PermMuteMembers, value: 16384 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200': { $ref: '#/components/responses/EntranceMutesOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/servers/{serverId}/entrance-mutes/{userId}:
    put:
      operationId: serverEntranceMuteAdd
      summary: Mute a member's entrance sound on this server.
      description: >-
        Idempotent. The server owner can never be targeted and the caller's
        highest role must outrank the target's (403 ENTRANCE_HIERARCHY);
        targeting yourself is 400; a non-member is 404.
      tags: [EntranceSounds]
      x-required-permission: { name: PermMuteMembers, value: 16384 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: serverEntranceMuteRemove
      summary: Unmute a member's entrance sound on this server.
      description: >-
        Idempotent; same hierarchy rule as muting (403 ENTRANCE_HIERARCHY,
        400 for yourself).
      tags: [EntranceSounds]
      x-required-permission: { name: PermMuteMembers, value: 16384 }
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  # ── Cosmetics ──
  /api/users/me/cosmetics:
    get:
      operationId: myCosmeticsGet
      summary: The caller's wearable catalog, grants, equipped slots and plain servers.
      description: >-
        `items` are the built-in catalog (by type and sort order) plus the
        items of servers the caller is in that they can wear (free, or
        granted to them). `equipped.global` and `equipped.servers[<id>]` are
        the raw slots per scope (only filled slots are present).
        `plain_server_ids` lists the servers where the caller looks plain.
        Lists are `[]` and maps `{}` when empty (never null).
      tags: [Cosmetics]
      responses:
        '200': { $ref: '#/components/responses/MyCosmeticsOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/users/me/cosmetics/equipped:
    put:
      operationId: myCosmeticsEquip
      summary: Equip or clear 1-5 of the caller's slots in one scope.
      description: >-
        Body `{"scope": "global" | serverId, "slots": {type: itemId | null}}`
        with 1-5 known slot keys; null clears the slot, a key left out is
        unchanged. All slots change in one transaction; the item's canonical
        asset is snapshotted. A request that changes nothing broadcasts
        nothing; otherwise one user_cosmetics_update per affected context.
        Body at most 4 KiB, unknown fields rejected. Error codes: 400
        COSMETIC_SLOTS_INVALID (no/unknown slot key, bad scope or id), 400
        COSMETIC_SLOT_MISMATCH (item type differs from the key), 400
        COSMETIC_SCOPE_MISMATCH (a server item outside its own server), 403
        COSMETIC_NOT_OWNED (a granted item without a grant), 404 for a
        missing item and for a scope server the caller is not in (the same
        response). Shares the per-user CosmeticEquip rate limit (10/min, 429
        with Retry-After). Returns the same body as GET.
      tags: [Cosmetics]
      requestBody: { $ref: '#/components/requestBodies/EquipCosmeticsRequestBody' }
      responses:
        '200': { $ref: '#/components/responses/MyCosmeticsOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/users/me/cosmetics/plain-servers/{serverId}:
    put:
      operationId: myCosmeticsPlainServerSet
      summary: Look plain (no cosmetics) in one server, or stop doing so.
      description: >-
        Body `{"plain": bool}` (required). Not a member of the server is 404.
        A change broadcasts user_cosmetics_update to that server only (with
        `plain: true` the slots are `{}`). Shares the CosmeticEquip rate
        limit (429 with Retry-After).
      tags: [Cosmetics]
      parameters:
        - $ref: '#/components/parameters/ServerId'
      requestBody: { $ref: '#/components/requestBodies/SetCosmeticPlainServerRequestBody' }
      responses:
        '204': { $ref: '#/components/responses/StubNoContent' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/users/cosmetics:
    get:
      operationId: usersCosmeticsLookup
      summary: Global cosmetics of up to 100 users (DM / friends context).
      description: >-
        `?ids=a,b,c` — 1-100 ids after collapsing duplicates, each matching
        ^[A-Za-z0-9_-]{1,64}$ (400 COSMETIC_IDS_INVALID otherwise). Only
        global slots are returned; users without any slot are left out.
      tags: [Cosmetics]
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated user ids.
      responses:
        '200': { $ref: '#/components/responses/CosmeticsLookupOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/servers/{serverId}/cosmetics:
    get:
      operationId: serverCosmeticsGet
      summary: Resolved cosmetics of a server's members.
      description: >-
        Membership is the gate. Each member's slots resolved for this server
        (server override over global, per type); members who look plain here
        and members without any slot are left out.
      tags: [Cosmetics]
      parameters:
        - $ref: '#/components/parameters/ServerId'
      responses:
        '200': { $ref: '#/components/responses/ServerCosmeticsOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── WebSocket ──
  /ws:
    get:
      operationId: wsConnect
      summary: Upgrade to the human realtime gateway WebSocket connection.
      description: >-
        This is a WebSocket handshake (HTTP Upgrade), not a plain HTTP request —
        modeled here only so the route is enumerated. Preferred auth: obtain a
        one-shot, ~30s-TTL ticket from POST /api/auth/ws-ticket, then connect
        with `?ticket=<value>`. A legacy `?token=<access_token>` query-string
        path exists but is disabled server-side pending removal. No
        Authorization header is used on this route — the ticket/token is a
        query parameter because browsers cannot set custom headers on a
        WebSocket handshake.
      tags: [WebSocket]
      security: []
      parameters:
        - name: ticket
          in: query
          required: false
          schema: { type: string }
          description: One-shot ticket minted by POST /api/auth/ws-ticket.
      responses:
        '101':
          description: Switching Protocols — WebSocket handshake accepted.
        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /api/bot/gateway:
    get:
      operationId: wsBotGateway
      summary: Upgrade to the read-only bot gateway WebSocket connection.
      description: >-
        WebSocket handshake authenticated via `Authorization: Bearer hb_...`
        (bot token only — a human JWT is rejected even though it is also a
        Bearer token). Streams a read-only subset of events
        (BotReadableOps) scoped to the servers the bot belongs to.
      tags: [WebSocket]
      security:
        - botAuth: []
      responses:
        '101':
          description: Switching Protocols — WebSocket handshake accepted.
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404':
          description: Bot gateway disabled (no bot token validator configured).

  # ── System ──
  /api/health:
    get:
      operationId: systemHealth
      summary: Liveness probe. Always returns 200; body reports the cached deep-dependency verdict.
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
  /api/ready:
    get:
      operationId: systemReady
      summary: Readiness probe. Performs a request-time DB check; may return 503.
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '503':
          description: Not ready — a dependency (typically the database) failed its live check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /static/landing/{file}:
    get:
      operationId: systemStaticLanding
      summary: Serve a public landing-page asset (video, screenshots).
      tags: [System]
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string }
          description: Single path segment — nested paths are rejected (404).
      responses:
        '200':
          description: Asset bytes.
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/version:
    get:
      operationId: systemVersion
      summary: Get the current process's startup ID, used by clients to detect a new deploy.
      tags: [System]
      security: []
      responses:
        '200':
          description: '`{"version": "<uuid, regenerated per process start>"}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Human session access token, minted by POST /api/auth/login or
        POST /api/auth/refresh. Sent as `Authorization: Bearer <jwt>`.
    botAuth:
      type: http
      scheme: bearer
      description: >-
        Bot automation credential minted by POST /api/bots. Uses the identical
        `Authorization: Bearer <token>` header as bearerAuth; AuthMiddleware.Require
        distinguishes the two by the models.BotTokenPrefix `hb_` prefix on the
        token value itself, before falling back to JWT validation. Accepted on
        every route documented with the default bearerAuth + botAuth security
        requirement (both are alternatives — either satisfies it).
    mediaCookie:
      type: apiKey
      in: cookie
      name: hichat_media
      description: >-
        Scope-limited media JWT set as an HttpOnly cookie on login/refresh.
        Authenticates ONLY GET /api/uploads/* (channel/DM attachment bytes),
        for contexts that cannot set a header — a bare `<img>`/`<video>` src.
        AuthMiddleware rejects any non-empty token scope on every other route,
        so a leaked media token cannot be replayed against the rest of the API.
    livekitWebhook:
      type: apiKey
      in: header
      name: Authorize
      description: >-
        Not a per-caller secret in the usual apiKey sense: LiveKit signs each
        webhook delivery with an HMAC-derived, JWT-shaped token in the
        `Authorize` header. The server verifies it against every configured
        LiveKit instance's decrypted API key/secret pair (a multi-key
        webhook.ReceiveWebhookEvent provider), so any known instance's
        credentials validate the signature — there is no client-supplied
        credential to document beyond "this header must verify."
  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      schema: { type: string }
      description: Server (guild) ID.
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string }
      description: Channel ID.
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
      description: Message ID.
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }
      description: Role ID (channel-permission override target).
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
      description: Target user ID.
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
      description: E2EE device ID.
    SoundId:
      name: soundId
      in: path
      required: true
      schema: { type: string }
      description: Soundboard sound ID.
    EmojiId:
      name: emojiId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{16}$' }
      description: Custom emoji ID (16 lowercase hex).
    StickerId:
      name: stickerId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{16}$' }
      description: Sticker ID (16 lowercase hex).
    EntranceSoundId:
      name: soundId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{16}$' }
      description: Entrance clip ID (16 lowercase hex).
    BotId:
      name: botID
      in: path
      required: true
      schema: { type: string }
      description: Bot account ID.
    InviteCode:
      name: code
      in: path
      required: true
      schema: { type: string }
      description: Invite code.
    LiveKitInstanceId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: LiveKit instance ID.
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer }
      description: Page size limit.
    OffsetParam:
      name: offset
      in: query
      required: false
      schema: { type: integer }
      description: Pagination offset.
    BeforeParam:
      name: before
      in: query
      required: false
      schema: { type: string }
      description: Cursor — return items before this ID (or, for the audit log, timestamp).
    AroundParam:
      name: around
      in: query
      required: false
      schema: { type: string }
      description: Message history only — a window centred on this message ID. Mutually exclusive with before/after.
    AfterParam:
      name: after
      in: query
      required: false
      schema: { type: string }
      description: Message history only — items strictly newer than this message ID. Mutually exclusive with before/around.
    QParam:
      name: q
      in: query
      required: false
      schema: { type: string }
      description: Search query text.
    PerPageParam:
      name: per_page
      in: query
      required: false
      schema: { type: integer }
      description: Results per page.
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer }
      description: Page number (1-based).
    PeriodParam:
      name: period
      in: query
      required: false
      schema: { type: string, enum: ['24h', '7d', '30d'], default: '24h' }
      description: Metrics aggregation window.
  schemas:
    ErrorCode:
      type: string
      description: >-
        Machine-readable error identifier derived from the domain sentinel
        error (server/pkg/errors.go) via pkg.errorCode. Empty/omitted on
        success responses and on some legacy message-only error paths
        (pkg.ErrorWithMessage).
      enum:
        - NOT_FOUND
        - UNAUTHORIZED
        - FORBIDDEN
        - ALREADY_EXISTS
        - BAD_REQUEST
        - CONFLICT
        - INVALID_KEY
        - INTERNAL
    ApiEnvelope:
      type: object
      description: Standard response envelope wrapping every API response (pkg.APIResponse).
      properties:
        success:
          type: boolean
          description: true on 2xx responses, false on error responses.
        data:
          description: >-
            Present on success responses; omitted on error responses. Payload
            shape is operation-specific — see the allOf composition on each
            2xx response.
        error:
          type: string
          description: Human-readable message. Present only on error responses (safe to display for 4xx; generic text for 5xx).
        code:
          $ref: '#/components/schemas/ErrorCode'
      required: [success]
    ErrorResponse:
      description: Envelope shape on error responses — success is always false; data is omitted.
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            success:
              type: boolean
              enum: [false]
          required: [success, error]
    StubData:
      description: 'TODO: detailed schema — to be specified in the next authoring phase.'
      type: object
      additionalProperties: true

    # ── Shared primitives (Auth / Users / Messages / Reactions / Pins / Channels / Categories) ──
    MessageOnlyResponse:
      description: >-
        Generic `{"message": "..."}` payload shared by several endpoints that
        have no richer data to return (pkg.JSON with a map[string]string).
        The exact text is operation-specific — see each operation's
        description for the literal string it sends.
      type: object
      properties:
        message: { type: string }
      required: [message]
      example: { message: "logged out" }
    User:
      description: >-
        models.User as exposed to the caller. Fields tagged `json:"-"` in Go
        (PasswordHash, TokenVersion, PlatformBanReason, PlatformBannedBy,
        PlatformBannedAt) are never serialized and are omitted here.
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        wallpaper_url: { type: [string, "null"] }
        avatar_animated_url:
          type: [string, "null"]
          description: Animated GIF avatar (migration 085); avatar_url stays the static poster.
        banner_url: { type: [string, "null"] }
        bio: { type: [string, "null"], maxLength: 190 }
        pronouns: { type: [string, "null"], maxLength: 40 }
        accent_color: { type: [string, "null"], pattern: '^#[0-9a-f]{6}$' }
        status:
          $ref: '#/components/schemas/UserStatus'
        pref_status:
          allOf: [{ $ref: '#/components/schemas/UserStatus' }]
          description: >-
            The user's saved/preferred status (what they picked in the
            client), as opposed to `status` which is the live computed
            presence. `pref_status=offline` is HiChat's "invisible mode".
        custom_status: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        language: { type: string, example: en }
        dm_privacy:
          type: string
          enum: [everyone, message_request, friends_only]
        is_platform_admin: { type: boolean }
        is_platform_banned: { type: boolean }
        has_seen_download_prompt: { type: boolean }
        has_seen_welcome: { type: boolean }
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: >-
            Offline-transition timestamp, as stored on the row. Unlike
            MemberWithRoles (which suppresses this field when
            pref_status="offline" — see models.ToMemberWithRoles), this
            User schema does NOT apply the invisible-mode suppression; it
            is only ever returned to the user themselves (GET /api/users/me
            and the login/register response), never embedded in another
            user's payload. Message/DM/pin author fields use PublicUser
            instead, which omits this field entirely.
        is_bot: { type: boolean }
        owner_user_id:
          type: string
          description: Set only on bot accounts (migration 072) — the human owner's user ID. Omitted for human users.
        created_at: { type: string, format: date-time }
      required: [id, username, status, pref_status, language, dm_privacy, is_platform_admin, is_platform_banned, has_seen_download_prompt, has_seen_welcome, is_bot, created_at]
      example:
        id: "a1b2c3d4e5f6a7b8"
        username: hb_wanderer
        display_name: Wanderer
        avatar_url: null
        wallpaper_url: null
        status: online
        pref_status: online
        custom_status: null
        email: user@example.com
        language: en
        dm_privacy: everyone
        is_platform_admin: false
        is_platform_banned: false
        has_seen_download_prompt: true
        has_seen_welcome: true
        last_seen_at: null
        is_bot: false
        created_at: "2026-01-15T10:20:30Z"
    PublicUser:
      description: >-
        models.PublicUser — the narrow public view of another user embedded
        in message, DM and pin payloads. Deliberately excludes email,
        is_platform_admin, is_platform_banned, dm_privacy, wallpaper_url,
        language, pref_status, has_seen_download_prompt, has_seen_welcome,
        last_seen_at and is_bot, all of which the full User schema carries
        (security scan 2026-07-31, finding N-09: those fields were being
        broadcast to every reader of a channel via the embedded author).
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        status:
          $ref: '#/components/schemas/UserStatus'
        custom_status: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
      required: [id, username, status, created_at]
      example:
        id: "a1b2c3d4e5f6a7b8"
        username: hb_wanderer
        display_name: Wanderer
        avatar_url: null
        status: online
        custom_status: null
        created_at: "2026-01-15T10:20:30Z"
    UserStatus:
      type: string
      enum: [online, idle, dnd, offline]

    # ── Auth ──
    RegisterRequest:
      description: models.CreateUserRequest — body of POST /api/auth/register.
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
          description: Trimmed server-side; letters, digits, and underscore only.
        password:
          type: string
          minLength: 8
          format: password
        display_name:
          type: string
          maxLength: 32
          description: Trimmed server-side. Optional — omitted/empty stores null.
        email:
          type: string
          format: email
          description: Optional. Validated against a simple `local@domain.tld` regex when non-empty.
        invite_code:
          type: string
          description: >-
            Accepted by the request shape but currently a DEAD FIELD:
            AuthService.Register never reads CreateUserRequest.InviteCode —
            there is no invite-gated registration flow in the code today.
            Do not rely on this for access control.
      required: [username, password]
      example:
        username: hb_wanderer
        password: "correct-horse-battery-staple"
        display_name: Wanderer
        email: user@example.com
        invite_code: ""
    LoginRequest:
      description: models.LoginRequest — body of POST /api/auth/login.
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password }
      required: [username, password]
      example:
        username: hb_wanderer
        password: "correct-horse-battery-staple"
    RefreshTokenBody:
      description: >-
        Optional JSON body for POST /api/auth/refresh and POST
        /api/auth/logout. Both endpoints prefer the HttpOnly `hichat_refresh`
        cookie (set on register/login/refresh) via extractRefreshToken; this
        field is the fallback for native clients that don't manage cookies.
        An empty body is valid when the cookie is present.
      type: object
      properties:
        refresh_token: { type: string }
      example:
        refresh_token: ""
    AuthTokens:
      description: >-
        services.AuthTokens — returned by register/login/refresh. The refresh
        token itself is deliberately `json:"-"` and never appears in this
        body; it is delivered exclusively via the HttpOnly+Secure
        `hichat_refresh` cookie set on the same response (see
        handlers/auth.go setRefreshCookie). A `hichat_media` cookie (scope
        media JWT) is also set as a side effect for inline attachment
        rendering.
      type: object
      properties:
        access_token: { type: string }
        user:
          $ref: '#/components/schemas/User'
      required: [access_token, user]
      example:
        access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          id: "a1b2c3d4e5f6a7b8"
          username: hb_wanderer
          display_name: Wanderer
          avatar_url: null
          wallpaper_url: null
          status: online
          pref_status: online
          custom_status: null
          email: user@example.com
          language: en
          dm_privacy: everyone
          is_platform_admin: false
          is_platform_banned: false
          has_seen_download_prompt: false
          has_seen_welcome: false
          last_seen_at: null
          is_bot: false
          created_at: "2026-01-15T10:20:30Z"
    ForgotPasswordRequest:
      description: models.ForgotPasswordRequest — body of POST /api/auth/forgot-password.
      type: object
      properties:
        email: { type: string, format: email }
      required: [email]
      example:
        email: user@example.com
    ResetPasswordRequest:
      description: models.ResetPasswordRequest — body of POST /api/auth/reset-password.
      type: object
      properties:
        token:
          type: string
          description: Plaintext one-time token from the emailed reset link (only its SHA-256 hash is stored server-side).
        new_password:
          type: string
          minLength: 8
          format: password
      required: [token, new_password]
      example:
        token: "9f8e7d6c5b4a3210"
        new_password: "new-correct-horse-battery"
    WsTicketResponse:
      description: >-
        One-shot, ~30-second-TTL ticket minted by POST /api/auth/ws-ticket
        for the `GET /ws?ticket=<value>` handshake.
      type: object
      properties:
        ticket: { type: string }
      required: [ticket]
      example:
        ticket: "wst_5f3e2c1a9b8d7e6f"

    # ── Users (me) ──
    ChangePasswordRequest:
      description: >-
        Anonymous struct in handlers/auth.go ChangePassword — not a named
        Go type. Requires current_password (defense-in-depth against a
        stolen/XSS'd JWT) in addition to session auth.
      type: object
      properties:
        current_password: { type: string, format: password }
        new_password:
          type: string
          minLength: 6
          format: password
          description: >-
            AuthService.ChangePassword enforces a 6-character minimum here —
            note this is LOWER than registration's 8-character minimum
            (models.CreateUserRequest.Validate); documented as coded, not a
            recommendation.
      required: [current_password, new_password]
      example:
        current_password: "correct-horse-battery-staple"
        new_password: "newer-horse-battery-staple"
    ChangeEmailRequest:
      description: models.ChangeEmailRequest — body of PUT /api/users/me/email.
      type: object
      properties:
        password:
          type: string
          format: password
          description: Current password, re-verified via bcrypt before the change is applied.
        new_email:
          type: string
          format: email
          description: Empty string (or field omitted) REMOVES the caller's email (sets it to NULL) rather than being rejected.
      required: [password]
      example:
        password: "correct-horse-battery-staple"
        new_email: newmail@example.com
    ChangeEmailResponse:
      type: object
      properties:
        message: { type: string, example: "email updated" }
        email:
          type: [string, "null"]
          description: The new email value, or null when new_email was empty (email removed).
      required: [message, email]
    UpdateProfileRequest:
      description: >-
        models.UpdateProfileRequest — body of PATCH /api/users/me/profile.
        Every field is a pointer: omitted/null means "leave unchanged".
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
          description: Checked for availability against every other user; 409 if taken.
        display_name:
          type: string
          maxLength: 32
          description: Explicit empty string clears it (stores null).
        avatar_url:
          type: string
          description: >-
            Freeform string, not validated against the upload service — the
            dedicated POST /api/users/me/avatar endpoint is the normal way
            to set this from an uploaded file.
        custom_status:
          type: string
          maxLength: 128
          description: Explicit empty string clears it (stores null).
        language:
          type: string
          enum: [en, tr]
        dm_privacy:
          type: string
          enum: [everyone, message_request, friends_only]
        bio:
          type: string
          maxLength: 190
          description: >-
            Multi-line. "\r" is stripped and surrounding whitespace trimmed
            before the 190-rune check; bidi/control characters other than
            newline and tab are rejected. Explicit empty string clears it.
        pronouns:
          type: string
          maxLength: 40
          description: Single line, trimmed. Explicit empty string clears it.
        accent_color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Stored lower-case. Explicit empty string clears it.
      example:
        display_name: Wanderer
        custom_status: "on a quest"
        language: en
        dm_privacy: everyone
    MemberWithRoles:
      description: >-
        models.MemberWithRoles — the response payload of
        PATCH /api/users/me/profile. This is a GLOBAL (non-server-scoped)
        update, so ToMemberWithRoles is called with a nil roles slice here:
        `roles` is always `[]` and `effective_permissions` is always `0` for
        THIS operation. The server-scoped fields (nickname, non-empty roles,
        a real effective_permissions mask, timeout_expires_at) only carry
        meaningful values from the per-server Members endpoints (out of
        scope in this authoring pass).
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        nickname: { type: [string, "null"] }
        status:
          $ref: '#/components/schemas/UserStatus'
        custom_status: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        roles:
          type: array
          items: {}
          description: Always empty for this endpoint (see the schema description above).
        effective_permissions:
          type: integer
          description: Bitwise-OR of role permissions (see the top-level x-permissions bit catalog). Always 0 for this endpoint.
        timeout_expires_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
        avatar_animated_url: { type: [string, "null"] }
        banner_url: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        pronouns: { type: [string, "null"] }
        accent_color: { type: [string, "null"] }
      required: [id, username, status, created_at, roles, effective_permissions]
      example:
        id: "a1b2c3d4e5f6a7b8"
        username: hb_wanderer
        display_name: Wanderer
        avatar_url: null
        nickname: null
        status: online
        custom_status: "on a quest"
        created_at: "2026-01-15T10:20:30Z"
        roles: []
        effective_permissions: 0
    UserProfile:
      description: >-
        models.UserProfile — the public profile card returned by
        GET /api/users/{userId}/profile. A deliberate allowlist: never
        carries email, status, pref_status, last_seen_at, dm_privacy,
        language, wallpaper_url, is_platform_*, has_seen_* or owner_user_id.
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: [string, "null"] }
        avatar_url: { type: [string, "null"] }
        avatar_animated_url: { type: [string, "null"] }
        banner_url: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        pronouns: { type: [string, "null"] }
        accent_color: { type: [string, "null"] }
        custom_status: { type: [string, "null"] }
        is_bot: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, username, display_name, avatar_url, avatar_animated_url, banner_url, bio, pronouns, accent_color, custom_status, is_bot, created_at]
    UserPreferences:
      description: models.UserPreferences — GET/PATCH /api/users/me/preferences payload.
      type: object
      properties:
        user_id: { type: string }
        data:
          type: object
          additionalProperties: true
          description: >-
            Opaque, free-form client-synced settings blob. The backend does
            no field-level validation and just top-level-key-merges PATCH
            bodies into this object.
        updated_at:
          type: string
          description: >-
            SQLite's default CURRENT_TIMESTAMP text form
            ("YYYY-MM-DD HH:MM:SS", not RFC3339) — treat as an opaque
            display string rather than a strict date-time.
      required: [user_id, data, updated_at]
      example:
        user_id: "a1b2c3d4e5f6a7b8"
        data: { theme: dark, notifications_muted: false }
        updated_at: "2026-01-15 10:20:30"
    UpdatePreferencesRequest:
      description: models.UpdatePreferencesRequest — body of PATCH /api/users/me/preferences.
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
          description: Partial JSON object; present keys are merged into existing data, other keys are left untouched.
      required: [data]
      example:
        data: { theme: dark }

    # ── Messages (server-channel scoped) ──
    Attachment:
      description: models.Attachment.
      type: object
      properties:
        id: { type: string }
        message_id: { type: string }
        filename: { type: string }
        file_url: { type: string }
        file_size: { type: [integer, "null"], format: int64 }
        mime_type: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
      required: [id, message_id, filename, file_url, created_at]
    ReactionGroup:
      description: models.ReactionGroup — reactions on a message, aggregated by emoji.
      type: object
      properties:
        emoji: { type: string }
        count: { type: integer }
        users:
          type: array
          items: { type: string }
          description: User IDs who used this emoji — lets the client render "you reacted" highlighting.
      required: [emoji, count, users]
    MessageReference:
      description: >-
        models.MessageReference — a preview of the replied-to message. If the
        original message was deleted, author and content are both null.
      type: object
      properties:
        id: { type: string }
        author:
          anyOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: "null"
          description: Omitted/null if the original message (or its author) was deleted.
        content: { type: [string, "null"] }
      required: [id, content]
    Message:
      description: >-
        models.Message. E2EE: when encryption_version > 0, content is null
        and the payload lives in ciphertext (an opaque blob); sender_device_id
        identifies the E2EE device that encrypted it, and e2ee_metadata is an
        opaque sidecar for ratchet/sender-key bookkeeping.
      type: object
      properties:
        id: { type: string }
        channel_id: { type: string }
        user_id: { type: string }
        server_id:
          type: string
          description: >-
            Transient field, not stored in the DB — populated on the create
            path just before the WS broadcast so recipients can route the
            event without a channel lookup. May be empty on responses that
            didn't go through that path (e.g. list/edit).
        content: { type: [string, "null"] }
        edited_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        reply_to_id: { type: [string, "null"] }
        author:
          allOf: [{ $ref: '#/components/schemas/PublicUser' }]
          description: Populated via JOIN on reads; omitted on some write-path responses.
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        mentions:
          type: array
          items: { type: string }
          description: User IDs mentioned in plaintext content. Always empty for E2EE messages (server cannot read ciphertext).
        role_mentions:
          type: array
          items: { type: string }
          description: Role IDs mentioned in plaintext content. Always empty for E2EE messages.
        reactions:
          type: array
          items: { $ref: '#/components/schemas/ReactionGroup' }
        referenced_message:
          $ref: '#/components/schemas/MessageReference'
        encryption_version:
          type: integer
          enum: [0, 1]
          description: 0 = plaintext, 1 = E2EE.
        ciphertext: { type: [string, "null"] }
        sender_device_id: { type: [string, "null"] }
        e2ee_metadata: { type: [string, "null"] }
      required: [id, channel_id, user_id, content, created_at, reply_to_id, mentions, role_mentions, reactions, encryption_version]
      example:
        id: "m1a2b3c4"
        channel_id: "c1a2b3c4"
        user_id: "a1b2c3d4e5f6a7b8"
        server_id: "s1a2b3c4"
        content: "hello there"
        edited_at: null
        created_at: "2026-01-15T10:20:30Z"
        reply_to_id: null
        mentions: []
        role_mentions: []
        reactions: []
        encryption_version: 0
    MessagePage:
      description: >-
        models.MessagePage — cursor-based pagination response for GET
        .../messages (channel and DM share the shape). `messages` is ASC;
        `has_more` = older rows exist beyond the page; `has_more_after` =
        newer rows exist — only meaningful for the around=/after= forms,
        always false for before=.
      type: object
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        has_more: { type: boolean }
        has_more_after: { type: boolean }
      required: [messages, has_more, has_more_after]
    CreateMessageRequest:
      description: >-
        models.CreateMessageRequest — JSON body of POST .../messages when no
        file attachment is sent (see CreateMessageMultipartRequest for the
        multipart/form-data shape). Content must be non-empty (1-999 runes,
        MaxMessageLength) UNLESS encryption_version=1, in which case
        ciphertext + sender_device_id are required instead and content is
        ignored.
      type: object
      properties:
        content:
          type: string
          maxLength: 999
        reply_to_id: { type: [string, "null"] }
        encryption_version:
          type: integer
          enum: [0, 1]
          default: 0
        ciphertext: { type: string, description: Required when encryption_version=1. }
        sender_device_id: { type: string, description: Required when encryption_version=1. }
        e2ee_metadata: { type: string }
      example:
        content: "hello there"
    CreateMessageMultipartRequest:
      description: >-
        multipart/form-data body of POST .../messages when attaching files
        (or sending an E2EE message, since form fields are also accepted
        there). Detected server-side by a literal "multipart/form-data"
        Content-Type prefix check (isMultipart), not full MIME parsing.
        E2EE fields must be supplied as a consistent set: encryption_version
        "1" requires both ciphertext and sender_device_id, and conversely
        ciphertext/sender_device_id without encryption_version="1" is
        rejected (400) rather than silently treated as plaintext.
      type: object
      properties:
        content: { type: string, description: Plaintext content form field. May be empty if files are attached. }
        reply_to_id: { type: string }
        encryption_version:
          type: string
          enum: ["0", "1"]
          description: Form values are strings, not JSON integers — only the literal "1" enables the E2EE branch.
        ciphertext: { type: string }
        sender_device_id: { type: string }
        e2ee_metadata: { type: string }
        files:
          type: array
          items: { type: string, format: binary }
          description: Zero or more file attachments (form field name "files", repeatable).
    MessageCreatePartialResponse:
      description: >-
        HTTP 207 Multi-Status — returned instead of 201 when the message was
        created but one or more attached files failed to upload (per-file
        failures no longer silently swallowed).
      type: object
      properties:
        message:
          $ref: '#/components/schemas/Message'
        upload_failures:
          type: array
          items:
            type: object
            properties:
              filename: { type: string }
              error: { type: string }
            required: [filename, error]
      required: [message, upload_failures]
    UpdateMessageRequest:
      description: >-
        models.UpdateMessageRequest — body of PATCH .../messages/{id}. The
        request's encryption_version MUST match the message's currently
        stored encryption_version (a 400 rejects any attempt to change
        format on edit) — this is not a format-migration endpoint.
      type: object
      properties:
        content:
          type: string
          maxLength: 999
        encryption_version:
          type: integer
          enum: [0, 1]
        ciphertext: { type: string, description: Required when encryption_version=1. }
        sender_device_id: { type: string }
        e2ee_metadata: { type: string }
      example:
        content: "hello there (edited)"
        encryption_version: 0

    # ── Reactions ──
    ToggleReactionRequest:
      description: >-
        Anonymous toggleRequest struct in handlers/reaction.go — emoji is
        sent in the body (not the URL path) to avoid emoji URL-encoding
        edge cases. Adds the reaction if the caller hasn't reacted with this
        emoji yet, removes it otherwise (toggle).
      type: object
      properties:
        emoji: { type: string, example: "👍" }
      required: [emoji]

    # ── Pins ──
    PinnedMessageWithDetails:
      description: >-
        models.PinnedMessageWithDetails — a pinned-message row joined with
        the full message and the user who pinned it.
      type: object
      properties:
        id: { type: string }
        message_id: { type: string }
        channel_id: { type: string }
        pinned_by: { type: string, description: User ID of whoever pinned the message. }
        created_at: { type: string, format: date-time }
        message:
          $ref: '#/components/schemas/Message'
        pinned_by_user:
          $ref: '#/components/schemas/PublicUser'
      required: [id, message_id, channel_id, pinned_by, created_at, message]

    # ── Channels ──
    Channel:
      description: models.Channel.
      type: object
      properties:
        id: { type: string }
        server_id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [text, voice, audit]
          description: >-
            "audit" is a server-wide moderation feed — exactly one per
            server, auto-created, not user-composable.
        category_id: { type: [string, "null"] }
        topic: { type: [string, "null"] }
        position: { type: integer }
        user_limit: { type: integer, description: "Voice channels only. 0 = unlimited." }
        bitrate: { type: integer, description: "Voice channels only, in bps." }
        created_at: { type: string, format: date-time }
      required: [id, server_id, name, type, category_id, topic, position, user_limit, bitrate, created_at]
      example:
        id: "c1a2b3c4"
        server_id: "s1a2b3c4"
        name: general
        type: text
        category_id: null
        topic: null
        position: 0
        user_limit: 0
        bitrate: 0
        created_at: "2026-01-15T10:20:30Z"
    CreateChannelRequest:
      description: models.CreateChannelRequest — body of POST /api/servers/{serverId}/channels.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        type:
          type: string
          enum: [text, voice, audit]
          description: >-
            "audit" is accepted here but capped at one per server — Create
            returns 400 if the server already has an audit channel (a plain
            ErrBadRequest, not a distinct sentinel/code).
        category_id:
          type: string
          description: >-
            Optional. Must reference a category in the SAME server: a
            nonexistent category_id returns 400; a category_id that exists
            but belongs to a DIFFERENT server returns 404 (both paths share
            the message "category not found" but differ in status code —
            documented as coded).
        topic: { type: string, maxLength: 1024 }
      required: [name, type]
      example:
        name: general
        type: text
        category_id: ""
        topic: ""
    UpdateChannelRequest:
      description: >-
        models.UpdateChannelRequest — body of PATCH
        /api/servers/{serverId}/channels/{id}. Every field is a pointer:
        omitted/null means "don't change".
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50, description: Audit channels reject a name change (403). }
        topic: { type: string, maxLength: 1024 }
        category_id:
          type: string
          description: Empty string removes from category; non-empty moves (same existence/ownership rules as create).
        bitrate:
          type: integer
          minimum: 8000
          maximum: 384000
          description: Voice channels only — silently ignored on text/audit channels.
        user_limit:
          type: integer
          minimum: 0
          maximum: 99
          description: Voice channels only (0 = unlimited) — silently ignored on text/audit channels.
      example:
        topic: "Welcome to #general"
    CategoryWithChannels:
      description: >-
        models.CategoryWithChannels — one grouped entry of GET/PATCH-reorder
        .../channels responses. An "Uncategorized" pseudo-group (channels
        with category_id=null) is synthesized with category.id="" and
        category.position=-1, sorted first when non-empty.
      type: object
      properties:
        category:
          $ref: '#/components/schemas/Category'
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
      required: [category, channels]
    PositionUpdate:
      description: models.PositionUpdate — one entry of a reorder request.
      type: object
      properties:
        id: { type: string }
        position: { type: integer, minimum: 0 }
        category_id:
          type: string
          description: >-
            Only meaningful for the channel-reorder endpoint (cross-category
            moves); unused by the category-reorder endpoint.
      required: [id, position]
    ReorderItemsRequest:
      description: >-
        Shared JSON shape for PATCH .../channels/reorder (models.ReorderChannelsRequest)
        AND PATCH .../categories/reorder (an equivalent anonymous
        `{items: []models.PositionUpdate}` struct in handlers/category.go) —
        both decode the identical `{"items": [...]}` body.
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PositionUpdate' }
          description: No duplicate ids; each position must be >= 0.
      required: [items]
      example:
        items:
          - { id: "c1a2b3c4", position: 0 }
          - { id: "c5d6e7f8", position: 1, category_id: "cat1" }

    # ── Categories ──
    Category:
      description: models.Category.
      type: object
      properties:
        id: { type: string }
        server_id: { type: string }
        name: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }
      required: [id, server_id, name, position, created_at]
      example:
        id: "cat1"
        server_id: "s1a2b3c4"
        name: "Text Channels"
        position: 0
        created_at: "2026-01-15T10:20:30Z"
    CreateCategoryRequest:
      description: models.CreateCategoryRequest — body of POST /api/servers/{serverId}/categories.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
      required: [name]
      example:
        name: "Text Channels"
    UpdateCategoryRequest:
      description: models.UpdateCategoryRequest — body of PATCH .../categories/{id}.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
      example:
        name: "Voice Channels"

    # ── DMs (read state + sidebar preview) ──
    DMLastMessage:
      description: >-
        models.DMLastMessage — the newest message of a DM channel as shown
        in the sidebar. `content` is null for E2EE (encryption_version=1)
        and file-only messages; ciphertext is never included.
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        content: { type: [string, "null"] }
        encryption_version: { type: integer, enum: [0, 1] }
        created_at: { type: string, format: date-time }
      required: [id, user_id, content, encryption_version, created_at]
    DMChannelWithUser:
      description: >-
        models.DMChannelWithUser — one GET /api/dms item. `unread_count` is
        the caller's dm_reads counter (0 when no row exists yet);
        `last_message` is null for a channel with no messages.
      type: object
      properties:
        id: { type: string }
        other_user: { $ref: '#/components/schemas/PublicUser' }
        e2ee_enabled: { type: boolean }
        status: { type: string, enum: [accepted, pending] }
        initiated_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_message_at: { type: [string, "null"], format: date-time }
        is_pinned: { type: boolean }
        is_muted: { type: boolean }
        unread_count: { type: integer, minimum: 0 }
        last_message:
          oneOf:
            - $ref: '#/components/schemas/DMLastMessage'
            - type: "null"
      required: [id, other_user, e2ee_enabled, status, created_at, is_pinned, is_muted, unread_count, last_message]
    MarkDMReadRequest:
      description: models.MarkDMReadRequest — optional body of POST /api/dms/{channelId}/read.
      type: object
      properties:
        message_id: { type: string, description: "Newest message the caller has seen; omitted/empty keeps the stored watermark." }

    # ── Notifications ──
    Notification:
      description: >-
        models.Notification — one inbox row. `created_at` / `read_at` are
        RFC3339 UTC strings (e.g. 2026-10-21T09:17:28Z; the DB stores
        'YYYY-MM-DD HH:MM:SS' text and the repository converts on read).
        `actor` is the LEFT JOINed public view of `actor_id` (null when the
        actor was deleted). Payload keys by kind —
        mention|reply: {preview: string|null (≤120 runes, plaintext only),
        channel_name}; friend_request: {friendship_id}; dm_request: {};
        system: {title, body} (reserved, no writer yet).
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        kind: { type: string, enum: [mention, reply, friend_request, dm_request, system] }
        actor_id: { type: [string, "null"] }
        actor:
          oneOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: "null"
        server_id: { type: [string, "null"] }
        channel_id: { type: [string, "null"] }
        message_id: { type: [string, "null"] }
        dm_channel_id: { type: [string, "null"] }
        payload: { type: object, additionalProperties: true }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, user_id, kind, actor_id, actor, server_id, channel_id, message_id, dm_channel_id, payload, read_at, created_at]
    NotificationPage:
      description: models.NotificationPage — GET /api/users/me/notifications payload.
      type: object
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        has_more: { type: boolean }
      required: [notifications, has_more]

    # ── Saved messages ──
    SavedChannelMessage:
      description: >-
        models.SavedChannelMessage — the bookmark view of a channel message:
        enough to render a preview and deep-link, never the full
        attachment/reaction/mention graph. E2EE bodies stay opaque (content
        null, ciphertext set) exactly as on Message.
      type: object
      properties:
        id: { type: string }
        channel_id: { type: string }
        server_id: { type: string }
        channel_name: { type: string }
        server_name: { type: string }
        user_id: { type: string }
        content: { type: [string, "null"] }
        encryption_version: { type: integer, enum: [0, 1] }
        ciphertext: { type: string }
        sender_device_id: { type: string }
        e2ee_metadata: { type: string }
        created_at: { type: string, format: date-time }
        attachment_count: { type: integer, minimum: 0 }
        author:
          oneOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: "null"
      required: [id, channel_id, server_id, channel_name, server_name, user_id, content, encryption_version, created_at, attachment_count, author]
    SavedDMMessage:
      description: models.SavedDMMessage — the DM counterpart of SavedChannelMessage.
      type: object
      properties:
        id: { type: string }
        dm_channel_id: { type: string }
        user_id: { type: string }
        content: { type: [string, "null"] }
        encryption_version: { type: integer, enum: [0, 1] }
        ciphertext: { type: string }
        sender_device_id: { type: string }
        e2ee_metadata: { type: string }
        created_at: { type: string, format: date-time }
        attachment_count: { type: integer, minimum: 0 }
        author:
          oneOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: "null"
      required: [id, dm_channel_id, user_id, content, encryption_version, created_at, attachment_count, author]
    SavedMessage:
      description: >-
        models.SavedMessage — one bookmark. When `unavailable` is false,
        exactly one of `message` / `dm_message` is non-null (mirroring
        `message_id` / `dm_message_id`). When `unavailable` is true both are
        null — the referenced message is gone or the caller can no longer
        read it — and only the row's own columns are exposed. `created_at`
        is RFC3339 UTC (the DB stores 'YYYY-MM-DD HH:MM:SS' text; the
        repository converts on read).
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        note: { type: [string, "null"], maxLength: 1024 }
        created_at: { type: string, format: date-time }
        message_id: { type: [string, "null"] }
        dm_message_id: { type: [string, "null"] }
        message:
          oneOf:
            - $ref: '#/components/schemas/SavedChannelMessage'
            - type: "null"
        dm_message:
          oneOf:
            - $ref: '#/components/schemas/SavedDMMessage'
            - type: "null"
        unavailable: { type: boolean }
      required: [id, user_id, note, created_at, message_id, dm_message_id, message, dm_message, unavailable]
    SavedMessagePage:
      description: >-
        models.SavedMessagePage — GET /api/users/me/saved payload.
        `next_before` is the id of the page's last raw row (null when
        `has_more` is false).
      type: object
      properties:
        saved:
          type: array
          items: { $ref: '#/components/schemas/SavedMessage' }
        has_more: { type: boolean }
        next_before: { type: [string, "null"] }
      required: [saved, has_more, next_before]
    SavedMessageIDs:
      description: models.SavedMessageIDs — GET /api/users/me/saved/ids payload.
      type: object
      properties:
        message_ids:
          type: array
          items: { type: string }
        dm_message_ids:
          type: array
          items: { type: string }
      required: [message_ids, dm_message_ids]
    CreateSavedMessageRequest:
      description: models.CreateSavedMessageRequest — body of POST /api/users/me/saved. Exactly one of message_id / dm_message_id.
      type: object
      properties:
        message_id: { type: string }
        dm_message_id: { type: string }
        note: { type: [string, "null"], maxLength: 1024 }
    UpdateSavedNoteRequest:
      description: models.UpdateSavedNoteRequest — body of PATCH /api/users/me/saved/{id}. null/empty clears the note.
      type: object
      properties:
        note: { type: [string, "null"], maxLength: 1024 }
      required: [note]

    # ── User notes ──
    UserNote:
      description: >-
        models.UserNote — GET/PUT /api/users/{userId}/note payload.
        `updated_at` is RFC3339 UTC, null when no note is stored (then
        `note` is "").
      type: object
      properties:
        note: { type: string, maxLength: 1024 }
        updated_at: { type: [string, "null"], format: date-time }
      required: [note, updated_at]
    UpsertUserNoteRequest:
      description: models.UpsertUserNoteRequest — body of PUT /api/users/{userId}/note. An empty note deletes the row.
      type: object
      properties:
        note: { type: string, maxLength: 1024 }
      required: [note]

    # ── Custom emojis ──
    ServerEmoji:
      description: >-
        models.ServerEmoji — one server custom emoji. `url` is
        "/api/uploads/emojis/{id}.png" and `animated_url`
        "/api/uploads/emojis/{id}.gif" (null for static emojis); both are
        server-generated. Message content references an emoji as
        `<:name:id>` / `<a:name:id>`; a reaction stores `<:id>` / `<a:id>`
        and is accepted only from a member of the emoji's server.
        `created_by` is null once the creator's account is deleted.
        `cloned_from` is the source emoji id when this emoji is a copy (the
        source may since be gone); a copy is never copyable.
        `created_at` is RFC3339 UTC.
      type: object
      properties:
        id: { type: string, pattern: '^[a-f0-9]{16}$' }
        server_id: { type: string }
        name: { type: string, pattern: '^[a-z0-9_]{2,32}$' }
        display_name: { type: string, minLength: 1, maxLength: 32 }
        animated: { type: boolean }
        url: { type: string }
        animated_url: { type: [string, "null"] }
        copyable: { type: boolean }
        created_by: { type: [string, "null"] }
        cloned_from: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
      required: [id, server_id, name, display_name, animated, url, animated_url, copyable, created_by, cloned_from, created_at]
    UpdateServerEmojiRequest:
      description: models.UpdateEmojiRequest — body of PATCH /api/servers/{serverId}/emojis/{emojiId}; at least one field.
      type: object
      properties:
        name: { type: string, pattern: '^[a-z0-9_]{2,32}$' }
        display_name: { type: string, minLength: 1, maxLength: 32 }
        copyable: { type: boolean }

    # ── Server stickers ──
    ServerSticker:
      description: >-
        models.ServerSticker — one server sticker. `url` is
        "/api/uploads/stickers/{id}.png" and `animated_url`
        "/api/uploads/stickers/{id}.gif" (null for static stickers); both
        are server-generated. `description` is never null ("" when unset),
        `tags` never null ([] when none). `cloned_from` is the source
        sticker id when this sticker is a copy (never copyable).
        `created_by` is null once the creator's account is deleted.
        `created_at` is RFC3339 UTC.
      type: object
      properties:
        id: { type: string, pattern: '^[a-f0-9]{16}$' }
        server_id: { type: string }
        name: { type: string, pattern: '^[a-z0-9_]{2,32}$' }
        display_name: { type: string, minLength: 1, maxLength: 32 }
        description: { type: string, maxLength: 100 }
        tags:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 20 }
        animated: { type: boolean }
        url: { type: string }
        animated_url: { type: [string, "null"] }
        copyable: { type: boolean }
        cloned_from: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
      required: [id, server_id, name, display_name, description, tags, animated, url, animated_url, copyable, cloned_from, created_by, created_at]
    UpdateServerStickerRequest:
      description: >-
        models.UpdateStickerRequest — body of PATCH
        /api/servers/{serverId}/stickers/{stickerId}; at least one field.
        Tags are trimmed and de-duplicated case-insensitively; a tag with a
        comma is rejected (EXPRESSION_TAGS_INVALID).
      type: object
      properties:
        name: { type: string, pattern: '^[a-z0-9_]{2,32}$' }
        display_name: { type: string, minLength: 1, maxLength: 32 }
        description: { type: string, maxLength: 100 }
        tags:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 20 }
        copyable: { type: boolean }
    CloneExpressionRequest:
      description: >-
        models.CloneExpressionRequest — body of POST
        /api/servers/{serverId}/{emojis|stickers}/clone. `name` optionally
        renames the copy (e.g. when the source name is taken in the target
        server); blank or absent keeps the source's name.
      type: object
      properties:
        source_id: { type: string, pattern: '^[a-f0-9]{16}$' }
        name: { type: [string, "null"], pattern: '^[a-z0-9_]{2,32}$' }
      required: [source_id]

    # ── Entrance sounds ──
    EntranceSound:
      description: >-
        models.EntranceSound — one uploaded clip. `url` is
        "/api/uploads/entrance/{id}.wav" (server-generated, public while the
        row exists); `duration_ms` and `size` are measured by the server.
        `created_at` is RFC3339 UTC.
      type: object
      properties:
        id: { type: string, pattern: '^[a-f0-9]{16}$' }
        name: { type: string, minLength: 1, maxLength: 32 }
        url: { type: string, pattern: '^/api/uploads/entrance/[a-f0-9]{16}\.wav$' }
        duration_ms: { type: integer, minimum: 100, maximum: 5000 }
        size: { type: integer }
        created_at: { type: string, format: date-time }
      required: [id, name, url, duration_ms, size, created_at]
    EntrancePreset:
      description: >-
        models.EntrancePreset — strict parametric preset, schema v1. No other
        field is accepted; the raw document is at most 256 bytes and is
        stored re-serialized in this field order. Note patterns and volume
        are client-side (the listener sets the volume).
      type: object
      additionalProperties: false
      properties:
        v: { type: integer, enum: [1] }
        theme: { type: string, enum: [chime, rise, fall, arcade, bell, fanfare] }
        waveform: { type: string, enum: [sine, triangle, square, sawtooth] }
        pitch: { type: integer, minimum: -12, maximum: 12, description: Semitones. }
        duration_ms: { type: integer, minimum: 150, maximum: 2000 }
      required: [v, theme, waveform, pitch, duration_ms]
    EntranceSelection:
      description: >-
        models.EntranceSelection — one scope's choice. `scope` is "global" or
        a server id; exactly one of `sound_id` / `preset` is non-null,
        matching `kind`. `updated_at` is RFC3339 UTC.
      type: object
      properties:
        scope: { type: string }
        kind: { type: string, enum: [clip, preset] }
        sound_id: { type: [string, "null"] }
        preset:
          oneOf:
            - $ref: '#/components/schemas/EntrancePreset'
            - type: "null"
        updated_at: { type: string, format: date-time }
      required: [scope, kind, sound_id, preset, updated_at]
    EntranceMine:
      description: models.EntranceMineResponse — body of GET /api/users/me/entrance-sounds.
      type: object
      properties:
        sounds:
          type: array
          items: { $ref: '#/components/schemas/EntranceSound' }
        selections:
          type: array
          items: { $ref: '#/components/schemas/EntranceSelection' }
      required: [sounds, selections]
    PutEntranceSelectionRequest:
      description: >-
        models.PutEntranceSelectionRequest — body of PUT
        /api/users/me/entrance-selection. `sound_id` for kind "clip",
        `preset` for kind "preset", neither for "none".
      type: object
      properties:
        scope: { type: string, description: '"global" or a server id.' }
        kind: { type: string, enum: [clip, preset, none] }
        sound_id: { type: string, pattern: '^[a-f0-9]{16}$' }
        preset: { $ref: '#/components/schemas/EntrancePreset' }
      required: [scope, kind]
    ServerEntranceSettings:
      description: models.ServerEntranceSettings — a server's entrance-sound configuration.
      type: object
      properties:
        server_id: { type: string }
        enabled: { type: boolean }
        max_duration_ms: { type: integer, minimum: 500, maximum: 5000 }
        disabled_channel_ids:
          type: array
          items: { type: string }
      required: [server_id, enabled, max_duration_ms, disabled_channel_ids]
    PatchServerEntranceSettingsRequest:
      description: >-
        models.PatchServerEntranceSettingsRequest — body of PATCH
        /api/servers/{serverId}/entrance-settings; at least one field.
      type: object
      properties:
        enabled: { type: boolean }
        max_duration_ms: { type: integer, minimum: 500, maximum: 5000 }
    SetChannelEntranceRequest:
      description: models.SetChannelEntranceRequest — body of PUT /api/servers/{serverId}/channels/{channelId}/entrance.
      type: object
      properties:
        enabled: { type: boolean }
      required: [enabled]
    EntranceMutes:
      description: models.EntranceMutesResponse — body of GET /api/servers/{serverId}/entrance-mutes.
      type: object
      properties:
        user_ids:
          type: array
          items: { type: string }
      required: [user_ids]
    EntranceSoundPlayEvent:
      description: >-
        models.EntranceSoundPlayEvent — the `d` of the WS op
        `entrance_sound_play`, sent only to the voice channel's participants
        (the joiner included) after a fresh, authorized join, at most once
        per user per 30 s. Not bot-readable. `sound_url` is present only for
        kind "clip", `preset` only for kind "preset". Clients stop the clip
        at `play_ms` (the clip length capped by the server's
        max_duration_ms) and should re-validate `sound_url` against
        ^/api/uploads/entrance/[a-f0-9]{16}\.wav$ and the preset against the
        EntrancePreset schema.
      type: object
      properties:
        server_id: { type: string }
        channel_id: { type: string }
        user_id: { type: string }
        kind: { type: string, enum: [clip, preset] }
        sound_url: { type: string }
        preset: { $ref: '#/components/schemas/EntrancePreset' }
        play_ms: { type: integer }
      required: [server_id, channel_id, user_id, kind, play_ms]
    # ── Cosmetics ──
    CosmeticItem:
      description: >-
        models.CosmeticItem — one catalog item. `server_id` null = built-in.
        `asset` is the canonical asset document for (type, format): svg
        {"v":1,"frame":key}; nameplate {"v":1,"stops":[hex x2-3],"angle":0-359,"pattern":p};
        name_style {"v":1,"font":f,"stops":[hex x1-2],"angle":0-359};
        profile_theme {"v":1,"accent":hex,"gradient":[hex,hex],"angle":0-359};
        profile_effect {"v":1,"effect":e,"color":hex}; raster frame (server
        items only) {"v":1,"url":U,"animated_url":A?}. Hex is #rrggbb lower
        case. Clients re-validate before rendering. `created_at` is RFC3339 UTC.
      type: object
      properties:
        id: { type: string }
        server_id: { type: [string, "null"] }
        type: { type: string, enum: [avatar_frame, nameplate, name_style, profile_theme, profile_effect] }
        format: { type: string, enum: [svg, css, raster] }
        name: { type: string }
        description: { type: [string, "null"] }
        asset: { type: object }
        animated: { type: boolean }
        availability: { type: string, enum: [free, granted] }
        created_at: { type: string, format: date-time }
      required: [id, server_id, type, format, name, description, asset, animated, availability, created_at]
    EquippedCosmetic:
      description: >-
        models.EquippedCosmetic — one filled slot, from the equip-time
        snapshot of the item's canonical asset.
      type: object
      properties:
        item_id: { type: string }
        format: { type: string, enum: [svg, css, raster] }
        animated: { type: boolean }
        asset: { type: object }
      required: [item_id, format, animated, asset]
    CosmeticSlots:
      description: >-
        models.CosmeticSlots — slot type to equipped item; only filled slots
        are present, `{}` when none.
      type: object
      properties:
        avatar_frame: { $ref: '#/components/schemas/EquippedCosmetic' }
        nameplate: { $ref: '#/components/schemas/EquippedCosmetic' }
        name_style: { $ref: '#/components/schemas/EquippedCosmetic' }
        profile_theme: { $ref: '#/components/schemas/EquippedCosmetic' }
        profile_effect: { $ref: '#/components/schemas/EquippedCosmetic' }
      additionalProperties: false
    CosmeticGrant:
      description: >-
        models.CosmeticGrant — a granted server item given to the caller.
        `granted_by` is null once the granting account is gone.
        `granted_at` is RFC3339 UTC.
      type: object
      properties:
        item_id: { type: string }
        server_id: { type: string }
        granted_by:
          oneOf:
            - type: object
              properties:
                id: { type: string }
                username: { type: string }
                display_name: { type: [string, "null"] }
              required: [id, username, display_name]
            - type: "null"
        reason: { type: string }
        granted_at: { type: string, format: date-time }
      required: [item_id, server_id, granted_by, reason, granted_at]
    MyCosmetics:
      description: >-
        models.MyCosmetics — body of GET /api/users/me/cosmetics and of PUT
        /api/users/me/cosmetics/equipped.
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CosmeticItem' }
        grants:
          type: array
          items: { $ref: '#/components/schemas/CosmeticGrant' }
        equipped:
          type: object
          properties:
            global: { $ref: '#/components/schemas/CosmeticSlots' }
            servers:
              type: object
              additionalProperties: { $ref: '#/components/schemas/CosmeticSlots' }
          required: [global, servers]
        plain_server_ids:
          type: array
          items: { type: string }
      required: [items, grants, equipped, plain_server_ids]
    EquipRequest:
      description: >-
        models.EquipRequest — body of PUT /api/users/me/cosmetics/equipped.
        1-5 slot keys; an item id equips, null clears.
      type: object
      additionalProperties: false
      properties:
        scope: { type: string, description: '"global" or a server id.' }
        slots:
          type: object
          minProperties: 1
          maxProperties: 5
          additionalProperties: false
          properties:
            avatar_frame: { type: [string, "null"] }
            nameplate: { type: [string, "null"] }
            name_style: { type: [string, "null"] }
            profile_theme: { type: [string, "null"] }
            profile_effect: { type: [string, "null"] }
      required: [scope, slots]
    SetCosmeticPlainServerRequest:
      description: models.SetPlainServerRequest — body of PUT /api/users/me/cosmetics/plain-servers/{serverId}.
      type: object
      additionalProperties: false
      properties:
        plain: { type: boolean }
      required: [plain]
    CosmeticsLookup:
      description: models.CosmeticsLookupResponse — body of GET /api/users/cosmetics.
      type: object
      properties:
        users:
          type: object
          additionalProperties: { $ref: '#/components/schemas/CosmeticSlots' }
      required: [users]
    ServerCosmetics:
      description: models.ServerCosmeticsResponse — body of GET /api/servers/{serverId}/cosmetics.
      type: object
      properties:
        server_id: { type: string }
        users:
          type: object
          additionalProperties: { $ref: '#/components/schemas/CosmeticSlots' }
      required: [server_id, users]
    CosmeticsUpdateEvent:
      description: >-
        models.CosmeticsUpdateEvent — the `d` of the WS op
        `user_cosmetics_update`. Not bot-readable. With `server_id` a server
        id it goes to that server and carries the user's slots resolved for
        it (`plain: true` and `{}` slots when the user looks plain there);
        with `server_id` null it goes to the user only and carries their
        global slots. One event per affected context per request.
      type: object
      properties:
        user_id: { type: string }
        server_id: { type: [string, "null"] }
        slots: { $ref: '#/components/schemas/CosmeticSlots' }
        plain: { type: boolean }
      required: [user_id, server_id, slots, plain]
