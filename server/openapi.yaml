        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # ── E2EE public device/prekey enumeration (rate-limited) ──
  /api/users/{userId}/devices:
    get:
      operationId: devicesListPublic
      summary: List another user's public E2EE device identities.
      description: >-
        Per-IP rate limited (P0-BD-02) — public key-material enumeration is a
        historically abused vector for user/device fingerprinting.
      tags: [E2EE-Devices]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }
  /api/users/{userId}/prekey-bundles:
    get:
      operationId: devicesGetPrekeyBundles
      summary: Fetch X3DH prekey bundles for another user's devices.
      description: >-
        Per-IP rate limited (P0-BD-02) — see devicesListPublic. Consuming a
        one-time prekey here depletes that device's pool; ErrPrekeyExhausted
        maps to 409 when the pool is empty.
      tags: [E2EE-Devices]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/TooManyRequestsError' }

