      requestBody: { $ref: '#/components/requestBodies/StubJSON' }
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /api/dms/messages/{id}/pin:
    post:
      operationId: dmMessagesPin
      summary: Pin a DM message.
      tags: [Pins]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: DM message ID.
      responses:
        '200': { $ref: '#/components/responses/StubOK' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      operationId: dmMessagesUnpin
      summary: Unpin a DM message.
      tags: [Pins]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
